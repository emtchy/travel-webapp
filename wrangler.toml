# Must match the Worker name in your Cloudflare dashboard.
# If you connected a GitHub repo, that name wins — change this to match it.
name = "london-sights-vote"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# Serves everything in public/ ; /api/* is handled by the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "london-votes"
# `npm run setup` fills this in. It MUST be committed — the build reads it from the repo.
database_id = "PASTE_YOUR_DATABASE_ID_HERE"

# Optional shared passphrase. Leave commented out for open access.
# Set it for real with:  npx wrangler secret put ACCESS_CODE
# [vars]
# ACCESS_CODE = "london2026"
