name = "travel-webapp"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# Everything in public/ is served through the Worker: pages live under
# /t/<trip>/, the old page addresses redirect there, and /api/* is the API.
# run_worker_first makes the Worker see every request rather than only the
# ones no asset matches — without it /plan would be served as a file before
# the redirect could happen.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
# The Worker names the exact file it wants (/plan.html); the default handling
# would answer that with a redirect to /plan, which the Worker then sends to
# /t/1/plan, which asks for /plan.html again — a loop.
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "london-votes"
database_id = "d7412b9d-0cca-4b50-b13e-10c8476fceba"

[vars]
# Who sign-in emails come from. Resend's test sender can only reach the
# address the Resend account was made with; a verified domain reaches anyone.
MAIL_FROM = "Trip <onboarding@resend.dev>"

# Secrets, set once with `npx wrangler secret put <NAME>`, never in this file:
#   RESEND_API_KEY   sign-in emails go through Resend. Unset locally, which
#                    makes /api/auth/request return the link instead of mailing it.
