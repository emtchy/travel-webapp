<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
<title>Bookings</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230A66E0'/><path d='M50 18l9.6 23.3 25.2 2.1-19.2 16.5 5.9 24.6L50 71.5 28.5 84.5l5.9-24.6L15.2 43.4l25.2-2.1z' fill='white'/></svg>">
<link rel="stylesheet" href="/app.css">
<style>
/* ---- still to book ---- */
.list{display:grid;gap:12px;margin-top:20px}
@media (min-width:860px){.list{grid-template-columns:repeat(2,1fr)}}
.item{display:flex;flex-direction:column;gap:9px;padding:16px 18px}
.itop{display:flex;gap:10px;align-items:flex-start}
.iname{font-weight:600;font-size:16px;line-height:1.3;flex:1;letter-spacing:-.01em}
.price{font-size:13.5px;color:var(--amber);white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.blurb{font-size:13.5px;color:var(--text-2);margin:0}
.voters{font-size:12.5px;color:var(--text-3)}
.voters b{color:var(--text-2);font-weight:600}
.iact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:12px;margin-top:auto;border-top:1px solid var(--hair)}
.iact .remove{margin-left:auto}

/* ---- slot form ---- */
.slot{padding-top:12px;margin-top:auto;border-top:1px solid var(--hair);display:grid;gap:10px}
.slotrow{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap}
.slot .field{flex:1 1 110px}
.slot .input{height:34px;font-size:14px}
.slot .hint{flex-basis:100%}

/* ---- booked ---- */
.section{margin-top:32px}
.section-head{display:flex;align-items:baseline;gap:9px;margin:0 0 4px}
.section-head h2{font-size:19px;font-weight:700;letter-spacing:-.015em}
.section-head .count{font-size:12.5px;color:var(--text-3);font-weight:600}
.section .note{margin:0 0 12px}
.done .tick{width:26px;height:26px;border-radius:50%;background:var(--green-soft);color:var(--green);
  display:grid;place-items:center;flex:none}
.done .tick svg{width:14px;height:14px}
.done .n{font-weight:600;font-size:15px;flex:1;min-width:140px}
.done .price{color:var(--text-2)}
.done .voters{white-space:nowrap}
.done.editing{display:grid;gap:8px}
.slotshown{font-size:12.5px;font-variant-numeric:tabular-nums}
.gone{margin-top:22px}
.grow .n{flex:1;min-width:160px;font-size:14.5px}
.gone .voters{white-space:nowrap}
@media (max-width:640px){
  .row.done{flex-wrap:wrap}
  .done .voters{flex-basis:100%;margin-left:38px;white-space:normal}
}
</style>
</head>
<body>

<div id="shell" data-page="bookings"></div>

<main class="page">
<header class="page-head">
  <p class="eyebrow" id="kicker"></p>
  <h1 class="large-title" id="headline"></h1>
  <p class="subtitle" id="lede"></p>
</header>

<div class="stat-row" id="stats"></div>
<div class="toolbar" id="filters"></div>
<div class="list" id="list"></div>
<p class="empty" id="empty" hidden></p>
<div id="booked"></div>
<div id="gone"></div>

<footer class="page-foot"><span id="foot"></span></footer>
</main>

<script type="module">
import { $, esc, api, ICONS, getLang, onLang, nameOf, askName, fillMembers,
         setStatus, setTrip, tripKicker, dayShort } from "/shell.js";

const T = {
  en: {
    pageTitle: "Bookings",
    headline: "What needs booking",
    lede: "Everything on the list that costs money or has to be booked ahead. Take anything off that you've decided against — it stays on the Sights page either way.",
    loading: "Loading…", saving: "Saving…", saved: "Saved",
    needName: "Enter your name in the bar first.",
    needDate: "Pick a date to go with that time.",
    statTotal: "still to book", statBooked: "booked", statBook: "need booking", statOurs: "added by us",
    fVotes: "Votes", fAll: "All", fPlus: "+", fType: "Kind",
    fOr: "or", fCustom: "any", fCustomTitle: "Type a threshold — 3 means three votes or more",
    fBuiltIn: "Built-in", fAdded: "Added by us", fBookOnly: "Booking only",
    tagPaid: "Paid", tagBook: "Book ahead", tagAdded: "Added by us", tagLimited: "Limited entry",
    open: "Open site", remove: "Not booking this",
    markBooked: "Booked", unbook: "Not booked",
    slotDate: "Date", slotTime: "From", slotEnd: "To", slotConfirm: "Save booking",
    slotCancel: "Cancel", slotHint: "Leave blank if there's no fixed slot.",
    editSlot: "Change slot", noSlot: "no fixed slot",
    bookedTitle: "Booked", bookedNote: "Sorted. Nothing left to do for these.",
    bookedBy: "booked by", on: "on",
    wanted: (n) => `${n} ${n === 1 ? "vote" : "votes"}`,
    noVotes: "No votes yet",
    empty: "Nothing matches those filters.",
    emptyAll: "Nothing on the list costs anything yet. Tick “it costs something” when adding a sight and it will show up here.",
    allDone: "Everything is booked. Nothing left to sort out.",
    goneTitle: "Not booking these",
    goneNote: "Still on the Sights page, still keeping their votes — just not something we're booking.",
    restore: "Back to the list", by: "removed by",
    foot: "Prices are what each place lists publicly and are per person unless it says otherwise. Check the official site before booking.",
  },
  de: {
    pageTitle: "Buchungen",
    headline: "Was gebucht werden muss",
    lede: "Alles auf der Liste, was Geld kostet oder vorab gebucht werden muss. Nimm raus, wogegen ihr euch entschieden habt – auf der Orte-Seite bleibt es trotzdem.",
    loading: "Lädt…", saving: "Speichert…", saved: "Gespeichert",
    needName: "Trag oben zuerst deinen Namen ein.",
    needDate: "Zu der Uhrzeit fehlt noch das Datum.",
    statTotal: "noch zu buchen", statBooked: "gebucht", statBook: "vorab buchen", statOurs: "von uns",
    fVotes: "Stimmen", fAll: "Alle", fPlus: "+", fType: "Art",
    fOr: "oder", fCustom: "beliebig", fCustomTitle: "Schwelle eintippen – 3 heißt drei Stimmen oder mehr",
    fBuiltIn: "Vorgegeben", fAdded: "Von uns", fBookOnly: "Nur Buchung",
    tagPaid: "Kostet", tagBook: "Vorab buchen", tagAdded: "Von uns", tagLimited: "Begrenzter Einlass",
    open: "Website", remove: "Buchen wir nicht",
    markBooked: "Gebucht", unbook: "Doch nicht gebucht",
    slotDate: "Datum", slotTime: "Von", slotEnd: "Bis", slotConfirm: "Buchung speichern",
    slotCancel: "Abbrechen", slotHint: "Leer lassen, wenn es keinen festen Termin gibt.",
    editSlot: "Termin ändern", noSlot: "kein fester Termin",
    bookedTitle: "Gebucht", bookedNote: "Alles erledigt.",
    bookedBy: "gebucht von", on: "am",
    wanted: (n) => `${n} ${n === 1 ? "Stimme" : "Stimmen"}`,
    noVotes: "Noch keine Stimmen",
    empty: "Nichts passt zu diesen Filtern.",
    emptyAll: "Noch kostet nichts auf der Liste etwas. Hak beim Hinzufügen „kostet etwas“ an, dann erscheint es hier.",
    allDone: "Alles gebucht. Nichts mehr zu erledigen.",
    goneTitle: "Buchen wir nicht",
    goneNote: "Stehen weiterhin auf der Orte-Seite und behalten ihre Stimmen – wir buchen sie nur nicht.",
    restore: "Zurück zur Liste", by: "entfernt von",
    foot: "Preise sind die öffentlich genannten und gelten pro Person, sofern nicht anders angegeben. Vor dem Buchen auf der offiziellen Seite prüfen.",
  },
};
const t = () => T[getLang()];

// Bounds for the date picker. Filled from the trip once it loads.
let TRIPINFO = null;
let TRIP_START = "";
let TRIP_END = "";

let SIGHTS = [], CUSTOM = [], VOTES = {}, STATUS = [];
let booking = null;              // id of the card currently being booked
let minVotes = 0;
let kind = "all";        // all | builtin | added | booking

const title = (s) => (getLang() === "de" && s.name_de) || s.name;
const blurb = (s) => (getLang() === "de" && s.summary_de) || s.summary || "";
const priceOf = (s) => (getLang() === "de" && s.priceLabel_de) || s.priceLabel || "";

/* ------------------------------------------------------------ the list */

/**
 * A sight belongs here if it costs money or has to be booked ahead. Built-ins
 * answer that from their own fields; added ones from what the person ticked.
 * Some places are free but still need a slot reserved, so cost alone isn't the test.
 */
const costsMoney = (s) => (s.custom ? !!s.costs : s.cost !== "free");
const needsBooking = (s) => !!s.bookingRequired;
const bookable = (s) => costsMoney(s) || needsBooking(s);

const votesFor = (s) => VOTES[s.id] ?? [];
const statusOf = (id) => STATUS.find((x) => x.id === id) ?? null;
const stateOf = (id) => statusOf(id)?.status ?? "todo";

const everything = () => [...SIGHTS, ...CUSTOM].filter(bookable);
const inState = (what) => everything().filter((s) => stateOf(s.id) === what);
const onList = () => inState("todo");

function matches(s) {
  if (votesFor(s).length < minVotes) return false;
  if (kind === "builtin" && s.custom) return false;
  if (kind === "added" && !s.custom) return false;
  if (kind === "booking" && !needsBooking(s)) return false;
  return true;
}

const byWant = (a, b) =>
  votesFor(b).length - votesFor(a).length ||
  (a.rank ?? 999) - (b.rank ?? 999) ||
  title(a).localeCompare(title(b));

/* --------------------------------------------------------------- render */

function itemHTML(s) {
  const L = t();
  const who = votesFor(s);
  const price = priceOf(s);
  const limited = !s.custom && s.cost === "free-limited";

  const tags = [
    costsMoney(s) ? `<span class="tag tag-amber">${esc(L.tagPaid)}</span>` : "",
    needsBooking(s) ? `<span class="tag tag-coral">${esc(L.tagBook)}</span>` : "",
    limited ? `<span class="tag tag-coral">${esc(L.tagLimited)}</span>` : "",
    s.custom ? `<span class="tag tag-violet">${esc(L.tagAdded)}</span>` : "",
  ].filter(Boolean).join("");

  return `<article class="item card">
    <div class="itop">
      <span class="iname">${esc(title(s))}</span>
      ${price ? `<span class="price">${esc(price)}</span>` : ""}
    </div>
    <div class="tags">${tags}</div>
    ${blurb(s) ? `<p class="blurb">${esc(blurb(s).slice(0, 160))}${blurb(s).length > 160 ? "…" : ""}</p>` : ""}
    <div class="voters">${who.length
      ? `<b>${esc(L.wanted(who.length))}</b> · ${esc(who.join(", "))}`
      : esc(L.noVotes)}</div>
    ${booking === s.id ? slotFormHTML(s) : `<div class="iact">
      <button class="btn btn-sm btn-green" data-open-slot="${esc(s.id)}" type="button">${ICONS.check}${esc(L.markBooked)}</button>
      ${s.url ? `<a class="btn btn-sm btn-quiet" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(L.open)}${ICONS.external}</a>` : ""}
      <button class="remove btn btn-sm btn-ghost danger" data-set="skipped" data-id="${esc(s.id)}" type="button">${esc(L.remove)}</button>
    </div>`}
  </article>`;
}

/** Date and time of the slot we hold. Both optional — plenty has no fixed time. */
function slotFormHTML(s) {
  const L = t();
  const st = statusOf(s.id);
  return `<div class="slot" data-slot="${esc(s.id)}">
    <div class="slotrow">
      <label class="field"><span>${esc(L.slotDate)}</span>
        <input class="input" type="date" data-date min="${TRIP_START}" max="${TRIP_END}"
               value="${esc(st?.date ?? "")}"></label>
      <label class="field"><span>${esc(L.slotTime)}</span>
        <input class="input" type="time" data-time value="${esc(st?.time ?? "")}"></label>
      <label class="field"><span>${esc(L.slotEnd)}</span>
        <input class="input" type="time" data-end value="${esc(st?.endTime ?? "")}"></label>
    </div>
    <div class="slotrow">
      <button class="btn btn-sm btn-primary" data-confirm="${esc(s.id)}" type="button">${esc(L.slotConfirm)}</button>
      <button class="btn btn-sm btn-ghost" data-cancel type="button">${esc(L.slotCancel)}</button>
      <span class="note hint">${esc(L.slotHint)}</span>
    </div>
  </div>`;
}

/** A booked one: same identity, but finished, so it needs far less on it. */
function bookedHTML(s) {
  const L = t();
  const st = statusOf(s.id);
  const price = priceOf(s);

  const slot = st?.date
    ? dayShort(st.date) + (st.time ? `, ${st.time}${st.endTime ? `–${st.endTime}` : ""}` : "")
    : L.noSlot;

  if (booking === s.id)
    return `<div class="row done editing"><span class="n">${esc(title(s))}</span>${slotFormHTML(s)}</div>`;

  return `<div class="row done" data-id="${esc(s.id)}">
    <span class="tick" aria-hidden="true">${ICONS.check}</span>
    <span class="n">${esc(title(s))}</span>
    <span class="tag ${st?.date ? "tag-green" : "tag-neutral"} slotshown">${esc(slot)}</span>
    ${price ? `<span class="price">${esc(price)}</span>` : ""}
    <span class="voters">${esc(L.bookedBy)} ${esc(st?.by ?? "?")}</span>
    <button class="btn btn-sm btn-quiet" data-open-slot="${esc(s.id)}" type="button">${esc(L.editSlot)}</button>
    <button class="btn btn-sm btn-ghost" data-set="null" data-id="${esc(s.id)}" type="button">${esc(L.unbook)}</button>
  </div>`;
}

function renderFilters() {
  const L = t();
  const pool = onList();
  const top = pool.reduce((a, s) => Math.max(a, votesFor(s).length), 0);

  // Only offer thresholds the votes can actually tell apart.
  const steps = Array.from({ length: Math.min(top, 6) + 1 }, (_, n) => n);
  const countAt = (n) => pool.filter((s) => votesFor(s).length >= n).length;

  const votesBtns = steps.map((n) =>
    `<button class="chip" type="button" data-votes="${n}" aria-pressed="${minVotes === n}">${
      n === 0 ? esc(L.fAll) : n + esc(L.fPlus)} <b>${countAt(n)}</b></button>`).join("");

  // The buttons stop at the highest vote count anyone has, which is the useful
  // range — but you can always type a number instead.
  const typed = !steps.includes(minVotes);
  const manual =
    `<span class="chip-input"><span class="or">${esc(L.fOr)}</span>` +
    `<input type="number" id="vmin" min="0" max="99" step="1"` +
    ` title="${esc(L.fCustomTitle)}" aria-label="${esc(L.fCustomTitle)}"` +
    ` placeholder="${esc(L.fCustom)}" value="${typed ? minVotes : ""}"` +
    `${typed ? ' class="on"' : ""}>` +
    `<span class="plus">${esc(L.fPlus)}</span>` +
    `${typed ? `<b>${countAt(minVotes)}</b>` : ""}</span>`;

  const kinds = [
    ["all", L.fAll, pool.length],
    ["builtin", L.fBuiltIn, pool.filter((s) => !s.custom).length],
    ["added", L.fAdded, pool.filter((s) => s.custom).length],
    ["booking", L.fBookOnly, pool.filter(needsBooking).length],
  ].map(([k, label, n]) =>
    `<button class="chip" type="button" data-kind="${k}" aria-pressed="${kind === k}">${esc(label)} <b>${n}</b></button>`).join("");

  $("#filters").innerHTML =
    `<div class="chips"><span class="lbl">${esc(L.fVotes)}</span>${votesBtns}${manual}</div>` +
    `<div class="chips"><span class="lbl">${esc(L.fType)}</span>${kinds}</div>`;
}

function render() {
  const L = t();
  for (const [id, key] of [["headline","headline"],["lede","lede"],["foot","foot"]])
    $("#" + id).textContent = L[key];
  $("#kicker").textContent = tripKicker(TRIPINFO);
  $("#kicker").hidden = !$("#kicker").textContent;
  setTrip(TRIPINFO, L.pageTitle);

  const pool = onList();
  const booked = inState("booked");
  $("#stats").innerHTML = [
    [pool.length, L.statTotal],
    [booked.length, L.statBooked],
    [pool.filter(needsBooking).length, L.statBook],
    [pool.filter((s) => s.custom).length, L.statOurs],
  ].map(([v, k]) => `<div class="stat"><b>${v}</b><span>${esc(k)}</span></div>`).join("");

  renderFilters();

  const shown = pool.filter(matches).sort(byWant);
  $("#list").innerHTML = shown.map(itemHTML).join("");
  $("#empty").hidden = shown.length > 0;
  $("#empty").textContent = !everything().length ? L.emptyAll
    : pool.length === 0 && booked.length ? L.allDone
    : L.empty;

  // Booked things are done, so they are shown in full rather than filtered —
  // hiding a booking behind a vote filter would only make people doubt it.
  const doneList = booked.slice().sort(byWant);
  $("#booked").innerHTML = doneList.length
    ? `<section class="section">
        <div class="section-head"><h2>${esc(L.bookedTitle)}</h2><span class="count">${doneList.length}</span></div>
        <p class="note">${esc(L.bookedNote)}</p>
        <div class="card rows">${doneList.map(bookedHTML).join("")}</div>
      </section>`
    : "";

  const gone = inState("skipped").sort(byWant);
  $("#gone").innerHTML = gone.length
    ? `<details class="disclosure gone"><summary><span>${esc(L.goneTitle)}</span><span class="count">${gone.length}</span></summary>
        <div class="body"><p class="note" style="margin:10px 0 4px">${esc(L.goneNote)}</p>
        <div class="rows">${gone.map((s) => {
          const h = statusOf(s.id);
          return `<div class="row grow" style="padding-left:0;padding-right:0">
            <span class="n">${esc(title(s))}</span>
            <span class="voters">${esc(L.by)} ${esc(h?.by ?? "?")}</span>
            <button class="btn btn-sm btn-quiet" data-set="null" data-id="${esc(s.id)}" type="button">${esc(L.restore)}</button>
          </div>`;
        }).join("")}</div></div></details>`
    : "";
}

/* -------------------------------------------------------------- actions */

async function mutate(path, body) {
  if (!nameOf()) { setStatus(t().needName, "err"); askName(); return; }
  setStatus(t().saving, "sticky");
  try {
    const d = await api(path, { method: "POST", body: JSON.stringify({ ...body, voter: nameOf() }) });
    CUSTOM = d.custom; VOTES = d.votes; STATUS = d.bookings ?? [];
    fillMembers(d.members);
    render();
    setStatus(t().saved);
  } catch (err) { setStatus(err.message, "err"); }
}

document.addEventListener("input", (ev) => {
  if (ev.target.id !== "vmin") return;
  const raw = ev.target.value.trim();
  const n = raw === "" ? 0 : Number(raw);
  if (!Number.isInteger(n) || n < 0 || n > 99) return;
  minVotes = n;
  // Re-render the list, but leave the box you are typing in alone.
  const keep = ev.target;
  const at = keep.selectionStart;
  render();
  const again = $("#vmin");
  if (again) { again.focus(); try { again.setSelectionRange(at, at); } catch {} }
});

document.addEventListener("click", (ev) => {
  const openSlot = ev.target.closest("[data-open-slot]");
  if (openSlot) {
    if (!nameOf()) { setStatus(t().needName, "err"); askName(); return; }
    booking = openSlot.dataset.openSlot;
    return void render();
  }

  if (ev.target.closest("[data-cancel]")) { booking = null; return void render(); }

  const confirm = ev.target.closest("[data-confirm]");
  if (confirm) {
    const box = confirm.closest("[data-slot]");
    const date = $("[data-date]", box).value || null;
    const time = $("[data-time]", box).value || null;
    const end = $("[data-end]", box).value || null;
    if (time && !date) { setStatus(t().needDate, "err"); return; }
    booking = null;
    return void mutate("/api/bookings/status", {
      sightId: confirm.dataset.confirm, status: "booked",
      bookedDate: date, bookedTime: time, bookedEnd: end,
    });
  }

  const set = ev.target.closest("[data-set]");
  if (set)
    return void mutate("/api/bookings/status", {
      sightId: set.dataset.id,
      status: set.dataset.set === "null" ? null : set.dataset.set,
    });

  const v = ev.target.closest("[data-votes]");
  if (v) { minVotes = Number(v.dataset.votes); return void render(); }

  const k = ev.target.closest("[data-kind]");
  if (k) { kind = k.dataset.kind; return void render(); }
});

onLang(() => { if (SIGHTS.length) render(); else { const L = t(); $("#headline").textContent = L.headline; $("#lede").textContent = L.lede; } });

(async () => {
  try {
    const d = await api("/api/sights");
    SIGHTS = d.sights; CUSTOM = d.custom; VOTES = d.votes; STATUS = d.bookings ?? [];
    TRIP_START = d.trip?.startDate ?? ""; TRIP_END = d.trip?.endDate ?? ""; TRIPINFO = d.trip ?? TRIPINFO;
    fillMembers(d.members);
    render();
  } catch (err) { setStatus(err.message, "err"); }
})();
</script>
</body>
</html>
