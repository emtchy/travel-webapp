<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
<title>Trips</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230A66E0'/><path d='M50 18l9.6 23.3 25.2 2.1-19.2 16.5 5.9 24.6L50 71.5 28.5 84.5l5.9-24.6L15.2 43.4l25.2-2.1z' fill='white'/></svg>">
<link rel="stylesheet" href="/app.css">
<style>
/* ---- hero ---- */
.hero{padding:64px 0 36px;display:grid;gap:14px;max-width:640px}
.hero h1{font-size:44px;line-height:1.08;font-weight:700;letter-spacing:-.028em;text-wrap:balance}
.hero p{font-size:18px;color:var(--text-2);line-height:1.5;max-width:52ch}
.hero .cta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.hero .cta .note{font-size:13px;color:var(--text-3)}

/* ---- how it works: three illustrated steps ---- */
.steps{display:grid;gap:16px;margin-top:28px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.step{display:flex;flex-direction:column}
.step .pic{padding:18px 18px 0;background:var(--surface-2);min-height:210px;display:flex;align-items:flex-end;overflow:hidden}
.step .pic > *{width:100%;border-radius:var(--r-md) var(--r-md) 0 0;box-shadow:0 0 0 1px var(--hair),0 8px 24px -14px rgba(0,0,0,.25);
  background:var(--surface);transform:translateY(4px)}
.step .txt{padding:16px 18px 18px}
.step .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--on-tint);
  font-size:12.5px;font-weight:700;margin-bottom:10px}
.step h3{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-bottom:4px}
.step p{font-size:14px;color:var(--text-2);line-height:1.5}

/* the miniatures reuse the real components at a smaller scale */
.mini{font-size:12px;pointer-events:none;user-select:none}
.mini .shot{height:64px;background:linear-gradient(135deg,#BBD6F5,#7FB0E8 55%,#5A94D8);position:relative}
.mini .shot .tag{position:absolute;top:8px;right:8px}
.mini .mb{padding:10px 12px 0}
.mini .mb b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.mini .mb span{display:block;color:var(--text-3);font-size:11.5px;margin-top:1px}
.mini .mf{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--hair);margin-top:10px}
.mini .btn{height:26px;padding:0 10px;font-size:12px}
.mini .btn svg{width:12px;height:12px}
.mini .tally{margin-left:auto;color:var(--text-3);font-size:11.5px}
.mini .tally b{color:var(--text)}
.mini .row{padding:9px 12px;gap:9px}
.mini .row .name{font-size:13px}
.mini .row .meta{font-size:11px;margin-top:1px}
.mini .tick{width:20px;height:20px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
.mini .tick svg{width:11px;height:11px}
.mini .price{margin-left:auto;font-weight:600;color:var(--amber);font-size:12px}
.mini .dayh{display:flex;align-items:baseline;gap:6px;padding:9px 12px;border-bottom:1px solid var(--hair)}
.mini .dayh .wd{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tint)}
.mini .dayh b{font-size:13px;font-weight:700}
.mini .stop{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:8px 12px;border-bottom:1px solid var(--hair)}
.mini .stop:last-child{border-bottom:0}
.mini .when{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.mini .when em{display:block;font-style:normal;font-weight:500;color:var(--text-3);font-size:10.5px}
.mini .sn{font-size:12.5px;font-weight:600;line-height:1.3}
.mini .sm{font-size:11px;color:var(--text-3);margin-top:1px}

/* ---- your trips / examples ---- */
.section{margin-top:44px}
/* the one trip that matters today */
.feat{display:grid;gap:0;overflow:hidden;margin-bottom:16px}
.feat .top{padding:18px 20px 14px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.feat .top .grow{flex:1;min-width:200px}
.feat .phase{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tint);margin-bottom:4px}
.feat .phase.past{color:var(--text-3)}
.feat h3{font-size:22px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.feat .sub{font-size:14px;color:var(--text-2);margin-top:3px}
.feat .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.feat .stops{border-top:1px solid var(--hair)}
.feat .stop{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--hair)}
.feat .stop:last-child{border-bottom:0}
.feat .when{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.feat .when em{display:block;font-style:normal;font-weight:500;color:var(--text-3);font-size:12px}
.feat .when.open{color:var(--text-3);font-weight:500;font-size:12px}
.feat .sn{font-weight:600;font-size:14.5px}
.feat .empty-day{padding:16px 20px;color:var(--text-3);font-size:14px;border-top:1px solid var(--hair)}
.feat .todo{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 18px}
.feat .todo a{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:var(--r-pill);
  background:var(--surface-2);color:var(--text);font-size:13.5px;font-weight:600;text-decoration:none}
.feat .todo a:hover{background:var(--surface-3);text-decoration:none}
.feat .todo a b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:var(--r-pill);
  background:var(--coral-soft);color:var(--coral);font-size:12px}
.feat .todo a.ok b{background:var(--green-soft);color:var(--green)}
.feat .todo .note{align-self:center;font-size:13.5px;color:var(--text-3)}
.feat .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--hair);background:var(--surface-2)}
.pinbtn{margin-left:auto}
.trip .pinbtn{margin-left:0}
.group{margin-top:22px}
.group .eyebrow{margin-bottom:10px;display:flex;align-items:baseline;gap:8px}
.group .eyebrow .count{font-weight:600;color:var(--text-3)}
details.year{margin-top:8px}
details.year > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 0;
  font-size:14px;font-weight:600;color:var(--text-2);user-select:none}
details.year > summary::-webkit-details-marker{display:none}
details.year > summary .chev{display:inline-flex;width:14px;height:14px;transition:transform .15s}
details.year > summary .chev svg{width:14px;height:14px}
details.year[open] > summary .chev{transform:rotate(90deg)}
details.year > .trips{padding:4px 0 8px}
.trip.cancelled .name{color:var(--text-3);text-decoration:line-through}
#mine:not([hidden]) + #how{margin-top:44px}
.section-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.section-head h2{font-size:22px;font-weight:700;letter-spacing:-.015em}
.section-head .count{font-size:12.5px;color:var(--text-3);font-weight:600}
.trips{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.trip{display:flex;flex-direction:column;gap:6px;padding:16px 18px;text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s}
.trip:hover{text-decoration:none;transform:translateY(-1px);box-shadow:0 0 0 1px var(--hair-2),var(--shadow-2)}
.trip .name{font-size:17px;font-weight:600;letter-spacing:-.01em}
.trip .when{font-size:13px;color:var(--text-2)}
.trip .meta{margin-top:2px;font-size:12px;color:var(--text-3)}
.trip .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.signin-card{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px 20px}
.signin-card .ico{width:40px;height:40px;border-radius:50%;background:var(--tint-soft);color:var(--tint);display:grid;place-items:center;flex:none}
.signin-card .ico svg{width:18px;height:18px}
.signin-card .grow{flex:1;min-width:200px}
.signin-card h3{font-size:16px;font-weight:600}
.signin-card p{font-size:13.5px;color:var(--text-2)}
.private{margin-top:44px;padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.private .ico{width:28px;height:28px;border-radius:8px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
.private .ico svg{width:14px;height:14px}
.private p{font-size:13.5px;color:var(--text-2);line-height:1.5}

@media (max-width:760px){
  .hero{padding:36px 0 24px}
  .hero h1{font-size:34px}
  .hero p{font-size:16px}
}
</style>
</head>
<body>

<div id="shell" data-page="home"></div>

<main class="page">

<section class="hero">
  <h1 id="h-title"></h1>
  <p id="h-lede"></p>
  <div class="cta" id="h-cta"></div>
</section>

<section id="how">
  <p class="eyebrow" id="how-eyebrow"></p>
  <div class="steps">
    <div class="step card">
      <div class="pic"><div class="mini">
        <div class="shot"><span class="tag tag-sm tag-green" id="m1-free"></span></div>
        <div class="mb"><b id="m1-name"></b><span id="m1-where"></span></div>
        <div class="mf"><span class="btn btn-sm btn-primary" id="m1-like"></span>
          <span class="tally"><b>3</b> <span id="m1-votes"></span></span></div>
      </div></div>
      <div class="txt"><span class="n">1</span><h3 id="s1-h"></h3><p id="s1-p"></p></div>
    </div>
    <div class="step card">
      <div class="pic"><div class="mini rows">
        <div class="row"><span class="tick" id="m2-tick"></span><div class="grow"><div class="name" id="m2-a"></div>
          <div class="meta" id="m2-a-m"></div></div><span class="price">€18</span></div>
        <div class="row"><span class="tick" style="background:var(--coral-soft);color:var(--coral)" id="m2-warn"></span><div class="grow"><div class="name" id="m2-b"></div>
          <div class="meta" id="m2-b-m"></div></div><span class="price">€24</span></div>
      </div></div>
      <div class="txt"><span class="n">2</span><h3 id="s2-h"></h3><p id="s2-p"></p></div>
    </div>
    <div class="step card">
      <div class="pic"><div class="mini">
        <div class="dayh"><span class="wd" id="m3-wd"></span><b id="m3-day"></b></div>
        <div class="stop"><div class="when">10:00<em>12:00</em></div><div><div class="sn" id="m3-a"></div><div class="sm" id="m3-a-m"></div></div></div>
        <div class="stop"><div class="when">13:30<em>15:00</em></div><div><div class="sn" id="m3-b"></div><div class="sm" id="m3-b-m"></div></div></div>
      </div></div>
      <div class="txt"><span class="n">3</span><h3 id="s3-h"></h3><p id="s3-p"></p></div>
    </div>
  </div>
</section>

<section class="section" id="mine" hidden>
  <div class="section-head"><h2 id="mine-h"></h2><span class="count" id="mine-n"></span>
    <button type="button" class="btn btn-primary btn-sm right" id="new-trip"></button></div>
  <div id="featured"></div>
  <div id="upcoming"></div>
  <div id="past"></div>
  <p id="ex-link" hidden style="margin-top:18px"><a href="#" class="footnote" id="ex-link-a"></a></p>
</section>

<section class="section" id="examples" hidden>
  <div class="section-head"><h2 id="ex-h"></h2></div>
  <p class="footnote" id="ex-lede" style="margin:-6px 0 12px"></p>
  <div class="trips" id="ex-list"></div>
</section>

<section class="section" id="signin" hidden>
  <div class="card signin-card">
    <span class="ico" id="si-ico"></span>
    <div class="grow"><h3 id="si-h"></h3><p id="si-p"></p></div>
    <button type="button" class="btn btn-primary" id="si-btn"></button>
  </div>
</section>

<div class="card private"><span class="ico" id="pv-ico"></span><p id="pv-p"></p></div>

<footer class="page-foot"><span id="foot"></span> · <a href="/privacy" id="foot-privacy"></a></footer>
</main>

<div class="sheet-back" id="nt-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="nt-title">
  <div class="sheet" style="width:min(480px,100%)">
    <header><h2 id="nt-title"></h2><button class="sheet-close" id="nt-close" type="button"></button></header>
    <form class="sheet-body" id="nt-form" style="gap:14px">
      <label class="field"><span id="nt-l-name"></span><input class="input" id="nt-name" type="text" maxlength="80" required></label>
      <label class="field"><span id="nt-l-dest"></span><input class="input" id="nt-dest" type="text" maxlength="80" autocomplete="off"></label>
      <div class="field-row">
        <label class="field"><span id="nt-l-first"></span><input class="input" id="nt-first" type="date"></label>
        <label class="field"><span id="nt-l-last"></span><input class="input" id="nt-last" type="date"></label>
      </div>
      <p class="hint" id="nt-dates-hint" style="margin-top:-6px"></p>
      <div class="field" id="nt-tpl" hidden><span id="nt-l-start"></span><div class="stack" id="nt-tpl-list" style="gap:8px"></div></div>
      <p class="err" id="nt-err" hidden></p>
      <div class="sfoot"><button class="btn btn-primary" type="submit" id="nt-submit"></button></div>
    </form>
  </div>
</div>

<script type="module">
import { $, esc, api, ICONS, getLang, onLang, onUser, getUser, askName, setStatus, dayShort, dayLong, weekday, roleLabel, mapLink, onPrefs } from "/shell.js";
import { routeLinks } from "/route.js";

const T = {
  en: {
    title: "Plan a trip together.",
    lede: "Collect places, vote on what to see, keep track of what needs booking, and lay out the days — with the people who are coming.",
    ctaIn: "Sign in", ctaNote: "By email link — no password to remember.",
    how: "How it works",
    s1h: "Sights", s1p: "Everyone adds places worth seeing and taps Like on the ones they want. The list sorts itself by what the group actually wants.",
    s2h: "Bookings", s2p: "Everything that costs money or needs a slot, in one list. Mark it booked with the date and it lands on the plan by itself.",
    s3h: "Plan", s3p: "A column per day. Put places on days, give them a rough time, and open any stop in Maps — or route the whole day.",
    m1name: "Rijksmuseum", m1where: "Museumplein · tram 2", m1free: "Free", m1like: "Liked", m1votes: "votes",
    m2a: "Canal cruise", m2am: "Booked · Sat, 14:00", m2b: "Anne Frank House", m2bm: "Book ahead · sells out",
    m3wd: "Saturday", m3day: "13 March", m3a: "Rijksmuseum", m3am: "3 ♥ · added by Sam", m3b: "Canal cruise", m3bm: "booked",
    mine: "Your trips", none: "You're not on a trip yet. Start one, or ask whoever runs one for an invitation.",
    newTrip: "New trip", ntTitle: "New trip", ntName: "Name", ntNamePh: "Rome in May", ntDest: "Destination", ntDestPh: "Rome",
    ntFirst: "First day", ntLast: "Last day", ntDatesHint: "Optional — you can set the dates later on the trip's Details page.",
    ntStart: "Start with", ntEmpty: "An empty list", ntTemplate: (t) => `${t.name}: ${t.count} places to vote on`,
    ntCreate: "Create trip", ntCreating: "Creating…",
    examples: "Example trips", exLede: "Made-up trips you can look around, to see what a finished plan looks like.",
    siH: "Already on a trip?", siP: "Sign in with the address you were invited with and it's right here.",
    privacy: "Trips are private to the people on them. You sign in by a link sent to your email; there is no password and nothing to install.",
    days: (n) => `${n} ${n === 1 ? "day" : "days"}`, as: (n) => `as ${n}`,
    now: "Now", next: "Next", pinnedLbl: "Pinned", pin: "Show first", unpin: "Unpin",
    dayOf: (i, n, d) => `Day ${i} of ${n} · ${d}`,
    inDays: (n) => n === 0 ? "Starts today" : n === 1 ? "Tomorrow" : `In ${n} days`,
    todayNothing: "Nothing on the plan for today.", openPlan: "Open the plan", openTrip: "Open the trip",
    routeToday: "Route the day", toBook: (n) => `${n} still to book`, unplaced: (n) => `${n} voted, not on a day`,
    invites: (n) => `${n} ${n === 1 ? "invitation" : "invitations"} open`, allSet: "Nothing left to do before it starts.",
    upcoming: "Upcoming", noDates: "no dates yet", past: "Past trips", cancelled: "cancelled",
    seeExample: "See an example trip",
    foot: "Built for a group of friends and their London trip. Now for any trip.", privacy: "Privacy",
  },
  de: {
    title: "Eine Reise gemeinsam planen.",
    lede: "Orte sammeln, abstimmen, was ihr sehen wollt, den Überblick über Buchungen behalten und die Tage planen – mit allen, die mitkommen.",
    ctaIn: "Anmelden", ctaNote: "Per Link an deine E-Mail – kein Passwort nötig.",
    how: "So funktioniert es",
    s1h: "Orte", s1p: "Alle tragen Orte ein, die sich lohnen, und liken, was sie sehen wollen. Die Liste sortiert sich nach dem, was die Gruppe wirklich will.",
    s2h: "Buchungen", s2p: "Alles, was Geld kostet oder einen Termin braucht, in einer Liste. Als gebucht markieren, Datum dazu – und es steht von selbst im Plan.",
    s3h: "Plan", s3p: "Eine Spalte pro Tag. Orte auf Tage legen, ungefähre Zeiten dazu, und jeden Stopp in Maps öffnen – oder gleich den ganzen Tag.",
    m1name: "Rijksmuseum", m1where: "Museumplein · Tram 2", m1free: "Kostenlos", m1like: "Liked", m1votes: "Stimmen",
    m2a: "Grachtenfahrt", m2am: "Gebucht · Sa, 14:00", m2b: "Anne-Frank-Haus", m2bm: "Vorab buchen · schnell ausverkauft",
    m3wd: "Samstag", m3day: "13. März", m3a: "Rijksmuseum", m3am: "3 ♥ · von Sam", m3b: "Grachtenfahrt", m3bm: "gebucht",
    mine: "Deine Reisen", none: "Du bist noch auf keiner Reise. Leg eine an, oder bitte, wer eine verwaltet, um eine Einladung.",
    newTrip: "Neue Reise", ntTitle: "Neue Reise", ntName: "Name", ntNamePh: "Rom im Mai", ntDest: "Ziel", ntDestPh: "Rom",
    ntFirst: "Erster Tag", ntLast: "Letzter Tag", ntDatesHint: "Optional – die Daten kannst du später auf der Details-Seite setzen.",
    ntStart: "Beginnen mit", ntEmpty: "Einer leeren Liste", ntTemplate: (t) => `${t.name}: ${t.count} Orte zum Abstimmen`,
    ntCreate: "Reise anlegen", ntCreating: "Wird angelegt…",
    examples: "Beispielreisen", exLede: "Ausgedachte Reisen zum Anschauen – so sieht ein fertiger Plan aus.",
    siH: "Schon auf einer Reise?", siP: "Melde dich mit der Adresse an, mit der du eingeladen wurdest – dann ist sie hier.",
    privacy: "Reisen sind privat für die, die dabei sind. Du meldest dich mit einem Link an deine E-Mail an; kein Passwort, nichts zu installieren.",
    days: (n) => `${n} ${n === 1 ? "Tag" : "Tage"}`, as: (n) => `als ${n}`,
    now: "Jetzt", next: "Als Nächstes", pinnedLbl: "Angeheftet", pin: "Zuerst zeigen", unpin: "Lösen",
    dayOf: (i, n, d) => `Tag ${i} von ${n} · ${d}`,
    inDays: (n) => n === 0 ? "Geht heute los" : n === 1 ? "Morgen" : `In ${n} Tagen`,
    todayNothing: "Heute steht nichts im Plan.", openPlan: "Plan öffnen", openTrip: "Reise öffnen",
    routeToday: "Route für den Tag", toBook: (n) => `${n} noch zu buchen`, unplaced: (n) => `${n} mit Stimmen, noch ohne Tag`,
    invites: (n) => `${n} ${n === 1 ? "Einladung" : "Einladungen"} offen`, allSet: "Vor dem Start ist nichts mehr zu tun.",
    upcoming: "Demnächst", noDates: "noch ohne Datum", past: "Frühere Reisen", cancelled: "abgesagt",
    seeExample: "Eine Beispielreise ansehen",
    foot: "Gebaut für eine Gruppe Freunde und ihre Londonreise. Jetzt für jede Reise.", privacy: "Datenschutz",
  },
};
const t = () => T[getLang()];

let TRIPS = null;   // null until loaded; [] when signed in with none
let EXAMPLES = [];
let FEATURED = null;

function paint() {
  const L = t();
  const user = getUser();
  document.title = L.mine;
  $("#h-title").textContent = L.title;
  $("#h-lede").textContent = L.lede;
  $("#h-cta").innerHTML = user ? "" :
    `<button type="button" class="btn btn-primary btn-lg" id="cta-signin">${esc(L.ctaIn)}</button><span class="note">${esc(L.ctaNote)}</span>`;
  $("#how-eyebrow").textContent = L.how;
  for (const [id, key] of [["s1-h","s1h"],["s1-p","s1p"],["s2-h","s2h"],["s2-p","s2p"],["s3-h","s3h"],["s3-p","s3p"],
    ["m1-name","m1name"],["m1-where","m1where"],["m1-free","m1free"],["m1-votes","m1votes"],
    ["m2-a","m2a"],["m2-a-m","m2am"],["m2-b","m2b"],["m2-b-m","m2bm"],
    ["m3-wd","m3wd"],["m3-day","m3day"],["m3-a","m3a"],["m3-a-m","m3am"],["m3-b","m3b"],["m3-b-m","m3bm"],
    ["si-h","siH"],["si-p","siP"],["si-btn","ctaIn"],["pv-p","privacy"],["foot","foot"],["mine-h","mine"],["ex-h","examples"],["ex-lede","exLede"]])
    $("#" + id).textContent = L[key];
  $("#m1-like").innerHTML = `${ICONS.heartFill}${esc(L.m1like)}`;
  $("#foot-privacy").textContent = L.privacy;
  $("#new-trip").innerHTML = `${ICONS.plus}${esc(L.newTrip)}`;
  $("#nt-title").textContent = L.ntTitle; $("#nt-close").innerHTML = ICONS.close;
  $("#nt-l-name").textContent = L.ntName; $("#nt-name").placeholder = L.ntNamePh;
  $("#nt-l-dest").textContent = L.ntDest; $("#nt-dest").placeholder = L.ntDestPh;
  $("#nt-l-first").textContent = L.ntFirst; $("#nt-l-last").textContent = L.ntLast;
  $("#nt-dates-hint").textContent = L.ntDatesHint; $("#nt-l-start").textContent = L.ntStart;
  $("#nt-submit").textContent = L.ntCreate;
  paintTemplates();
  $("#m2-tick").innerHTML = ICONS.check; $("#m2-warn").innerHTML = ICONS.ticket;
  $("#si-ico").innerHTML = ICONS.person; $("#pv-ico").innerHTML = ICONS.check;

  const when = (tr) => tr.startDate ? `${esc(dayShort(tr.startDate))} – ${esc(dayShort(tr.endDate))}` : "";
  // Name, then when and where, then the facts, then the badges on a row of
  // their own — a tag in the middle of a line of text is hard to read.
  const card = (tr, role, opts = {}) => {
    const place = tr.destination && tr.destination !== tr.name ? esc(tr.destination) : "";
    const facts = [tr.days ? esc(L.days(tr.days)) : "", tr.memberName ? esc(L.as(tr.memberName)) : ""].filter(Boolean).join(" · ");
    const tags = [
      opts.undated && !tr.startDate ? `<span class="tag tag-sm tag-coral">${esc(L.noDates)}</span>` : "",
      tr.status === "cancelled" ? `<span class="tag tag-sm tag-neutral">${esc(L.cancelled)}</span>` : "",
      role ? `<span class="tag tag-sm tag-neutral">${esc(roleLabel(role))}</span>` : "",
    ].filter(Boolean).join("");
    return `<a class="trip card${tr.status === "cancelled" ? " cancelled" : ""}" href="/t/${tr.id}/">
      <span class="name">${esc(tr.name || tr.destination || "Trip")}</span>
      ${when(tr) || place ? `<span class="when">${[when(tr), place].filter(Boolean).join(" · ")}</span>` : ""}
      ${facts ? `<span class="meta">${facts}</span>` : ""}
      ${tags ? `<span class="tags">${tags}</span>` : ""}</a>`;
  };

  $("#mine").hidden = !user;
  // Someone signed in knows how it works: their trips come first.
  if (user) $("#how").before($("#mine")); else $("#how").after($("#mine"));
  if (user && TRIPS !== null) paintMine(L, card);
  $("#examples").hidden = !EXAMPLES.length || (!!user && TRIPS !== null && TRIPS.length > 0);
  $("#ex-link").hidden = !(user && EXAMPLES.length && (TRIPS?.length ?? 0) > 0);
  if (EXAMPLES.length) { $("#ex-link-a").textContent = L.seeExample; $("#ex-link-a").href = `/t/${EXAMPLES[0].id}/`; }
  $("#ex-list").innerHTML = EXAMPLES.map((tr) => card(tr, null)).join("");
  $("#signin").hidden = !!user;
}

/** The featured trip, then the rest grouped: upcoming (undated first), past by year. */
function paintMine(L, card) {
  const today = localToday();
  $("#mine-n").textContent = TRIPS.length || "";
  const byId = new Map(TRIPS.map((tr) => [tr.id, tr]));
  const f = FEATURED && byId.get(FEATURED.id);
  const rest = TRIPS.filter((tr) => tr !== f);
  const isPast = (tr) => tr.status === "cancelled" || (tr.endDate && tr.endDate < today);
  const upcoming = rest.filter((tr) => !isPast(tr)).sort((a, b) => (a.startDate ?? "").localeCompare(b.startDate ?? ""));
  const past = rest.filter(isPast).sort((a, b) => (b.endDate ?? "").localeCompare(a.endDate ?? ""));

  $("#featured").innerHTML = f ? featuredHTML(L, f, FEATURED) : (TRIPS.length ? "" : `<p class="note">${esc(L.none)}</p>`);
  $("#upcoming").innerHTML = upcoming.length ? `<div class="group"><p class="eyebrow">${esc(L.upcoming)} <span class="count">${upcoming.length}</span></p>
      <div class="trips">${upcoming.map((tr) => card(tr, tr.role, { undated: !tr.startDate })).join("")}</div></div>` : "";

  const years = new Map();
  for (const tr of past) { const y = (tr.endDate ?? tr.startDate ?? "—").slice(0, 4); (years.get(y) ?? years.set(y, []).get(y)).push(tr); }
  $("#past").innerHTML = past.length ? `<div class="group"><p class="eyebrow">${esc(L.past)} <span class="count">${past.length}</span></p>
      ${[...years].map(([y, list], i) => `<details class="year"${i === 0 ? " open" : ""}><summary><span class="chev">${ICONS.chevron}</span>${esc(y)} <span class="count">· ${list.length}</span></summary>
        <div class="trips">${list.map((tr) => card(tr, tr.role)).join("")}</div></details>`).join("")}</div>` : "";
}

function featuredHTML(L, tr, f) {
  const phase = f.phase === "current" ? L.now : f.phase === "next" ? L.next : f.pinned ? L.pinnedLbl : "";
  const sub = f.phase === "current" ? L.dayOf(f.dayIndex, f.totalDays, weekday(f.today) + " " + dayLong(f.today))
    : f.phase === "next" ? `${L.inDays(f.daysUntil)} · ${dayShort(tr.startDate)} – ${dayShort(tr.endDate)}${tr.destination ? ` · ${tr.destination}` : ""}`
    : `${tr.startDate ? `${dayShort(tr.startDate)} – ${dayShort(tr.endDate)}` : L.noDates}${tr.destination ? ` · ${tr.destination}` : ""}`;
  let body = "";
  if (f.phase === "current") {
    const r = routeLinks(f.stops.map((x) => ({ lat: x.lat, lon: x.lon })), "transit", null);
    body = (f.stops.length ? `<div class="stops">${f.stops.map((x) => {
        const one = x.lat != null ? routeLinks([{ lat: x.lat, lon: x.lon }], "transit", null) : null;
        return `<div class="stop"><div class="when${x.start ? "" : " open"}">${x.start ? esc(x.start) : "—"}${x.end ? `<em>${esc(x.end)}</em>` : ""}</div>
          <div class="sn">${esc(x.label)}</div>
          ${one ? `<a class="btn btn-sm btn-tint" href="${esc(mapLink(one))}" target="_blank" rel="noopener">${ICONS.pin}</a>` : "<span></span>"}</div>`;
      }).join("")}</div>` : `<p class="empty-day">${esc(L.todayNothing)}</p>`) +
      `<div class="foot"><a class="btn btn-sm btn-primary" href="/t/${tr.id}/plan">${esc(L.openPlan)}</a>
        ${r ? `<a class="btn btn-sm btn-tint" href="${esc(mapLink(r))}" target="_blank" rel="noopener">${ICONS.route}${esc(L.routeToday)}</a>` : ""}</div>`;
  } else if (f.phase === "next") {
    const items = [
      [f.toBook, L.toBook(f.toBook), `/t/${tr.id}/bookings`],
      [f.unplaced, L.unplaced(f.unplaced), `/t/${tr.id}/plan`],
      ...(f.invitesOpen != null ? [[f.invitesOpen, L.invites(f.invitesOpen), `/t/${tr.id}/details`]] : []),
    ];
    const open = items.filter(([n]) => n > 0);
    body = `<div class="todo">${open.length ? open.map(([n, label, href]) => `<a href="${href}"><b>${n}</b>${esc(label)}</a>`).join("")
      : `<span class="note">${ICONS.check} ${esc(L.allSet)}</span>`}</div>
      <div class="foot"><a class="btn btn-sm btn-primary" href="/t/${tr.id}/">${esc(L.openTrip)}</a></div>`;
  } else {
    body = `<div class="foot"><a class="btn btn-sm btn-primary" href="/t/${tr.id}/">${esc(L.openTrip)}</a></div>`;
  }
  return `<div class="feat card">
    <div class="top"><div class="grow">${phase ? `<div class="phase${f.phase === "past" ? " past" : ""}">${esc(phase)}</div>` : ""}
      <h3><a href="/t/${tr.id}/" style="color:inherit">${esc(tr.name || tr.destination || "Trip")}</a></h3><div class="sub">${esc(sub)}</div></div>
      <div class="acts"><span class="tag tag-sm tag-neutral">${esc(roleLabel(tr.role))}</span>
        <button type="button" class="btn btn-sm ${f.pinned ? "btn-quiet" : "btn-ghost"} pinbtn" data-pin="${f.pinned ? "" : tr.id}">${esc(f.pinned ? L.unpin : L.pin)}</button></div></div>
    ${body}</div>`;
}

const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-pin]");
  if (!b) return;
  try { await api("/api/auth/pin", { method: "POST", body: JSON.stringify({ tripId: b.dataset.pin ? Number(b.dataset.pin) : null }) }); load(); }
  catch (err) { setStatus(err.message, "err"); }
});

async function load() {
  try {
    const d = await api(getUser() ? `/api/trips?today=${localToday()}` : "/api/examples");
    TRIPS = getUser() ? (d.trips ?? []) : null; EXAMPLES = d.examples ?? []; FEATURED = d.featured ?? null;
  } catch (err) { TRIPS = getUser() ? [] : null; setStatus(err.message, "err"); }
  paint();
}

document.addEventListener("click", (e) => {
  if (e.target.closest("#cta-signin, #si-btn")) askName();
  if (e.target.closest("#new-trip")) { $("#nt-sheet").hidden = false; setTimeout(() => $("#nt-name").focus(), 0); }
  if (e.target.closest("#nt-close") || e.target.id === "nt-sheet") $("#nt-sheet").hidden = true;
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#nt-sheet").hidden = true; });

/* Templates: offered once the destination matches one. */
let TEMPLATES = [];
let tplTimer = 0;
$("#nt-dest").addEventListener("input", () => {
  clearTimeout(tplTimer);
  tplTimer = setTimeout(async () => {
    const dest = $("#nt-dest").value.trim();
    try { TEMPLATES = dest ? (await api("/api/templates?destination=" + encodeURIComponent(dest))).templates : []; }
    catch { TEMPLATES = []; }
    paintTemplates();
  }, 250);
});
function paintTemplates() {
  const L = t();
  const box = $("#nt-tpl");
  box.hidden = !TEMPLATES.length;
  const picked = $('input[name="nt-template"]:checked')?.value ?? "";
  $("#nt-tpl-list").innerHTML = [{ key: "", label: L.ntEmpty }, ...TEMPLATES.map((tp) => ({ key: tp.key, label: L.ntTemplate(tp) }))]
    .map((o) => `<label class="check"><input type="radio" name="nt-template" value="${esc(o.key)}"${o.key === picked ? " checked" : ""}><span>${esc(o.label)}</span></label>`).join("");
  if (!$('input[name="nt-template"]:checked')) $('input[name="nt-template"]').checked = true;
}

$("#nt-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const L = t();
  const btn = $("#nt-submit"), err = $("#nt-err");
  btn.disabled = true; btn.textContent = L.ntCreating; err.hidden = true;
  try {
    const d = await api("/api/trips", { method: "POST", body: JSON.stringify({
      name: $("#nt-name").value, destination: $("#nt-dest").value,
      startDate: $("#nt-first").value || null, endDate: $("#nt-last").value || null,
      template: $('input[name="nt-template"]:checked')?.value || null }) });
    location.href = `/t/${d.id}/details`;
  } catch (ex) {
    err.textContent = ex.message; err.hidden = false;
    btn.disabled = false; btn.textContent = L.ntCreate;
  }
});

onLang(paint);
onPrefs(paint);
onUser(load);
</script>
</body>
</html>
