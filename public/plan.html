<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
<title>Plan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230A66E0'/><path d='M50 18l9.6 23.3 25.2 2.1-19.2 16.5 5.9 24.6L50 71.5 28.5 84.5l5.9-24.6L15.2 43.4l25.2-2.1z' fill='white'/></svg>">
<link rel="stylesheet" href="/app.css">
<style>
/* ---- toolbar extras ---- */
.hiddenby{font-size:12.5px;color:var(--text-3);margin:14px 0 0}
#addtoggle{margin-left:auto}

/* ---- where the days start ---- */
.baseform{margin-top:16px}
.basewhere{font-size:13px;color:var(--text-2);margin:0 0 10px}

/* ---- the add panel ---- */
.adder{margin-top:16px}
.addermodes{padding:14px 18px 0}
.addermodes .seg button{font-size:13px;padding:7px 14px}
.apbody{padding:14px 18px 18px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.apbody .field{flex:1 1 140px}
.apbody .field.what{flex:2 1 220px}
.apbody .field.time{flex:0 1 110px}
.apwhere{flex-basis:100%;margin-top:6px;padding-top:12px;border-top:1px solid var(--hair)}
.apwhere .addrrow{align-items:flex-end}
.apwhere .field{flex:1 1 220px}
#own-where-note{margin:7px 0 0}
#own-where-note.set{color:var(--green);font-weight:600}
.aphint{flex-basis:100%;font-size:12.5px;color:var(--text-3);margin:0}

/* ---- day columns ---- */
.days{display:grid;gap:16px;margin-top:22px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
@media (max-width:380px){.days{grid-template-columns:1fr}}
.day{display:flex;flex-direction:column}
.day > header{padding:13px 17px;border-bottom:1px solid var(--hair);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.day .wd{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tint)}
.day h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.day .n{margin-left:auto;font-size:12px;color:var(--text-3);font-weight:600}
ol.stops{list-style:none;margin:0;padding:0;flex:1;min-height:54px}
li.stop{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:start;padding:12px 14px 12px 17px;
  border-bottom:1px solid var(--hair);cursor:pointer;transition:background .12s}
li.stop:last-child{border-bottom:0}
li.stop:hover{background:var(--surface-2)}
li.stop .chev{margin-top:3px;opacity:0;transition:opacity .12s}
li.stop:hover .chev{opacity:1}
.when{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;padding-top:1px;font-variant-numeric:tabular-nums}
.when em{display:block;font-style:normal;color:var(--text-3);font-size:12px;font-weight:500}
.when.open{color:var(--text-3);font-weight:500;font-size:12px}
.sname{font-weight:600;font-size:14.5px;line-height:1.3}
.smeta{font-size:12px;color:var(--text-3);margin-top:3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.stopact{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.dayempty{padding:22px 17px;color:var(--text-3);font-size:13px}
.dayroute{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:11px 17px;border-top:1px solid var(--hair);background:var(--surface-2)}
.routenote{font-size:12px;color:var(--text-2);flex-basis:100%}

/* ---- address lookup ---- */
.addrform{margin-top:8px}
.addrrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.addrrow .input{flex:1;min-width:170px;height:34px;font-size:14px}
.addrhits{display:grid;gap:4px;margin-top:8px}
.addrhits .hit{text-align:left;font-size:13.5px;padding:8px 11px;border-radius:var(--r-md);
  border:1px solid var(--hair-2);background:var(--surface);color:var(--text-2);display:flex;gap:6px;align-items:baseline}
.addrhits .hit:hover{border-color:var(--tint);color:var(--text);background:var(--tint-soft)}
.addrhits .hit b{color:var(--green);font-size:10px;text-transform:uppercase;letter-spacing:.06em;flex:none}
.addrnote{font-size:12px;color:var(--text-3)}

/* ---- the detail sheet ---- */
/* One row, one line — and it stays one line. Wrapping is off, so when the
   sheet narrows the name and the day give up width instead of the To field
   dropping underneath. Below 560px it becomes a grid instead; see there. */
.sfields{display:flex;gap:10px;align-items:flex-end;flex-wrap:nowrap}
.sfields .field{flex:0 1 auto;min-width:0}
.sfields .field.wide{flex:1 1 110px}
.sfields input[type=time]{width:104px;flex:none;text-align:center}
.sfields .select{max-width:190px;min-width:0}
.svoters{display:flex;gap:6px;flex-wrap:wrap}
.slinks{display:flex;gap:8px;flex-wrap:wrap}
.sfoot .right{margin-left:auto}
@media (max-width:560px){
  .sfields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sfields .field,.sfields .field.wide{grid-column:1 / -1}
  .sfields .field[data-half]{grid-column:auto}
  .sfields input,.sfields .select{width:100%;max-width:none}
  .sfields input[type=time]{width:100%}
  .sfoot .btn{flex:1}
  .sfoot .right{margin-left:0}
}

/* ---- small screens ---- */
@media (max-width:560px){
  .apbody{padding:14px 16px 16px}
  .apbody .field,.apbody .field.what{flex:1 1 100%}
  .apbody .field.time{flex:1 1 calc(50% - 6px)}
  .apbody > .btn{width:100%}
  .apwhere .addrrow{flex-wrap:wrap}
  .day > header{padding:12px 14px}
  li.stop{padding:11px 12px 11px 14px;gap:9px;grid-template-columns:48px 1fr auto}
  .dayroute{padding:10px 14px}
  .addrrow .input{min-width:0}
}
</style>
</head>
<body>

<div id="shell" data-page="plan"></div>

<main class="page">
<header class="page-head">
  <p class="eyebrow" id="kicker"></p>
  <h1 class="large-title" id="headline"></h1>
  <p class="subtitle" id="lede"></p>
</header>

<div class="stat-row" id="stats"></div>
<div class="toolbar" id="filters"></div>
<div class="card baseform" id="baseform" hidden></div>
<div class="card adder" id="addplan" hidden>
  <div class="addermodes">
    <div class="seg" role="group">
      <button type="button" data-mode="sight" aria-pressed="true" id="mode-sight">One of the sights</button>
      <button type="button" data-mode="own" aria-pressed="false" id="mode-own">Something of my own</button>
    </div>
  </div>

  <div class="apbody" id="form-sight">
    <label class="field what"><span id="ap-what-l">What</span>
      <select class="select" id="ap-what"></select></label>
    <label class="field"><span id="ap-day-l">Day</span>
      <select class="select" id="ap-day"></select></label>
    <label class="field time"><span id="ap-from-l">From</span>
      <input class="input" id="ap-from" type="time"></label>
    <label class="field time"><span id="ap-to-l">To</span>
      <input class="input" id="ap-to" type="time"></label>
    <button class="btn btn-primary" id="ap-add" type="button">Add</button>
    <p class="aphint" id="ap-hint"></p>
  </div>

  <div class="apbody" id="form-own" hidden>
    <label class="field what"><span id="own-what-l">What</span>
      <input class="input" id="own-what" type="text" maxlength="80" placeholder=""></label>
    <label class="field"><span id="own-day-l">Day</span>
      <select class="select" id="own-day"></select></label>
    <label class="field time"><span id="own-from-l">From</span>
      <input class="input" id="own-from" type="time"></label>
    <label class="field time"><span id="own-to-l">To</span>
      <input class="input" id="own-to" type="time"></label>
    <button class="btn btn-primary" id="own-add" type="button">Add it</button>
    <div class="apwhere" data-addrbox="__new__">
      <div class="addrrow">
        <label class="field"><span id="own-where-l">Where</span>
          <input class="input" id="own-where" type="text" maxlength="200" data-addrq placeholder=""></label>
        <button class="btn btn-quiet" id="own-find" type="button" data-addrfind="__new__">Find</button>
        <button type="button" class="btn btn-ghost" id="own-where-clear" hidden>Remove</button>
      </div>
      <p class="addrnote" id="own-where-note"></p>
      <div class="addrhits" data-addrhits="__new__"></div>
    </div>
    <p class="aphint" id="own-hint"></p>
  </div>
</div>
<div class="days" id="days"></div>
<p class="hiddenby" id="hiddenby" hidden></p>

<div class="sheet-back" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet">
    <header>
      <h2 id="sheet-title"></h2>
      <button class="sheet-close" id="sheet-close" type="button" aria-label="Close"></button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<footer class="page-foot"><span id="foot"></span></footer>
</main>

<script type="module">
import { routeLinks, routeFrom, hasPlace } from "/route.js";
import { $, esc, api, ICONS, getLang, onLang, nameOf, askName, fillMembers,
         setStatus, setTrip, tripKicker, dayLong, weekday, weekdayShort, mapLink, onPrefs } from "/shell.js";

const T = {

    shStatus: "Status",
    stTodo: "still to book", stBooked: "booked", stSkipped: "not booking",
    addAddress: "Add an address", changeAddress: "Change address",
    addrPh: "Address, place name, maps link or coordinates",
    addrFind: "Find", addrSave: "Save", addrClear: "Remove", addrCancel: "Cancel",
    addrNoHits: "Nothing found. Open it in Google or Apple Maps, copy the link, and paste that.",
    addrPick: "Pick one:", noLocation: "no address yet",

    apTitle: "Add something to the plan",
    apWhat: "What", apDay: "Day", apFrom: "From", apTo: "To", apAdd: "Add",
    apHint: "Only the day is required. Anything already booked with a date is placed by its booking — change the slot on the Bookings page instead.",
    apNone: "Everything is already on the plan.",
    apPick: "Pick a sight…",
    addNew: "Add to the plan", addClose: "Close",
    startLbl: "Routes start", startBase: "at the hotel", startNone: "where I am",
    startBaseTitle: "Routes start where we're staying",
    startNoneTitle: "Routes start from wherever you are when you open them",

    baseEdit: "Change where the days start", baseNone: "No address set for where we're staying.",
    basePh: "Hotel address, maps link or coordinates",

    srcOwn: "yours", fOwn: "Your own",
    votesShort: (n) => `${n} ♥`,
    bookedBy: "booked by", addedBy: "added by",
    foot: "No routes and no travel times here — just what happens when. Times are what you enter, not what anything works out.",
  },
  de: {
    pageTitle: "Plan",
    headline: "Der Plan",
    lede: "Alles mit Datum Gebuchte landet automatisch hier. Alles andere trägst du selbst ein – Tag und ungefähre Zeit wählen, fertig.",

    needName: "Trag oben zuerst deinen Namen ein.",

    fBooked: "Buchungen", fHand: "Eingetragen",
    filteredOut: (n) => `${n} durch Filter ausgeblendet`,
    statPlanned: "im Plan", statBooked: "aus Buchungen", statHand: "selbst eingetragen", statDays: "Tage verplant",
    srcBooked: "gebucht", srcHand: "eingetragen",
    dayEmpty: "Noch nichts geplant.",
    stops: (n) => `${n} ${n === 1 ? "Stopp" : "Stopps"}`,
    noTime: "egal wann",
    routeDay: "Route für den Tag", routeFromHere: "Route ab hier",
    stBookedTag: "gebucht", stToBook: "noch nicht gebucht", stFree: "kostenlos", stSkippedTag: "buchen wir nicht",
    routeSkipped: (n) => `${n} ohne Ort nicht enthalten`,
    routeCapped: "Der Google-Link nimmt die ersten 9 Stopps.",
    routeNone: "Nichts hier hat einen Ort für eine Route.",
    ownWhere: "Wo", ownWherePh: "Adresse oder Name des Orts",
    ownWhereHint: "Optional. Suchen und ein Ergebnis wählen, damit die Tagesroute ihn mitnimmt.",
    ownWhereSet: (label) => `Wird gespeichert als: ${label}`,

    shBooking: "Buchung", shLinks: "Links", shKind: "Im Plan als",
    shDay: "Tag", shFrom: "Von", shTo: "Bis", shName: "Name",

    shNoPlace: "Noch keine Adresse – bleibt aus der Tagesroute draußen",
    shSite: "Offizielle Seite", shTickets: "Buchungsseite", shMap: "In Maps öffnen",

    shBookedNote: "Der Termin kommt aus der Buchung – hier Datum und Uhrzeit ändern.",

    shSightNote: "Von Hand eingetragen. Was du hier änderst, ändert den Plan.",
    shStatus: "Status",
    stTodo: "noch zu buchen", stBooked: "gebucht", stSkipped: "buchen wir nicht",

    apTitle: "Etwas in den Plan eintragen",
    apWhat: "Was", apDay: "Tag", apFrom: "Von", apTo: "Bis", apAdd: "Eintragen",
    apHint: "Nur der Tag ist nötig. Was mit Datum gebucht ist, wird durch die Buchung eingeplant – ändere den Termin dann auf der Buchungsseite.",
    apNone: "Alles ist schon im Plan.",
    apPick: "Ort wählen…",
    addNew: "In den Plan eintragen", addClose: "Schließen",
    startLbl: "Routen starten", startBase: "an der Unterkunft", startNone: "wo ich bin",
    startBaseTitle: "Routen starten bei der Unterkunft",
    startNoneTitle: "Routen starten dort, wo du gerade bist, wenn du sie öffnest",
    locFrom: "von dort, wo du bist", baseFrom: "ab der Unterkunft",
    baseEdit: "Startpunkt der Tage ändern", baseNone: "Für die Unterkunft ist keine Adresse hinterlegt.",
    basePh: "Adresse der Unterkunft, Maps-Link oder Koordinaten",
    modeSight: "Ein Ort von der Liste", modeOwn: "Etwas Eigenes",
    ownTitle: "Oder einen eigenen Eintrag",
    ownWhat: "Was", ownPh: "Musical · Abendessen mit Anna · Zug zurück",
    ownAdd: "Eintragen",
    ownHint: "Alles, was kein Ort von der Liste ist. Nur Name und Tag sind nötig.",
    srcOwn: "eigener", fOwn: "Eigene",
    votesShort: (n) => `${n} ♥`,
    bookedBy: "gebucht von", addedBy: "eingetragen von",
    foot: "Keine Routen und keine Fahrtzeiten – nur was wann passiert. Die Zeiten sind die, die du einträgst.",
  },
};
const t = () => T[getLang()];

let SIGHTS = [], CUSTOM = [], VOTES = {}, STATUS = [], ENTRIES = [], NOTES = [], TRIP = { days: [] };
let minVotes = 0;
let editingAddress = null;   // sight id whose address form is open
// A place picked on the add form, held until the entry it belongs to exists.
let pendingPlace = null;     // { label, lat, lon } | null
let addMode = "sight";       // which half of the add panel is showing
let openedOnce = false;      // so an empty plan opens the adder once, not on every render
let sheetFor = null;         // { id, source } of the stop whose detail sheet is open
// "none" | "base". A route with no start is read by both maps apps as "from
// where I am now", which is what you want on the road — so that is the
// default, and the app never has to ask the browser for a position. The hotel
// is the alternative for planning the morning. Personal to this browser.
const START_KEY = "trip-plan-start";
let startFrom = localStorage.getItem(START_KEY) || "none";
if (startFrom === "me") startFrom = "none";
let editingBase = false;
let source = "all";       // all | booked | hand | own

const title = (s) => (getLang() === "de" && s.name_de) || s.name;
const all = () => [...SIGHTS, ...CUSTOM];
const byId = (id) => all().find((s) => s.id === id);

/* -------------------------------------------------------------- the plan */

/**
 * The plan is two sources merged. A booking with a date places itself; the
 * server refuses a hand-made entry for one, so nothing can appear twice.
 */
function planned() {
  const fromBookings = STATUS
    .filter((b) => b.status === "booked" && b.date)
    .map((b) => ({ id: b.id, day: b.date, start: b.time, end: b.endTime,
                   who: b.by, source: "booked" }));

  const byHand = ENTRIES.map((e) => ({ id: e.id, day: e.day, start: e.start,
                                       end: e.end, who: e.addedBy, source: "hand" }));

  // Your own entries are not sights at all, so they carry their own label.
  const own = NOTES.map((n) => ({ id: n.id, day: n.day, start: n.start, end: n.end,
                                  who: n.addedBy, source: "own", label: n.label }));

  return [...fromBookings, ...byHand].filter((p) => byId(p.id)).concat(own);
}

// Untimed entries sort to the end of their day — you know the day, not the hour.
const byClock = (a, b) => (a.start ?? "99:99").localeCompare(b.start ?? "99:99");

/** The origin the links should use right now, or null for none. */
function originNow() {
  if (startFrom === "base") return TRIP.base ?? null;
  return null;
}

/** The place a stop routes to, whatever kind of stop it is. */
const placeOf = (p) =>
  p.source === "own" ? NOTES.find((n) => n.id === p.id) ?? null : byId(p.id);

/** True when this stop could have a location and hasn't got one yet. */
const needsPlace = (p) => {
  const target = locatable(p);
  return !!target && !hasPlace(target.it);
};

/**
 * The thing whose address can be edited, and where to send it. Built-in sights
 * already have coordinates, so they answer null.
 */
function locatable(p) {
  if (p.source === "own") {
    const n = NOTES.find((x) => x.id === p.id);
    return n && { it: n, name: n.label, path: "/api/plan/note/address" };
  }
  const s = byId(p.id);
  return s?.custom ? { it: s, name: s.name, path: "/api/sights/address" } : null;
}

const SRC_TAG = { booked: "tag-green", hand: "tag-tint", own: "tag-violet" };

function stopHTML(p, i, stops) {
  const L = t();
  const own = p.source === "own";
  const s = own ? null : byId(p.id);
  const votes = own ? 0 : (VOTES[p.id] ?? []).length;
  const label = own ? p.label : title(s);

  // One word about booking: booked, not yet booked, free. Who added it, the
  // address and the maps links are in the sheet, one tap further in.
  let booking = "";
  if (s) {
    const st = STATUS.find((b) => b.id === p.id)?.status ?? null;
    const bookable = (s.custom ? !!s.costs : s.cost !== "free") || !!s.bookingRequired;
    booking = st === "booked" ? `<span class="tag tag-sm tag-green">${esc(L.stBookedTag)}</span>`
      : st === "skipped" ? `<span class="tag tag-sm tag-neutral">${esc(L.stSkippedTag)}</span>`
      : bookable ? `<span class="tag tag-sm tag-coral">${esc(L.stToBook)}</span>`
      : `<span class="tag tag-sm tag-green">${esc(L.stFree)}</span>`;
  }

  return `<li class="stop" data-stop="${esc(p.id)}" data-src="${esc(p.source)}">
    <div class="when${p.start ? "" : " open"}">
      ${p.start ? esc(p.start) : esc(L.noTime)}
      ${p.end ? `<em>${esc(p.end)}</em>` : ""}
    </div>
    <div>
      <div class="sname">${esc(label)}</div>
      <div class="smeta">
        ${votes ? `<span>${esc(L.votesShort(votes))}</span>` : ""}
        ${booking}
        ${needsPlace(p) ? `<span class="tag tag-sm tag-coral">${esc(L.noLocation)}</span>` : ""}
      </div>
    </div>
    <span class="chev">${ICONS.chevron}</span>
  </li>`;
}

const votesOf = (id) => (VOTES[id] ?? []).length;

/** Filters narrow what the plan *shows*; nothing is removed by using them. */
const passes = (p) =>
  // Your own entries have no votes to threshold, so a vote filter must not
  // quietly hide the musical you already paid for.
  (p.source === "own" || votesOf(p.id) >= minVotes) &&
  (source === "all" || source === p.source);

/** The whole day, start to finish, from wherever you are now. */
function dayRouteHTML(stops) {
  const L = t();
  if (!stops.length) return "";
  const r = routeLinks(stops.map(placeOf), "transit", originNow());
  if (!r) return `<div class="dayroute"><span class="routenote">${esc(L.routeNone)}</span></div>`;

  return `<div class="dayroute">
    <a class="btn btn-sm btn-primary" href="${esc(mapLink(r))}" target="_blank" rel="noopener">${ICONS.route}${esc(L.routeDay)}</a>
    <span class="tag tag-sm ${r.from ? "tag-neutral" : "tag-green"}">${esc(r.from ? L.baseFrom : L.locFrom)}</span>
    ${r.skipped ? `<span class="routenote">${esc(L.routeSkipped(r.skipped))}</span>` : ""}
    ${r.capped ? `<span class="routenote">${esc(L.routeCapped)}</span>` : ""}
  </div>`;
}

/**
 * Shown on a stop that has no location, and on one that has an address you may
 * want to change. Collapsed until asked for — a form open on every stop would
 * bury the plan itself.
 */
function addressControlHTML(p) {
  const L = t();
  const target = locatable(p);
  if (!target) return "";                    // built-ins already have coordinates

  const { it, name } = target;
  const placed = hasPlace(it);

  if (editingAddress !== it.id)
    return `<div class="stopact">
      <button class="btn btn-sm btn-tint" type="button" data-addr="${esc(it.id)}">${ICONS.pin}${
        esc(placed ? L.changeAddress : L.addAddress)}</button>
      ${placed ? `<button type="button" class="btn btn-sm btn-ghost" data-addrclear="${esc(it.id)}">${
        esc(L.addrClear)}</button>` : ""}
    </div>`;

  return `<div class="addrform inset" data-addrbox="${esc(it.id)}">
    <div class="addrrow">
      <input class="input" type="text" data-addrq maxlength="500" placeholder="${esc(L.addrPh)}"
             value="${esc(it.address ?? name)}">
      <button class="btn btn-sm btn-primary" type="button" data-addrfind="${esc(it.id)}">${esc(L.addrFind)}</button>
      <button type="button" class="btn btn-sm btn-ghost" data-addrcancel>${esc(L.addrCancel)}</button>
      ${placed ? `<button type="button" class="btn btn-sm btn-ghost" data-addrclear="${esc(it.id)}">${esc(L.addrClear)}</button>` : ""}
    </div>
    <div class="addrhits" data-addrhits="${esc(it.id)}"></div>
  </div>`;
}

/** Both kinds go to their own endpoint; the payload is identical. */
const addressPathFor = (id) =>
  id.startsWith("note-") ? "/api/plan/note/address" : "/api/sights/address";

function renderFilters() {
  const L = t();
  const list = planned();
  const top = list.reduce((a, p) => Math.max(a, votesOf(p.id)), 0);
  const steps = Array.from({ length: Math.min(top, 6) + 1 }, (_, n) => n);
  const countAt = (n) => list.filter((p) => (p.source === "own" || votesOf(p.id) >= n) &&
    (source === "all" || source === p.source)).length;

  const votesBtns = steps.map((n) =>
    `<button class="chip" type="button" data-votes="${n}" aria-pressed="${minVotes === n}">${
      n === 0 ? esc(L.fAll) : n + esc(L.fPlus)} <b>${countAt(n)}</b></button>`).join("");

  const typed = !steps.includes(minVotes);
  const manual =
    `<span class="chip-input"><span class="or">${esc(L.fOr)}</span>` +
    `<input type="number" id="vmin" min="0" max="99" step="1"` +
    ` title="${esc(L.fCustomTitle)}" aria-label="${esc(L.fCustomTitle)}"` +
    ` placeholder="${esc(L.fCustom)}" value="${typed ? minVotes : ""}"` +
    `${typed ? ' class="on"' : ""}>` +
    `<span class="plus">${esc(L.fPlus)}</span>` +
    `${typed ? `<b>${countAt(minVotes)}</b>` : ""}</span>`;

  const sources = [
    ["all", L.fAll, list.length],
    ["booked", L.fBooked, list.filter((p) => p.source === "booked").length],
    ["hand", L.fHand, list.filter((p) => p.source === "hand").length],
    ["own", L.fOwn, list.filter((p) => p.source === "own").length],
  ].map(([k, label, n]) =>
    `<button class="chip" type="button" data-source="${k}" aria-pressed="${source === k}">${esc(label)} <b>${n}</b></button>`).join("");

  const open = !$("#addplan").hidden;
  $("#filters").innerHTML =
    `<div class="chips"><span class="lbl">${esc(L.fVotes)}</span>${votesBtns}${manual}</div>` +
    `<div class="chips"><span class="lbl">${esc(L.fSource)}</span>${sources}</div>` +
    `<div class="chips"><span class="lbl">${esc(L.startLbl)}</span>` +
    [["none", L.startNone, L.startNoneTitle, ICONS.locate],
     ["base", L.startBase, L.startBaseTitle, ICONS.home]].map(([k, label, title, icon]) =>
      `<button class="chip" type="button" data-start="${k}" aria-pressed="${startFrom === k}"
               title="${esc(title)}">${icon}${esc(label)}</button>`).join("") +
    `<button type="button" class="chip icon-chip" id="baseedit" title="${esc(L.baseEdit)}"
             aria-label="${esc(L.baseEdit)}" aria-pressed="${editingBase}">${ICONS.pencil}</button></div>` +
    `<button class="btn btn-sm ${open ? "btn-quiet" : "btn-primary"}" id="addtoggle" type="button" aria-expanded="${open}"
             title="${esc(open ? L.addClose : L.addNew)}">${open ? ICONS.close : ICONS.plus}${esc(open ? L.addClose : L.addNew)}</button>`;
}

/** Where the days start. Collapsed unless you press the pencil. */
function renderBaseForm() {
  const L = t();
  const box = $("#baseform");
  box.hidden = !editingBase;
  if (!editingBase) return;

  box.innerHTML =
    `<div class="card-body">
     <p class="basewhere">${ICONS.home} ${esc(TRIP.base ? TRIP.base.name ?? "" : L.baseNone)}</p>
     <div class="addrform" data-addrbox="__base__" style="margin:0">
       <div class="addrrow">
         <input class="input" type="text" data-addrq maxlength="500" placeholder="${esc(L.basePh)}"
                value="${esc(TRIP.base?.name ?? "")}">

function renderAdder() {
  const L = t();
  const placed = new Set(planned().map((p) => p.id));

  const options = all()
    .filter((s) => !placed.has(s.id))
    .sort((a, b) => (VOTES[b.id] ?? []).length - (VOTES[a.id] ?? []).length ||
                    title(a).localeCompare(title(b)));

  $("#ap-what-l").textContent = L.apWhat;
  $("#ap-day-l").textContent = L.apDay;
  $("#ap-from-l").textContent = L.apFrom;
  $("#ap-to-l").textContent = L.apTo;
  $("#ap-add").textContent = L.apAdd;
  $("#ap-hint").textContent = options.length ? L.apHint : L.apNone;
  $("#mode-sight").textContent = L.modeSight;
  $("#mode-own").textContent = L.modeOwn;
  $("#mode-sight").setAttribute("aria-pressed", String(addMode === "sight"));
  $("#mode-own").setAttribute("aria-pressed", String(addMode === "own"));
  $("#form-sight").hidden = addMode !== "sight";
  $("#form-own").hidden = addMode !== "own";
  $("#own-what-l").textContent = L.ownWhat;
  $("#own-day-l").textContent = L.apDay;
  $("#own-from-l").textContent = L.apFrom;
  $("#own-to-l").textContent = L.apTo;
  $("#own-what").placeholder = L.ownPh;
  $("#own-where-l").textContent = L.ownWhere;
  $("#own-where").placeholder = L.ownWherePh;
  $("#own-find").textContent = L.addrFind;
  $("#own-where-clear").textContent = L.addrClear;
  $("#own-where-clear").hidden = !pendingPlace;
  const wnote = $("#own-where-note");
  wnote.textContent = pendingPlace ? L.ownWhereSet(pendingPlace.label) : L.ownWhereHint;
  wnote.classList.toggle("set", !!pendingPlace);
  $("#own-add").textContent = L.ownAdd;
  $("#own-hint").textContent = L.ownHint;
  $("#ap-add").disabled = !options.length;

  const keepWhat = $("#ap-what").value;
  $("#ap-what").innerHTML = `<option value="">${esc(L.apPick)}</option>` +
    options.map((s) => {
      const v = (VOTES[s.id] ?? []).length;
      return `<option value="${esc(s.id)}">${esc(title(s))}${v ? ` — ${v} ♥` : ""}</option>`;
    }).join("");
  if (options.some((s) => s.id === keepWhat)) $("#ap-what").value = keepWhat;

  const dayOptions = TRIP.days
    .map((d) => `<option value="${esc(d)}">${esc(weekday(d))} ${esc(dayLong(d))}</option>`).join("");

  for (const id of ["#ap-day", "#own-day"]) {
    const sel = $(id);
    const keep = sel.value;
    sel.innerHTML = dayOptions;
    if (TRIP.days.includes(keep)) sel.value = keep;
  }
}

function paintChrome() {
  const L = t();
  $("#headline").textContent = L.headline;
  $("#lede").textContent = L.lede;
  $("#foot").textContent = L.foot;
  $("#kicker").textContent = tripKicker(TRIP);
  $("#kicker").hidden = !$("#kicker").textContent;
  $("#sheet-close").innerHTML = ICONS.close;
  $("#sheet-close").setAttribute("aria-label", L.shClose);
  setTrip(TRIP, L.pageTitle);
}

function render() {
  const L = t();
  paintChrome();

  const list = planned();
  const shown = list.filter(passes);
  const days = TRIP.days.map((d) => ({
    date: d,
    stops: shown.filter((p) => p.day === d).sort(byClock),
  }));

  $("#stats").innerHTML = [
    [list.length, L.statPlanned],
    [list.filter((p) => p.source === "booked").length, L.statBooked],
    [list.filter((p) => p.source !== "booked").length, L.statHand],
    [days.filter((d) => d.stops.length).length, L.statDays],
  ].map(([v, k]) => `<div class="stat"><b>${v}</b><span>${esc(k)}</span></div>`).join("");

  renderFilters();
  renderBaseForm();
  $("#days").innerHTML = days.map((d) => `<section class="day card">
    <header>
      <span class="wd">${esc(weekday(d.date))}</span>
      <h2>${esc(dayLong(d.date))}</h2>
      ${d.stops.length ? `<span class="n">${esc(L.stops(d.stops.length))}</span>` : ""}
    </header>
    ${d.stops.length
      ? `<ol class="stops">${d.stops.map((p, i) => stopHTML(p, i, d.stops)).join("")}</ol>`
      : `<p class="dayempty">${esc(L.dayEmpty)}</p>`}
    ${dayRouteHTML(d.stops)}
  </section>`).join("");

  // Nothing planned yet? Then adding is the only thing to do here.
  if (!list.length && !openedOnce) { $("#addplan").hidden = false; openedOnce = true; renderFilters(); }

  const hidden = list.length - shown.length;
  $("#hiddenby").hidden = !hidden;
  $("#hiddenby").textContent = hidden ? L.filteredOut(hidden) : "";

  renderAdder();
}

/* ----------------------------------------------------------- detail sheet */

/** Everything known about one stop, gathered from wherever it actually lives. */
function detailsOf(p) {
  const own = p.source === "own";
  const note = own ? NOTES.find((n) => n.id === p.id) : null;
  const sight = own ? null : byId(p.id);
  const booking = STATUS.find((b) => b.id === p.id) ?? null;

  return {
    id: p.id, source: p.source, own, note, sight, booking,
    place: placeOf(p),
    name: own ? (note?.label ?? p.label) : title(sight),
    day: p.day, start: p.start, end: p.end,
    voters: own ? [] : (VOTES[p.id] ?? []),
    url: sight?.url ?? null,
    bookingUrl: booking?.bookingUrl ?? sight?.bookingUrl ?? null,
    address: own ? note?.address : (sight?.custom ? sight.address : sight?.area),
  };
}

function sheetHTML(x) {
  const L = t();
  const dayOpts = TRIP.days.map((d) =>
    `<option value="${esc(d)}"${x.day === d ? " selected" : ""}>${esc(weekdayShort(d))} ${esc(dayLong(d))}</option>`).join("");
  const kindLabel = { booked: L.srcBooked, hand: L.srcHand, own: L.srcOwn }[x.source];
  const route = hasPlace(x.place) ? routeLinks([x.place], "transit", null) : null;
  // "I have done the first two" — this stop and the rest of its day, in order.
  const dayStops = planned().filter(passes).filter((q) => q.day === x.day).sort(byClock);
  const idx = dayStops.findIndex((q) => q.id === x.id && q.source === x.source);
  const onward = idx >= 0 ? routeFrom(dayStops.map(placeOf), idx, "transit", originNow()) : null;

  return `
  <div class="srow">
    <span class="slabel">${esc(L.shKind)}</span>
    <span class="sval"><span class="tag ${SRC_TAG[x.source]}">${esc(kindLabel)}</span></span>
    <span class="sval muted">${esc(
      x.source === "booked" ? L.shBookedNote : x.own ? L.shOwnNote : L.shSightNote)}</span>
  </div>

  <div class="srow">
    <span class="slabel">${esc(L.shWhen)}</span>
    <div class="sfields">
      ${x.own ? `<label class="field wide"><span>${esc(L.shName)}</span><input class="input" type="text" data-f="label" value="${esc(x.name)}"></label>` : ""}
      <label class="field"><span>${esc(L.shDay)}</span><select class="select" data-f="day">${dayOpts}</select></label>
      <label class="field" data-half><span>${esc(L.shFrom)}</span><input class="input" type="time" data-f="start" value="${esc(x.start ?? "")}"></label>
      <label class="field" data-half><span>${esc(L.shTo)}</span><input class="input" type="time" data-f="end" value="${esc(x.end ?? "")}"></label>
    </div>
  </div>

  <div class="srow">
    <span class="slabel">${esc(L.shWhere)}</span>
    <span class="sval${x.address ? "" : " muted"}">${esc(x.address || L.shNoPlace)}</span>
    ${addressControlHTML({ id: x.id, source: x.source })}
    ${route ? `<div class="slinks">
      <a class="btn btn-sm btn-tint" href="${esc(mapLink(route))}" target="_blank" rel="noopener">${ICONS.pin}${esc(L.shMap)}</a>
      ${onward && onward.used > 1 ? `<a class="btn btn-sm btn-tint" href="${esc(mapLink(onward))}" target="_blank" rel="noopener">${ICONS.route}${esc(L.routeFromHere)}</a>` : ""}
    </div>` : ""}
  </div>

  ${x.own ? "" : `<div class="srow">
    <span class="slabel">${esc(L.shVotes)}</span>
    ${x.voters.length
      ? `<div class="svoters">${x.voters.map((v) => `<span class="pill-name">${esc(v)}</span>`).join("")}</div>`
      : `<span class="sval muted">${esc(L.shNoVotes)}</span>`}
  </div>`}

  ${x.own ? "" : `<div class="srow">
    <span class="slabel">${esc(L.shBooking)}</span>
    ${x.booking
      ? `<span class="sval">${esc({ booked: L.stBooked, skipped: L.stSkipped }[x.booking.status] ?? L.stTodo)}${
          x.booking.by ? ` · ${esc(L.shBookedBy)} ${esc(x.booking.by)}` : ""}${
          x.booking.reference ? ` · ${esc(L.shRef)} ${esc(x.booking.reference)}` : ""}${
          x.booking.cost ? ` · ${esc(x.booking.cost)}` : ""}</span>`
      : `<span class="sval muted">${esc(L.shNotBooked)}</span>`}
  </div>`}

  ${x.url || x.bookingUrl ? `<div class="srow">
    <span class="slabel">${esc(L.shLinks)}</span>
    <div class="slinks">
      ${x.url ? `<a class="btn btn-sm btn-tint" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(L.shSite)}${ICONS.external}</a>` : ""}
      ${x.bookingUrl && x.bookingUrl !== x.url ? `<a class="btn btn-sm btn-tint" href="${esc(x.bookingUrl)}" target="_blank" rel="noopener">${esc(L.shTickets)}${ICONS.external}</a>` : ""}
    </div>
  </div>` : ""}

  <div class="sfoot">
    <button class="btn btn-primary" type="button" data-sheet-save>${esc(L.shSave)}</button>
    <button class="btn btn-danger right" type="button" data-sheet-remove>${esc(L.shRemove)}</button>
  </div>`;
}

const stopFor = (ref) =>
  ref ? planned().find((x) => x.id === ref.id && x.source === ref.source) : null;

function renderSheet() {
  const box = $("#sheet");
  if (!box) return;
  const p = stopFor(sheetFor);
  // It may have moved or been removed by someone else since the sheet opened.
  if (!p) { sheetFor = null; box.hidden = true; return; }

  const x = detailsOf(p);
  $("#sheet-title").textContent = x.name;
  $("#sheet-body").innerHTML = sheetHTML(x);
  box.hidden = false;
}

function closeSheet() { sheetFor = null; const b = $("#sheet"); if (b) b.hidden = true; }

/** Save through whichever endpoint owns this kind of stop. */
function saveSheet() {
  const p = stopFor(sheetFor);
  if (!p) return closeSheet();
  const box = $("#sheet-body");
  const f = (k) => box.querySelector(`[data-f="${k}"]`)?.value || null;
  const day = f("day"), start = f("start"), end = f("end"), label = f("label");
  closeSheet();

  if (p.source === "own")
    return void mutate("/api/plan/note/update", { id: p.id, label, day, start, end });
  if (p.source === "booked")
    // The booking owns the slot, so editing the time here edits the booking.
    return void mutate("/api/bookings/status", { sightId: p.id, status: "booked",
      bookedDate: day, bookedTime: start, bookedEnd: end });
  return void mutate("/api/plan/set", { sightId: p.id, day, start, end });
}

function removeFromSheet() {
  const p = stopFor(sheetFor);
  if (!p) return closeSheet();
  closeSheet();
  if (p.source === "own") return void mutate("/api/plan/note/remove", { id: p.id });
  if (p.source === "booked")
    // Clearing the slot takes it off the plan; the booking itself stays.
    return void mutate("/api/bookings/status", { sightId: p.id, status: "booked",
      bookedDate: null, bookedTime: null, bookedEnd: null });
  return void mutate("/api/plan/remove", { sightId: p.id });
}

/* ------------------------------------------------------------- actions */

async function lookUp(id) {
  const L = t();
  const box = $(`[data-addrbox="${CSS.escape(id)}"]`);
  const hits = $("[data-addrhits]", box);
  const q = $("[data-addrq]", box).value;
  hits.innerHTML = `<span class="addrnote">${esc(L.loading)}</span>`;

  try {
    const d = await api("/api/geocode", {
      method: "POST",
      body: JSON.stringify({ voter: nameOf() || "?", q }),
    });
    hits.innerHTML = d.results.length
      ? `<span class="addrnote">${esc(L.addrPick)}</span>` + d.results.map((r) =>
          `<button type="button" class="hit" data-hit-id="${esc(id)}" data-hit-lat="${r.lat}"
                   data-hit-lon="${r.lon}" data-hit-label="${esc(r.label)}">${
            r.from ? `<b>${esc(r.from)}</b>` : ""}<span>${esc(r.label)}</span></button>`).join("")
      : `<span class="addrnote">${esc(L.addrNoHits)}</span>`;
  } catch (err) {
    hits.innerHTML = `<span class="addrnote">${esc(err.message)}</span>`;
  }
}

async function mutate(path, body) {
  if (!nameOf()) { setStatus(t().needName, "err"); askName(); return; }
  setStatus(t().saving, "sticky");
  try {
    const d = await api(path, { method: "POST", body: JSON.stringify({ ...body, voter: nameOf() }) });
    // Every one of these can change on any mutation — a booking places a
    // sight, an address changes a route. Missing one leaves the page showing
    // something the server no longer believes.
    CUSTOM = d.custom ?? CUSTOM;
    VOTES = d.votes ?? VOTES;
    STATUS = d.bookings ?? [];
    ENTRIES = d.plan ?? [];
    NOTES = d.notes ?? [];
    TRIP = d.trip ?? TRIP;
    fillMembers(d.members);
    render();
    renderSheet();
    setStatus(t().saved);
  } catch (err) { setStatus(err.message, "err"); }
}

$("#ap-add").addEventListener("click", () => {
  const sightId = $("#ap-what").value;
  if (!sightId) { $("#ap-what").focus(); return; }
  const from = $("#ap-from").value || null;
  const to = $("#ap-to").value || null;
  mutate("/api/plan/set", { sightId, day: $("#ap-day").value, start: from, end: to });
  $("#ap-what").value = ""; $("#ap-from").value = ""; $("#ap-to").value = "";
});

$("#own-add").addEventListener("click", () => {
  const label = $("#own-what").value.trim();
  if (!label) { $("#own-what").focus(); return; }
  mutate("/api/plan/note/add", {
    label,
    day: $("#own-day").value,
    start: $("#own-from").value || null,
    end: $("#own-to").value || null,
    // Only a picked result carries coordinates; typed-but-not-found text is
    // kept as the address so it isn't lost, and the sheet can resolve it later.
    address: pendingPlace ? pendingPlace.label : ($("#own-where").value.trim() || null),
    lat: pendingPlace ? pendingPlace.lat : null,
    lon: pendingPlace ? pendingPlace.lon : null,
  });
  $("#own-what").value = ""; $("#own-from").value = ""; $("#own-to").value = "";
  $("#own-where").value = ""; pendingPlace = null;
  $("[data-addrhits='__new__']").innerHTML = "";
});

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && sheetFor) { closeSheet(); return; }
  if (ev.key !== "Enter" || !ev.target.matches("[data-addrq]")) return;
  ev.preventDefault();
  lookUp(ev.target.closest("[data-addrbox]").dataset.addrbox);
});

$("#own-what").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") { ev.preventDefault(); $("#own-add").click(); }
});

$("#own-where").addEventListener("input", () => {
  if (!pendingPlace || $("#own-where").value === pendingPlace.label) return;
  pendingPlace = null;                     // the text no longer describes it
  renderAdder();
});

document.addEventListener("input", (ev) => {
  if (ev.target.id !== "vmin") return;
  const raw = ev.target.value.trim();
  const n = raw === "" ? 0 : Number(raw);
  if (!Number.isInteger(n) || n < 0 || n > 99) return;
  minVotes = n;
  const at = ev.target.selectionStart;
  render();
  const again = $("#vmin");
  if (again) { again.focus(); try { again.setSelectionRange(at, at); } catch {} }
});

document.addEventListener("click", (ev) => {
  // --- the detail sheet
  if (ev.target.closest("[data-sheet-save]")) return void saveSheet();
  if (ev.target.closest("[data-sheet-remove]")) return void removeFromSheet();
  // Clicking the backdrop itself, or the ×, closes it.
  if (ev.target.closest("#sheet-close") || ev.target.id === "sheet") return void closeSheet();

  const row = ev.target.closest("li.stop");
  // Buttons, links and fields inside a row do their own job; only the row
  // itself opens the sheet, or the arrows and the address form stop working.
  if (row && !ev.target.closest("button, a, select, input, label, .addrform")) {
    sheetFor = { id: row.dataset.stop, source: row.dataset.src };
    renderSheet();
    $("#sheet-close")?.focus();
    return;
  }

  const st = ev.target.closest("[data-start]");
  if (st) {
    startFrom = st.dataset.start === "base" ? "base" : "none";
    localStorage.setItem(START_KEY, startFrom);
    return void render();
  }

  if (ev.target.closest("#baseedit")) { editingBase = !editingBase; return void render(); }
  if (ev.target.closest("[data-basecancel]")) { editingBase = false; return void render(); }
  if (ev.target.closest("[data-baseclear]")) {
    editingBase = false;
    return void mutate("/api/trip/base", { name: null, lat: null, lon: null });
  }

  const toggle = ev.target.closest("#addtoggle");
  if (toggle) {
    const box = $("#addplan");
    box.hidden = !box.hidden;
    render();
    if (!box.hidden) $(addMode === "sight" ? "#ap-what" : "#own-what").focus();
    return;
  }

  const mode = ev.target.closest("[data-mode]");
  if (mode) { addMode = mode.dataset.mode; return void render(); }

  const v = ev.target.closest("[data-votes]");
  if (v) { minVotes = Number(v.dataset.votes); return void render(); }

  const sc = ev.target.closest("[data-source]");
  if (sc) { source = sc.dataset.source; return void render(); }

  const openAddr = ev.target.closest("[data-addr]");
  if (openAddr) {
    if (!nameOf()) { setStatus(t().needName, "err"); askName(); return; }
    editingAddress = openAddr.dataset.addr;
    render();
    renderSheet();
    $(`[data-addrbox="${CSS.escape(editingAddress)}"] [data-addrq]`)?.focus();
    return;
  }

  if (ev.target.closest("[data-addrcancel]")) {
    editingAddress = null;
    render();
    return void renderSheet();
  }

  const clear = ev.target.closest("[data-addrclear]");
  if (clear) {
    editingAddress = null;
    return void mutate(addressPathFor(clear.dataset.addrclear),
      { id: clear.dataset.addrclear, address: null, lat: null, lon: null });
  }

  if (ev.target.closest("#own-where-clear")) {
    pendingPlace = null;
    $("#own-where").value = "";
    $("[data-addrhits='__new__']").innerHTML = "";
    return void renderAdder();
  }

  const find = ev.target.closest("[data-addrfind]");
  if (find) return void lookUp(find.dataset.addrfind);

  // Choosing a result saves it — one step, since picking it *is* the decision.
  const hit = ev.target.closest("[data-hit-lat]");
  if (hit && hit.dataset.hitId === "__base__") {
    editingBase = false;
    return void mutate("/api/trip/base", {
      name: hit.dataset.hitLabel,
      lat: Number(hit.dataset.hitLat),
      lon: Number(hit.dataset.hitLon),
    });
  }
  // Nothing exists to save it to yet, so hold it until "Add it" is pressed.
  if (hit && hit.dataset.hitId === "__new__") {
    pendingPlace = { label: hit.dataset.hitLabel,
                     lat: Number(hit.dataset.hitLat), lon: Number(hit.dataset.hitLon) };
    $("#own-where").value = pendingPlace.label;
    $("[data-addrhits='__new__']").innerHTML = "";
    renderAdder();
    return;
  }

  if (hit) {
    const id = hit.dataset.hitId;
    editingAddress = null;
    return void mutate(addressPathFor(id), {
      id,
      address: hit.dataset.hitLabel,
      lat: Number(hit.dataset.hitLat),
      lon: Number(hit.dataset.hitLon),
    });
  }
});

onLang(() => {
  if (SIGHTS.length || TRIP.days.length) { render(); renderSheet(); }
  else paintChrome();
});
onPrefs(() => { if (SIGHTS.length || TRIP.days.length) { render(); renderSheet(); } });   // the maps app changed

(async () => {
  try {
    const d = await api("/api/sights");
    SIGHTS = d.sights; CUSTOM = d.custom; VOTES = d.votes;
    STATUS = d.bookings ?? []; ENTRIES = d.plan ?? []; NOTES = d.notes ?? [];
    TRIP = d.trip ?? { days: [] };
    fillMembers(d.members);
    render();
  } catch (err) { setStatus(err.message, "err"); }
})();
</script>
</body>
</html>
