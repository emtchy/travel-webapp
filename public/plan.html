<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>London - What we plan to see</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗓️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  /* iOS-leaning control tokens. Blue for anything actionable, the page's own
     maroon for anything destructive; both deep enough to read at 12px, which
     the old --ink-3 text buttons were not. The blue is pulled off Apple's
     system blue towards the warm paper ground so it doesn't shout. */
  --tint:#1A5FCC;
  --tint-bg:rgba(26,95,204,.09);
  --tint-br:rgba(26,95,204,.26);
  --on-tint:#FFFFFF;
  --danger:#8E2431;
  --danger-bg:rgba(142,36,49,.08);
  --on-danger:#FFFFFF;
  --ctl:#FFFFFF;
  --ctl-br:rgba(23,29,25,.20);
  --sep:rgba(23,29,25,.09);
  --ui:"Instrument Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  --paper:#F3F4F0; --card:#FBFCF9; --card-2:#EDEFE9;
  --ink:#171D19; --ink-2:#4B554E; --ink-3:#78837A;
  --line:#D9DDD4; --line-2:#C4CABD;
  --maroon:#7B2230; --maroon-soft:#F0E2E3;
  --green:#1F4A3C; --green-soft:#E1EAE4;
  --brass:#8A6118; --brass-soft:#F2E9D6;
  --shadow:0 1px 2px rgba(23,29,25,.06), 0 10px 28px -20px rgba(23,29,25,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --tint:#79B0FF;
    --tint-bg:rgba(121,176,255,.15);
    --tint-br:rgba(121,176,255,.32);
    --on-tint:#101410;
    --danger:#E0868F;
    --danger-bg:rgba(224,134,143,.14);
    --on-danger:#101410;
    --ctl:#212722;
    --ctl-br:rgba(233,236,229,.20);
    --sep:rgba(233,236,229,.10);
    --paper:#101410; --card:#171C18; --card-2:#1E241F;
    --ink:#E9ECE5; --ink-2:#A7B1A6; --ink-3:#7C867C;
    --line:#2A322B; --line-2:#3A443B;
    --maroon:#E0868F; --maroon-soft:#2E1A1E;
    --green:#7CBBA0; --green-soft:#152420;
    --brass:#D9AC59; --brass-soft:#241D0F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -22px rgba(0,0,0,.9);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
a{color:var(--maroon)}

/* ---- top nav ---- */
.topnav{position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.navinner{max-width:1180px;margin:0 auto;padding:9px 20px;min-height:56px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:17px;
  letter-spacing:-.01em;color:var(--ink);text-decoration:none;white-space:nowrap}
.navlinks{display:flex;gap:4px}
.navlinks a{font-size:14px;font-weight:500;color:var(--ink-3);text-decoration:none;
  padding:7px 14px;border-radius:9px;transition:color .15s,background .15s}
.navlinks a:hover{color:var(--ink);background:var(--card-2)}
.navlinks a[aria-current="page"]{color:var(--ink);background:var(--card-2);font-weight:600}
.navtools{display:flex;gap:9px;align-items:center;margin-left:auto}
.navtools input[type=text]{font:inherit;font-size:14px;padding:6px 11px;border-radius:9px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink);
  width:132px;min-width:0}
.navtools input[type=text]:focus{outline:2px solid var(--maroon);outline-offset:-1px;width:160px}
.navstatus{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.langs{display:flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;flex:none}
.langs button{padding:6px 10px;font-size:12px;font-weight:600;border:0;
  background:var(--card);color:var(--ink-3)}
.langs button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (max-width:700px){
  .navinner{padding:9px 16px;gap:10px}
  .navtools{margin-left:auto;flex-wrap:wrap}
  .navtools input[type=text]{width:112px}
  .navtools input[type=text]:focus{width:112px}
  .navstatus{flex-basis:100%;max-width:none;text-align:right}
}
@media (max-width:520px){
  .navinner{gap:8px;row-gap:6px}
  .brand{font-size:15px}
  /* the four links get their own line rather than squeezing the name field */
  .navlinks{order:3;flex-basis:100%;overflow-x:auto;scrollbar-width:none}
  .navlinks::-webkit-scrollbar{display:none}
  .navlinks a{padding:6px 10px;font-size:13.5px;white-space:nowrap}
  .navtools input[type=text],.navtools input[type=text]:focus{width:100%;flex:1}
  .navtools{flex:1;min-width:0}
}


/* ---- filters ---- */
.filters{display:flex;gap:18px;flex-wrap:wrap;align-items:center;
  padding:14px 0 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fgroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fgroup .lbl{font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.fgroup button{font-size:13px;font-weight:500;padding:6px 12px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink-2)}
.fgroup button:hover{border-color:var(--ink-3);color:var(--ink)}
.fgroup button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fgroup button b{font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  font-weight:500;opacity:.55;margin-left:4px}
.fmanual{display:flex;gap:5px;align-items:center}
.fmanual .or{font-size:12px;color:var(--ink-3);margin:0 1px}
.fmanual input{font:inherit;font-size:13px;width:64px;padding:6px 8px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink)}
.fmanual input.on{border-color:var(--ink);background:var(--ink);color:var(--paper);font-weight:600}
.fmanual input::placeholder{color:var(--ink-3);font-size:11.5px}
.fmanual .plus{font-size:13px;color:var(--ink-3)}
.fmanual b{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:500;color:var(--ink-3)}
.hiddenby{font-size:12.5px;color:var(--ink-3);margin:14px 0 0}
.startgroup{margin-left:auto}
.baseedit{font-size:12px;padding:6px 9px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink-3);cursor:pointer}
.baseedit:hover{border-color:var(--ink-3);color:var(--ink)}
.baseform{margin-top:14px;padding:12px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:12px}
.baseform .addrrow{margin-top:0}
.basewhere{font-size:12.5px;color:var(--ink-3);margin:0 0 8px}
.fromyou{font-size:11px;color:var(--green);border:1px solid var(--green);
  background:var(--green-soft);border-radius:5px;padding:1px 7px}

.addbtn{
  margin-left:0;width:36px;height:36px;flex:none;
  font-size:20px;line-height:1;font-weight:400;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);
  border-radius:10px;cursor:pointer;
}
.addbtn:hover{border-color:var(--ink);color:var(--ink)}
.addbtn[aria-expanded="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---- the add panel ---- */
.adder{margin-top:18px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.addermodes{display:flex;gap:6px;padding:14px 18px 0}
.addermodes button{font-size:13px;font-weight:500;padding:7px 13px;border-radius:9px;
  border:1px solid var(--line-2);background:var(--card-2);color:var(--ink-2);cursor:pointer}
.addermodes button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.adder .apbody{border-top:0;padding-top:14px}

/* ---- the detail sheet ---- */
/* Shaped after an iOS sheet: a blurred scrim, a large-radius card that rises
   from the bottom on a phone, grouped rows, and controls of one height so the
   labels above them line up without being nudged. */
.sheetback{
  position:fixed;inset:0;z-index:100;background:rgba(16,18,22,.45);
  display:flex;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
}
.sheetback[hidden]{display:none}
.sheet{
  background:var(--card);border-radius:20px;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.45), 0 0 0 .5px var(--sep);
  width:min(640px,100%);max-height:calc(100dvh - 40px);overflow-y:auto;
  font-family:var(--ui);
}
.sheet > header{
  padding:20px 22px 14px;border-bottom:.5px solid var(--sep);
  display:flex;align-items:flex-start;gap:12px;position:sticky;top:0;z-index:2;
  background:var(--card);border-radius:20px 20px 0 0;
}
.sheet h2{
  font-family:"Fraunces",Georgia,serif;font-size:22px;margin:0;
  font-weight:600;line-height:1.2;flex:1;letter-spacing:-.01em;
}
.sheetclose{
  border:0;background:var(--card-2);color:var(--ink-2);
  width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1;
  cursor:pointer;flex:none;display:grid;place-items:center;
}
.sheetclose:hover{background:var(--line);color:var(--ink)}
.sheetbody{padding:16px 22px 22px;display:grid;gap:20px}

.srow{display:grid;gap:8px}
.slabel{
  font-family:var(--ui);font-size:12px;font-weight:600;letter-spacing:.02em;
  text-transform:uppercase;color:var(--ink-3);
}
.sval{font-size:15.5px;color:var(--ink);line-height:1.45}
.sval.muted{color:var(--ink-3);font-size:14px}

/* One row, one line — and it stays one line. Wrapping is off, so when the
   sheet narrows the name and the day give up width instead of the To field
   dropping underneath. Below 560px it becomes a grid instead; see there. */
.sfields{display:flex;gap:10px;align-items:flex-end;flex-wrap:nowrap}
.sfields label{
  display:flex;flex-direction:column;gap:6px;
  font-size:12.5px;color:var(--ink-2);flex:0 1 auto;min-width:0;
}
.sfields label.wide{flex:1 1 110px}
.sfields input,.sfields select{
  font:inherit;font-family:var(--ui);font-size:15px;height:38px;
  padding:0 11px;border-radius:10px;
  border:.5px solid var(--ctl-br);background:var(--ctl);color:var(--ink);
  -webkit-appearance:none;appearance:none;
}
.sfields select{padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),
                   linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.sfields input[type=time]{width:104px;flex:none;text-align:center}
.sfields select{max-width:170px;min-width:0;width:100%}
.sfields label.wide input{width:100%}
.sfields input:focus,.sfields select:focus{
  outline:none;border-color:var(--tint);box-shadow:0 0 0 3px var(--tint-bg);
}

.svoters{display:flex;gap:6px;flex-wrap:wrap}
.svoter{
  font-size:13px;background:var(--card-2);border-radius:999px;padding:4px 12px;
  color:var(--ink);
}
.slinks{display:flex;gap:8px;flex-wrap:wrap}
.slinks a{
  font-size:14px;font-weight:600;text-decoration:none;padding:9px 14px;
  border-radius:10px;background:var(--tint-bg);color:var(--tint);
  border:.5px solid var(--tint-br);
}
.slinks a:hover{background:var(--tint);color:var(--on-tint);border-color:var(--tint)}

.sfoot{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding-top:18px;border-top:.5px solid var(--sep);
}
.sfoot .save{
  font-family:var(--ui);font-size:15px;font-weight:600;padding:11px 20px;
  border-radius:12px;border:0;background:var(--tint);color:var(--on-tint);cursor:pointer;
}
.sfoot .save:hover{filter:brightness(1.08)}
.sfoot .danger{
  font-family:var(--ui);font-size:14px;font-weight:600;padding:10px 15px;
  border-radius:12px;border:.5px solid var(--danger);
  background:var(--danger-bg);color:var(--danger);cursor:pointer;margin-left:auto;
}
.sfoot .danger:hover{background:var(--danger);color:var(--on-danger)}

li.stop{cursor:pointer}
li.stop:hover{background:var(--card-2)}
.openhint{
  font-family:var(--ui);font-size:11px;font-weight:600;color:var(--tint);
  opacity:0;transition:opacity .12s;
}
li.stop:hover .openhint{opacity:1}

@media (max-width:560px){
  /* name over day over from|to — four fields never fit one line here */
  .sfields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sfields label,.sfields label.wide{grid-column:1 / -1}
  .sfields label[data-half]{grid-column:auto}
  .sfields input,.sfields select{width:100%}
  .sfields input[type=time]{width:100%;flex:auto}
  .sfields select{max-width:none}
  .sheetbody{padding:14px 18px 20px;gap:17px}
  .sheet > header{padding:20px 18px 13px}
  .sheet h2{font-size:20px}
  .sfoot .danger{margin-left:0;flex:1}
  .sfoot .save{flex:1}
}

@media (max-width:600px){
  .sheetback{padding:0;align-items:flex-end}
  .sheet{max-height:92dvh;border-radius:20px 20px 0 0;width:100%}
  .sheet > header{border-radius:20px 20px 0 0}
  /* the iOS grabber */
  .sheet > header::before{
    content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
    width:36px;height:5px;border-radius:3px;background:var(--line-2);
  }
  .sheet > header{padding-top:20px}
}

/* ---- day columns ---- */
/* auto-fit rather than fixed breakpoints: the columns are sized by what a day
   actually needs, so a 1280px laptop gets three of them and not two wide ones. */
.days{display:grid;gap:18px;margin-top:26px;
  grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
@media (max-width:380px){.days{grid-template-columns:1fr}}
.day{background:var(--card);border:.5px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.day > header{padding:14px 17px;border-bottom:.5px solid var(--sep);
  background:var(--card-2);display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.day h2{font-family:"Fraunces",Georgia,serif;font-size:18px;margin:0;font-weight:600}
.day .wd{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--maroon)}
.day .n{margin-left:auto;font-family:"IBM Plex Mono",monospace;
  font-size:11px;color:var(--ink-3)}
ol.stops{list-style:none;margin:0;padding:6px 0;flex:1;min-height:54px}
li.stop{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:11px 17px;
  border-bottom:.5px solid var(--sep)}
li.stop:last-child{border-bottom:0}
.when{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);
  white-space:nowrap;padding-top:1px;min-width:44px}
.when em{display:block;font-style:normal;color:var(--ink-3);font-size:11px}
.when.open{color:var(--ink-3)}
.sname{font-weight:600;font-size:14.5px;line-height:1.3}
.smeta{font-size:12px;color:var(--ink-3);margin-top:2px;
  display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.src{font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  border-radius:4px;padding:1px 5px;border:1px solid}
.src.booked{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.src.hand{color:var(--brass);border-color:var(--brass);background:var(--brass-soft)}
.stopact{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.stopact button,.fromhere{
  font-family:var(--ui);font-size:12px;font-weight:600;line-height:1;
  padding:6px 11px;border-radius:999px;cursor:pointer;text-decoration:none;
  border:.5px solid var(--tint-br);background:var(--tint-bg);color:var(--tint);
  display:inline-flex;align-items:center;gap:4px;
}
.stopact button:hover,.fromhere:hover{background:var(--tint);color:var(--on-tint);border-color:var(--tint)}
.dayempty{padding:20px 17px;color:var(--ink-3);font-size:13px}
.dayroute{display:flex;gap:7px;align-items:center;flex-wrap:wrap;
  padding:11px 17px;border-top:.5px solid var(--sep);background:var(--card-2)}
.dayroute a{font-family:var(--ui);font-size:13px;font-weight:600;text-decoration:none;
  padding:8px 13px;border-radius:999px;border:.5px solid var(--tint-br);
  background:var(--tint-bg);color:var(--tint)}
.dayroute a:hover{background:var(--tint);color:var(--on-tint);border-color:var(--tint)}
.routenote{font-size:12px;color:var(--ink-2);flex-basis:100%}

.noloc{font-size:11px;color:var(--maroon);border:1px solid var(--maroon);
  background:var(--maroon-soft);border-radius:5px;padding:1px 6px}
.addrform{margin-top:8px;padding:11px;border:.5px solid var(--ctl-br);
  border-radius:14px;background:var(--card-2)}
.addrrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.addrrow input{font:inherit;font-size:13.5px;padding:8px 11px;border-radius:10px;flex:1;
  min-width:170px;border:.5px solid var(--ctl-br);background:var(--ctl);color:var(--ink)}
.addrrow input:focus{outline:none;border-color:var(--tint);box-shadow:0 0 0 3px var(--tint-bg)}
.linky{font-family:var(--ui);font-size:12px;font-weight:600;border:.5px solid var(--ctl-br);
  background:var(--ctl);color:var(--ink-2);padding:6px 11px;border-radius:999px;cursor:pointer}
.linky:hover{color:var(--ink);border-color:var(--ink-3)}
.addrhits{display:grid;gap:3px;margin-top:7px}
.addrhits button{text-align:left;font-size:13px;padding:8px 11px;border-radius:10px;
  border:.5px solid var(--ctl-br);background:var(--ctl);color:var(--ink-2);cursor:pointer}
.addrhits button:hover{border-color:var(--tint);color:var(--ink);background:var(--tint-bg)}
.addrhits button b{color:var(--green);font-size:10px;text-transform:uppercase;
  letter-spacing:.06em;margin-right:5px}
.addrnote{font-size:11.5px;color:var(--ink-3)}

/* ---- small screens ----
   The desktop layout is a row of controls; below this width it becomes a
   stack, and anything with a hard min-width has to give it up or the page
   scrolls sideways. */
@media (max-width:560px){
  .wrap{padding:0 14px 60px}
  .stats{gap:18px 24px;padding:18px 0 16px}
  .stat b{font-size:24px}
  .filters{gap:12px}
  .startgroup{margin-left:0;flex-basis:100%}
  .fgroup{width:100%}
  input[type=text]{min-width:0}

  .apbody{padding:14px 16px 16px;gap:12px}
  .apbody label{flex:1 1 100%}
  .apbody select,.apbody input,.apbody #own-what{min-width:0;width:100%}
  /* the two times still belong side by side */
  .apbody label[id$="-from-l"],.apbody label[id$="-to-l"]{flex:1 1 calc(50% - 6px)}
  .apbody .btn{width:100%}
  .apwhere label{min-width:0;flex:1 1 100%}
  .apwhere .addrrow{flex-wrap:wrap}
  .apwhere .btn{width:auto;flex:1}

  .day > header{padding:12px 14px}
  li.stop{padding:10px 14px;gap:9px}
  .dayroute{padding:10px 14px}
  .addrrow input{min-width:0}
}

/* ---- add to the plan ---- */
.addplan{margin-top:26px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.addplan > summary{padding:14px 18px;cursor:pointer;font-weight:600;font-size:15px}
.apbody{padding:14px 18px 18px;border-top:1px solid var(--line);
  display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.apbody label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2)}
.apbody select,.apbody input{font:inherit;font-size:13.5px;padding:7px 10px;

    startBaseTitle: "Routen bei der Unterkunft starten",
    startMeTitle: "Routen bei meinem Standort starten",
    startNoneTitle: "Kein Startpunkt – die geöffnete App entscheidet",
    locAsking: "Browser wird gefragt…", locDenied: "Der Browser hat den Standort nicht geteilt.",
    locFrom: "ab dir", baseFrom: "ab der Unterkunft",
    baseEdit: "Ändern", baseNone: "Für die Unterkunft ist keine Adresse hinterlegt.",
    basePh: "Adresse der Unterkunft, Maps-Link oder Koordinaten",
    modeSight: "Eine Sehenswürdigkeit", modeOwn: "Etwas Eigenes",
    ownTitle: "Oder einen eigenen Eintrag",
    ownWhat: "Was", ownPh: "Musical · Abendessen mit Anna · Zug zurück",
    ownAdd: "Eintragen",
    ownHint: "Alles, was keine Sehenswürdigkeit ist. Nur Name und Tag sind nötig.",
    srcOwn: "eigener", fOwn: "Eigene",
    votesShort: (n) => `${n} ♥`,

};
let lang = localStorage.getItem(LANG_KEY) || (navigator.language?.startsWith("de") ? "de" : "en");
const t = () => T[lang];

let SIGHTS = [], CUSTOM = [], VOTES = {}, STATUS = [], ENTRIES = [], NOTES = [], TRIP = { days: [] };
let minVotes = 0;
let editingAddress = null;   // sight id whose address form is open
// A place picked on the add form, held until the entry it belongs to exists.
let pendingPlace = null;     // { label, lat, lon } | null
let addMode = "sight";       // which half of the add panel is showing
let openedOnce = false;
let sheetFor = null;   // { id, source } of the stop whose detail sheet is open      // so an empty plan opens it once, not on every render
// Where you are. Kept in memory only: it is nobody else's business, least of
// all the shared plan's.
let myPos = null;
// "base" | "me" | "none". The hotel is the sensible default: it is where every
// morning starts. Personal to this browser — it changes links, not the plan.
let startFrom = localStorage.getItem("london-plan-start") || "base";
let editingBase = false;
let source = "all";       // all | booked | hand

const nameOf = () => $("#name").value.trim();
const setStatus = (m) => { $("#status").textContent = m; };
const title = (s) => (lang === "de" && s.name_de) || s.name;
const all = () => [...SIGHTS, ...CUSTOM];
const byId = (id) => all().find((s) => s.id === id);

async function api(path, options) {
  const res = await fetch(path, { ...options, headers: {
    "content-type": "application/json",
    ...(localStorage.getItem(CODE_KEY) ? { "x-access-code": localStorage.getItem(CODE_KEY) } : {}),
  }});
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    const entered = window.prompt("Access code / Zugangscode:");
    if (entered) { localStorage.setItem(CODE_KEY, entered); return api(path, options); }
  }
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

/* -------------------------------------------------------------- the plan */

/**
 * The plan is two sources merged. A booking with a date places itself; the
 * server refuses a hand-made entry for one, so nothing can appear twice.
 */
function planned() {
  const fromBookings = STATUS
    .filter((b) => b.status === "booked" && b.date)
    .map((b) => ({ id: b.id, day: b.date, start: b.time, end: b.endTime,
                   who: b.by, source: "booked" }));

  const byHand = ENTRIES.map((e) => ({ id: e.id, day: e.day, start: e.start,
                                       end: e.end, who: e.addedBy, source: "hand" }));

  // Your own entries are not sights at all, so they carry their own label.
  const own = NOTES.map((n) => ({ id: n.id, day: n.day, start: n.start, end: n.end,
                                  who: n.addedBy, source: "own", label: n.label }));

  return [...fromBookings, ...byHand].filter((p) => byId(p.id)).concat(own);
}

// Untimed entries sort to the end of their day — you know the day, not the hour.
const byClock = (a, b) => (a.start ?? "99:99").localeCompare(b.start ?? "99:99");

/** The origin the links should use right now, or null for none. */
function originNow() {
  if (startFrom === "me") return myPos;
  if (startFrom === "base") return TRIP.base ?? null;
  return null;
}


/** Names of everyone on the trip, offered as suggestions on the name box.
 *  Still a free-text field: whoever is not on the list yet can just type. */
/** The line above the headline: whatever the trip says it is. */
function tripKicker(trip) {
  if (!trip) return "";
  const fmt = (iso) => iso
    ? new Date(iso + "T12:00:00Z").toLocaleDateString(lang === "de" ? "de-DE" : "en-GB",
        { day: "numeric", month: "long", timeZone: "UTC" })
    : "";
  const when = trip.startDate && trip.endDate
    ? `${fmt(trip.startDate)} – ${fmt(trip.endDate)}` : "";
  return [trip.destination || trip.name, when].filter(Boolean).join(" · ");
}

function fillMembers(list) {
  const box = document.getElementById("members");
  if (!box) return;
  box.innerHTML = (list ?? []).map((m) =>
    `<option value="${String(m.name).replace(/"/g, "&quot;")}"></option>`).join("");
}

const dayLabel = (iso) =>
  new Date(iso + "T12:00:00Z").toLocaleDateString(lang === "de" ? "de-DE" : "en-GB",
    { day: "numeric", month: "long", timeZone: "UTC" });
const weekday = (iso) =>
  new Date(iso + "T12:00:00Z").toLocaleDateString(lang === "de" ? "de-DE" : "en-GB",
    { weekday: "long", timeZone: "UTC" });

/** "Fri", "Fr." — for the sheet, where a full weekday would break the line. */
const weekdayShort = (iso) =>
  new Date(iso + "T12:00:00Z").toLocaleDateString(lang === "de" ? "de-DE" : "en-GB",
    { weekday: "short", timeZone: "UTC" });

/** The place a stop routes to, whatever kind of stop it is. */
const placeOf = (p) =>
  p.source === "own" ? NOTES.find((n) => n.id === p.id) ?? null : byId(p.id);

/**
 * The thing whose address can be edited, and where to send it. Built-in sights
 * already have coordinates, so they answer null.
 */
/** True when this stop could have a location and hasn't got one yet. */
const needsPlace = (p) => {
  const target = locatable(p);
  return !!target && !hasPlace(target.it);
};

function locatable(p) {
  if (p.source === "own") {
    const n = NOTES.find((x) => x.id === p.id);
    return n && { it: n, name: n.label, path: "/api/plan/note/address" };
  }
  const s = byId(p.id);
  return s?.custom ? { it: s, name: s.name, path: "/api/sights/address" } : null;
}

function stopHTML(p, i, stops) {
  const L = t();
  const own = p.source === "own";
  const s = own ? null : byId(p.id);
  // "I have done the first two" — a link on each stop covering it and the rest.
  const onward = routeFrom(stops.map(placeOf), i, "transit", originNow());
  const votes = own ? 0 : (VOTES[p.id] ?? []).length;
  const label = own ? p.label : title(s);

  return `<li class="stop" data-stop="${esc(p.id)}" data-src="${esc(p.source)}">
    <div class="when${p.start ? "" : " open"}">
      ${p.start ? esc(p.start) : esc(L.noTime)}
      ${p.end ? `<em>${esc(p.end)}</em>` : ""}
    </div>
    <div>
      <div class="sname">${esc(label)} <span class="openhint">${esc(L.open)} ↗</span></div>
      <div class="smeta">
        ${p.source === "booked" ? `<span class="src booked">${esc(L.srcBooked)}</span>` : ""}
        ${votes ? `<span>${esc(L.votesShort(votes))}</span>` : ""}
        <span>${esc(p.source === "booked" ? L.bookedBy : L.addedBy)} ${esc(p.who)}</span>
        ${needsPlace(p) ? `<span class="noloc">${esc(L.noLocation)}</span>` : ""}
      </div>
      ${onward && i > 0 ? `<div class="stopact">
        <a class="fromhere" href="${esc(onward.google)}" target="_blank" rel="noopener"
           >${esc(L.routeFromHere)} ↗</a>
      </div>` : ""}
    </div>
  </li>`;
}

const votesOf = (id) => (VOTES[id] ?? []).length;

/** Filters narrow what the plan *shows*; nothing is removed by using them. */
const passes = (p) =>
  // Your own entries have no votes to threshold, so a vote filter must not
  // quietly hide the musical you already paid for.
  (p.source === "own" || votesOf(p.id) >= minVotes) &&
  (source === "all" || source === p.source);

/** The whole day, start to finish, from wherever you are now. */
function dayRouteHTML(stops) {
  const L = t();
  if (!stops.length) return "";
  const r = routeLinks(stops.map(placeOf), "transit", originNow());
  if (!r) return `<div class="dayroute"><span class="routenote">${esc(L.routeNone)}</span></div>`;

  return `<div class="dayroute">
    <a href="${esc(r.google)}" target="_blank" rel="noopener">${esc(L.routeGoogle)} ↗</a>
    <a href="${esc(r.apple)}" target="_blank" rel="noopener">${esc(L.routeApple)} ↗</a>
    ${r.from ? `<span class="fromyou">${esc(startFrom === "me" ? L.locFrom : L.baseFrom)}</span>` : ""}
    ${r.skipped ? `<span class="routenote">${esc(L.routeSkipped(r.skipped))}</span>` : ""}
    ${r.capped ? `<span class="routenote">${esc(L.routeCapped)}</span>` : ""}
  </div>`;
}

/**
 * Shown on a stop that has no location, and on one that has an address you may
 * want to change. Collapsed until asked for — a form open on every stop would
 * bury the plan itself.
 */
function addressControlHTML(p) {
  const L = t();
  const target = locatable(p);
  if (!target) return "";                    // built-ins already have coordinates

  const { it, name } = target;
  const placed = hasPlace(it);

  if (editingAddress !== it.id)
    return `<div class="stopact">
      <button type="button" data-addr="${esc(it.id)}">${
        esc(placed ? L.changeAddress : L.addAddress)}</button>
      ${placed ? `<button type="button" class="linky" data-addrclear="${esc(it.id)}">${
        esc(L.addrClear)}</button>` : ""}
    </div>`;

  return `<div class="addrform" data-addrbox="${esc(it.id)}">
    <div class="addrrow">
      <input type="text" data-addrq maxlength="500" placeholder="${esc(L.addrPh)}"
             value="${esc(it.address ?? name)}">
      <button class="btn" type="button" data-addrfind="${esc(it.id)}">${esc(L.addrFind)}</button>
      <button type="button" class="linky" data-addrcancel>${esc(L.addrCancel)}</button>
      ${placed ? `<button type="button" class="linky" data-addrclear="${esc(it.id)}">${esc(L.addrClear)}</button>` : ""}
    </div>
    <div class="addrhits" data-addrhits="${esc(it.id)}"></div>
  </div>`;
}

/** Both kinds go to their own endpoint; the payload is identical. */
const addressPathFor = (id) =>
  id.startsWith("note-") ? "/api/plan/note/address" : "/api/sights/address";

function renderFilters() {
  const L = t();
  const list = planned();
  const top = list.reduce((a, p) => Math.max(a, votesOf(p.id)), 0);
  const steps = Array.from({ length: Math.min(top, 6) + 1 }, (_, n) => n);
  const countAt = (n) => list.filter((p) => (p.source === "own" || votesOf(p.id) >= n) &&
    (source === "all" || source === p.source)).length;

  const votesBtns = steps.map((n) =>
    `<button type="button" data-votes="${n}" aria-pressed="${minVotes === n}">${
      n === 0 ? esc(L.fAll) : n + esc(L.fPlus)} <b>${countAt(n)}</b></button>`).join("");

  const typed = !steps.includes(minVotes);
  const manual =
    `<span class="fmanual"><span class="or">${esc(L.fOr)}</span>` +
    `<input type="number" id="vmin" min="0" max="99" step="1"` +
    ` title="${esc(L.fCustomTitle)}" aria-label="${esc(L.fCustomTitle)}"` +
    ` placeholder="${esc(L.fCustom)}" value="${typed ? minVotes : ""}"` +
    `${typed ? ' class="on"' : ""}>` +
    `<span class="plus">${esc(L.fPlus)}</span>` +
    `${typed ? `<b>${countAt(minVotes)}</b>` : ""}</span>`;

  const sources = [
    ["all", L.fAll, list.length],
    ["booked", L.fBooked, list.filter((p) => p.source === "booked").length],
    ["hand", L.fHand, list.filter((p) => p.source === "hand").length],
    ["own", L.fOwn, list.filter((p) => p.source === "own").length],
  ].map(([k, label, n]) =>
    `<button type="button" data-source="${k}" aria-pressed="${source === k}">${esc(label)} <b>${n}</b></button>`).join("");

  const open = !$("#addplan").hidden;
  $("#filters").innerHTML =
    `<div class="fgroup"><span class="lbl">${esc(L.fVotes)}</span>${votesBtns}${manual}</div>` +
    `<div class="fgroup"><span class="lbl">${esc(L.fSource)}</span>${sources}</div>` +
    `<div class="fgroup startgroup"><span class="lbl">${esc(L.startLbl)}</span>` +
    [["base", L.startBase, L.startBaseTitle],
     ["me", L.startMe, L.startMeTitle],
     ["none", L.startNone, L.startNoneTitle]].map(([k, label, title]) =>
      `<button type="button" data-start="${k}" aria-pressed="${startFrom === k}"
               title="${esc(title)}">${esc(label)}</button>`).join("") +
    `<button type="button" class="baseedit" id="baseedit" title="${esc(L.baseEdit)}"
             aria-label="${esc(L.baseEdit)}">✎</button></div>` +
    `<button class="addbtn" id="addtoggle" type="button" aria-expanded="${open}"
             title="${esc(open ? L.addClose : L.addNew)}"
             aria-label="${esc(open ? L.addClose : L.addNew)}">${open ? "×" : "+"}</button>`;
}

/** Where the days start. Collapsed unless you press the pencil. */
function renderBaseForm() {

  box.hidden = !editingBase;
  if (!editingBase) return;

function renderAdder() {
  const L = t();
  const placed = new Set(planned().map((p) => p.id));

  const options = all()
    .filter((s) => !placed.has(s.id))
    .sort((a, b) => (VOTES[b.id] ?? []).length - (VOTES[a.id] ?? []).length ||
                    title(a).localeCompare(title(b)));

  $("#ap-what-l").firstChild.textContent = L.apWhat + " ";
  $("#ap-day-l").firstChild.textContent = L.apDay + " ";
  $("#ap-from-l").firstChild.textContent = L.apFrom + " ";
  $("#ap-to-l").firstChild.textContent = L.apTo + " ";
  $("#ap-add").textContent = L.apAdd;
  $("#ap-hint").textContent = options.length ? L.apHint : L.apNone;
  $("#mode-sight").textContent = L.modeSight;
  $("#mode-own").textContent = L.modeOwn;
  $("#mode-sight").setAttribute("aria-pressed", String(addMode === "sight"));
  $("#mode-own").setAttribute("aria-pressed", String(addMode === "own"));
  $("#form-sight").hidden = addMode !== "sight";
  $("#form-own").hidden = addMode !== "own";
  $("#own-what-l").firstChild.textContent = L.ownWhat + " ";
  $("#own-day-l").firstChild.textContent = L.apDay + " ";
  $("#own-from-l").firstChild.textContent = L.apFrom + " ";
  $("#own-to-l").firstChild.textContent = L.apTo + " ";
  $("#own-what").placeholder = L.ownPh;
  $("#own-where-l").firstChild.textContent = L.ownWhere + " ";
  $("#own-where").placeholder = L.ownWherePh;
  $("#own-find").textContent = L.addrFind;
  $("#own-where-clear").textContent = L.addrClear;
  $("#own-where-clear").hidden = !pendingPlace;
  const wnote = $("#own-where-note");
  wnote.textContent = pendingPlace ? L.ownWhereSet(pendingPlace.label) : L.ownWhereHint;
  wnote.classList.toggle("set", !!pendingPlace);
  $("#own-add").textContent = L.ownAdd;
  $("#own-hint").textContent = L.ownHint;
  $("#ap-add").disabled = !options.length;

  const keepWhat = $("#ap-what").value;
  $("#ap-what").innerHTML = `<option value="">${esc(L.apPick)}</option>` +
    options.map((s) => {
      const v = (VOTES[s.id] ?? []).length;
      return `<option value="${esc(s.id)}">${esc(title(s))}${v ? ` — ${v} ♥` : ""}</option>`;
    }).join("");
  if (options.some((s) => s.id === keepWhat)) $("#ap-what").value = keepWhat;

  const dayOptions = TRIP.days
    .map((d) => `<option value="${esc(d)}">${esc(weekday(d))} ${esc(dayLabel(d))}</option>`).join("");

  for (const id of ["#ap-day", "#own-day"]) {
    const sel = $(id);
    const keep = sel.value;
    sel.innerHTML = dayOptions;
    if (TRIP.days.includes(keep)) sel.value = keep;
  }
}

function render() {
  const L = t();
  document.documentElement.lang = lang;
  for (const [id, key] of [["kicker","kicker"],["headline","headline"],["lede","lede"],
    ["foot","foot"],["name-label","nameLabel"],["nav-sights","navSights"],
    ["nav-bookings","navBookings"],["nav-plan","navPlan"],["nav-details","navDetails"]])
    $("#" + id).textContent = L[key];
  $("#name").placeholder = L.nameLabel;
  $("#kicker").textContent = tripKicker(TRIP) || L.kicker;

  const list = planned();
  const shown = list.filter(passes);
  const days = TRIP.days.map((d) => ({
    date: d,
    stops: shown.filter((p) => p.day === d).sort(byClock),
  }));

  $("#stats").innerHTML = [
    [list.length, L.statPlanned],
    [list.filter((p) => p.source === "booked").length, L.statBooked],
    [list.filter((p) => p.source !== "booked").length, L.statHand],
    [days.filter((d) => d.stops.length).length, L.statDays],
  ].map(([v, k]) => `<div class="stat"><b>${v}</b><span>${esc(k)}</span></div>`).join("");

  renderFilters();
  renderBaseForm();
  $("#days").innerHTML = days.map((d) => `<section class="day">
    <header>
      <span class="wd">${esc(weekday(d.date))}</span>
      <h2>${esc(dayLabel(d.date))}</h2>
      ${d.stops.length ? `<span class="n">${esc(L.stops(d.stops.length))}</span>` : ""}
    </header>
    ${d.stops.length
      ? `<ol class="stops">${d.stops.map((p, i) => stopHTML(p, i, d.stops)).join("")}</ol>`
      : `<p class="dayempty">${esc(L.dayEmpty)}</p>`}
    ${dayRouteHTML(d.stops)}
  </section>`).join("");

  // Nothing planned yet? Then adding is the only thing to do here.
  if (!list.length && !openedOnce) { $("#addplan").hidden = false; openedOnce = true; }

  const hidden = list.length - shown.length;
  $("#hiddenby").hidden = !hidden;
  $("#hiddenby").textContent = hidden ? L.filteredOut(hidden) : "";

  renderAdder();
}

/* ----------------------------------------------------------- detail sheet */

/** Everything known about one stop, gathered from wherever it actually lives. */
function detailsOf(p) {
  const own = p.source === "own";
  const note = own ? NOTES.find((n) => n.id === p.id) : null;
  const sight = own ? null : byId(p.id);
  const booking = STATUS.find((b) => b.id === p.id) ?? null;

  return {
    id: p.id, source: p.source, own, note, sight, booking,
    place: placeOf(p),
    name: own ? (note?.label ?? p.label) : title(sight),
    day: p.day, start: p.start, end: p.end,
    voters: own ? [] : (VOTES[p.id] ?? []),
    url: sight?.url ?? null,
    bookingUrl: booking?.bookingUrl ?? sight?.bookingUrl ?? null,
    address: own ? note?.address : (sight?.custom ? sight.address : sight?.area),
  };
}

function sheetHTML(x) {
  const L = t();
  const dayOpts = TRIP.days.map((d) =>
    `<option value="${esc(d)}"${x.day === d ? " selected" : ""}>${esc(weekdayShort(d))} ${esc(dayLabel(d))}</option>`).join("");
  const kindLabel = { booked: L.srcBooked, hand: L.srcHand, own: L.srcOwn }[x.source];
  const route = hasPlace(x.place) ? routeLinks([x.place], "transit", originNow()) : null;

  return `
  <div class="srow">
    <span class="slabel">${esc(L.shKind)}</span>
    <span class="sval"><span class="src ${x.source}">${esc(kindLabel)}</span></span>
    <span class="sval muted">${esc(
      x.source === "booked" ? L.shBookedNote : x.own ? L.shOwnNote : L.shSightNote)}</span>
  </div>

  <div class="srow">
    <span class="slabel">${esc(L.shWhen)}</span>
    <div class="sfields">
      ${x.own ? `<label class="wide">${esc(L.shName)}<input type="text" data-f="label" value="${esc(x.name)}"></label>` : ""}
      <label>${esc(L.shDay)}<select data-f="day">${dayOpts}</select></label>
      <label data-half>${esc(L.shFrom)}<input type="time" data-f="start" value="${esc(x.start ?? "")}"></label>
      <label data-half>${esc(L.shTo)}<input type="time" data-f="end" value="${esc(x.end ?? "")}"></label>
    </div>
  </div>

  <div class="srow">
    <span class="slabel">${esc(L.shWhere)}</span>
    <span class="sval${x.address ? "" : " muted"}">${esc(x.address || L.shNoPlace)}</span>
    ${addressControlHTML({ id: x.id, source: x.source })}
    ${route ? `<div class="slinks">
      <a href="${esc(route.google)}" target="_blank" rel="noopener">${esc(L.shMap)} \u2197</a>
    </div>` : ""}
  </div>

  ${x.own ? "" : `<div class="srow">
    <span class="slabel">${esc(L.shVotes)}</span>
    ${x.voters.length
      ? `<div class="svoters">${x.voters.map((v) => `<span class="svoter">${esc(v)}</span>`).join("")}</div>`
      : `<span class="sval muted">${esc(L.shNoVotes)}</span>`}
  </div>`}

  ${x.own ? "" : `<div class="srow">
    <span class="slabel">${esc(L.shBooking)}</span>
    ${x.booking
      ? `<span class="sval">${esc({ booked: L.stBooked, skipped: L.stSkipped }[x.booking.status] ?? L.stTodo)}${
          x.booking.by ? ` \u00b7 ${esc(L.shBookedBy)} ${esc(x.booking.by)}` : ""}${
          x.booking.reference ? ` \u00b7 ${esc(L.shRef)} ${esc(x.booking.reference)}` : ""}${
          x.booking.cost ? ` \u00b7 ${esc(x.booking.cost)}` : ""}</span>`
      : `<span class="sval muted">${esc(L.shNotBooked)}</span>`}
  </div>`}

  ${x.url || x.bookingUrl ? `<div class="srow">
    <span class="slabel">${esc(L.shLinks)}</span>
    <div class="slinks">
      ${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(L.shSite)} \u2197</a>` : ""}
      ${x.bookingUrl && x.bookingUrl !== x.url ? `<a href="${esc(x.bookingUrl)}" target="_blank" rel="noopener">${esc(L.shTickets)} \u2197</a>` : ""}
    </div>
  </div>` : ""}

  <div class="sfoot">
    <button class="save" type="button" data-sheet-save>${esc(L.shSave)}</button>
    <button class="danger" type="button" data-sheet-remove>${esc(L.shRemove)}</button>
  </div>`;
}

const stopFor = (ref) =>
  ref ? planned().find((x) => x.id === ref.id && x.source === ref.source) : null;

function renderSheet() {
  const box = $("#sheet");
  if (!box) return;
  const p = stopFor(sheetFor);
  // It may have moved or been removed by someone else since the sheet opened.
  if (!p) { sheetFor = null; box.hidden = true; return; }

  const x = detailsOf(p);
  $("#sheet-title").textContent = x.name;
  $("#sheet-body").innerHTML = sheetHTML(x);
  box.hidden = false;
}

function closeSheet() { sheetFor = null; const b = $("#sheet"); if (b) b.hidden = true; }

/** Save through whichever endpoint owns this kind of stop. */
function saveSheet() {
  const p = stopFor(sheetFor);
  if (!p) return closeSheet();
  const box = $("#sheet-body");
  const f = (k) => box.querySelector(`[data-f="${k}"]`)?.value || null;
  const day = f("day"), start = f("start"), end = f("end"), label = f("label");
  closeSheet();

  if (p.source === "own")
    return void mutate("/api/plan/note/update", { id: p.id, label, day, start, end });
  if (p.source === "booked")
    // The booking owns the slot, so editing the time here edits the booking.
    return void mutate("/api/bookings/status", { sightId: p.id, status: "booked",
      bookedDate: day, bookedTime: start, bookedEnd: end });
  return void mutate("/api/plan/set", { sightId: p.id, day, start, end });
}

function removeFromSheet() {
  const p = stopFor(sheetFor);
  if (!p) return closeSheet();
  closeSheet();
  if (p.source === "own") return void mutate("/api/plan/note/remove", { id: p.id });
  if (p.source === "booked")
    // Clearing the slot takes it off the plan; the booking itself stays.
    return void mutate("/api/bookings/status", { sightId: p.id, status: "booked",
      bookedDate: null, bookedTime: null, bookedEnd: null });
  return void mutate("/api/plan/remove", { sightId: p.id });
}

/* ------------------------------------------------------------- actions */

async function lookUp(id) {
  const L = t();
  const box = $(`[data-addrbox="${CSS.escape(id)}"]`);
  const hits = $("[data-addrhits]", box);
  const q = $("[data-addrq]", box).value;
  hits.innerHTML = `<span class="addrnote">${esc(L.loading)}</span>`;

  try {
    const d = await api("/api/geocode", {
      method: "POST",
      body: JSON.stringify({ voter: nameOf() || "?", q }),
    });
    hits.innerHTML = d.results.length
      ? `<span class="addrnote">${esc(L.addrPick)}</span>` + d.results.map((r) =>
          `<button type="button" data-hit-id="${esc(id)}" data-hit-lat="${r.lat}"
                   data-hit-lon="${r.lon}" data-hit-label="${esc(r.label)}">${
            r.from ? `<b>${esc(r.from)}</b>` : ""}${esc(r.label)}</button>`).join("")
      : `<span class="addrnote">${esc(L.addrNoHits)}</span>`;
  } catch (err) {
    hits.innerHTML = `<span class="addrnote">${esc(err.message)}</span>`;
  }
}

async function mutate(path, body) {
  if (!nameOf()) { setStatus(t().needName); $("#name").focus(); return; }
  setStatus(t().saving);
  try {
    const d = await api(path, { method: "POST", body: JSON.stringify({ ...body, voter: nameOf() }) });
    // Every one of these can change on any mutation — a booking places a
    // sight, an address changes a route. Missing one leaves the page showing
    // something the server no longer believes.
    CUSTOM = d.custom ?? CUSTOM;
    VOTES = d.votes ?? VOTES;
    STATUS = d.bookings ?? [];
    ENTRIES = d.plan ?? [];
    NOTES = d.notes ?? [];
    TRIP = d.trip ?? TRIP;
    fillMembers(d.members);
    render();
    renderSheet();
    setStatus(t().saved);
  } catch (err) { setStatus(err.message); }
}

$("#ap-add").addEventListener("click", () => {
  const sightId = $("#ap-what").value;
  if (!sightId) { $("#ap-what").focus(); return; }
  const from = $("#ap-from").value || null;
  const to = $("#ap-to").value || null;
  mutate("/api/plan/set", { sightId, day: $("#ap-day").value, start: from, end: to });
  $("#ap-what").value = ""; $("#ap-from").value = ""; $("#ap-to").value = "";
});

$("#own-add").addEventListener("click", () => {
  const label = $("#own-what").value.trim();
  if (!label) { $("#own-what").focus(); return; }
  mutate("/api/plan/note/add", {
    label,
    day: $("#own-day").value,
    start: $("#own-from").value || null,
    end: $("#own-to").value || null,
    // Only a picked result carries coordinates; typed-but-not-found text is
    // kept as the address so it isn't lost, and the sheet can resolve it later.
    address: pendingPlace ? pendingPlace.label : ($("#own-where").value.trim() || null),
    lat: pendingPlace ? pendingPlace.lat : null,
    lon: pendingPlace ? pendingPlace.lon : null,
  });
  $("#own-what").value = ""; $("#own-from").value = ""; $("#own-to").value = "";
  $("#own-where").value = ""; pendingPlace = null;
  $("[data-addrhits='__new__']").innerHTML = "";
});

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && sheetFor) { closeSheet(); return; }
  if (ev.key !== "Enter" || !ev.target.matches("[data-addrq]")) return;
  ev.preventDefault();
  lookUp(ev.target.closest("[data-addrbox]").dataset.addrbox);
});

$("#own-what").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") { ev.preventDefault(); $("#own-add").click(); }
});

$("#own-where").addEventListener("input", () => {
  if (!pendingPlace || $("#own-where").value === pendingPlace.label) return;
  pendingPlace = null;                     // the text no longer describes it
  renderAdder();
});

document.addEventListener("input", (ev) => {
  if (ev.target.id !== "vmin") return;
  const raw = ev.target.value.trim();
  const n = raw === "" ? 0 : Number(raw);
  if (!Number.isInteger(n) || n < 0 || n > 99) return;
  minVotes = n;
  const at = ev.target.selectionStart;
  render();
  const again = $("#vmin");
  if (again) { again.focus(); try { again.setSelectionRange(at, at); } catch {} }
});

document.addEventListener("click", (ev) => {
  // --- the detail sheet
  if (ev.target.closest("[data-sheet-save]")) return void saveSheet();
  if (ev.target.closest("[data-sheet-remove]")) return void removeFromSheet();
  // Clicking the backdrop itself, or the ×, closes it.
  if (ev.target.id === "sheet-close" || ev.target.id === "sheet") return void closeSheet();

  const row = ev.target.closest("li.stop");
  // Buttons, links and fields inside a row do their own job; only the row
  // itself opens the sheet, or the arrows and the address form stop working.
  if (row && !ev.target.closest("button, a, select, input, label, .addrform")) {
    sheetFor = { id: row.dataset.stop, source: row.dataset.src };
    renderSheet();
    $("#sheet-close")?.focus();
    return;
  }

  const st = ev.target.closest("[data-start]");
  if (st) {
    startFrom = st.dataset.start;
    localStorage.setItem("london-plan-start", startFrom);
    // Only "me" needs permission, and only the first time.
    if (startFrom === "me" && !myPos) {
      if (!navigator.geolocation) { setStatus(t().locDenied); return void render(); }
      setStatus(t().locAsking);
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          myPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
          setStatus("");
          render();
        },
        () => { setStatus(t().locDenied); render(); },
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 120000 },
      );
    }
    return void render();
  }

  if (ev.target.closest("#baseedit")) { editingBase = !editingBase; return void render(); }
  if (ev.target.closest("[data-basecancel]")) { editingBase = false; return void render(); }
  if (ev.target.closest("[data-baseclear]")) {
    editingBase = false;
    return void mutate("/api/trip/base", { name: null, lat: null, lon: null });
  }

  const toggle = ev.target.closest("#addtoggle");
  if (toggle) {
    const box = $("#addplan");
    box.hidden = !box.hidden;
    render();
    if (!box.hidden) $(addMode === "sight" ? "#ap-what" : "#own-what").focus();
    return;
  }

  const mode = ev.target.closest("[data-mode]");
  if (mode) { addMode = mode.dataset.mode; return void render(); }

  const v = ev.target.closest("[data-votes]");
  if (v) { minVotes = Number(v.dataset.votes); return void render(); }

  const sc = ev.target.closest("[data-source]");
  if (sc) { source = sc.dataset.source; return void render(); }

  const openAddr = ev.target.closest("[data-addr]");
  if (openAddr) {
    if (!nameOf()) { setStatus(t().needName); $("#name").focus(); return; }
    editingAddress = openAddr.dataset.addr;
    render();
    renderSheet();
    $(`[data-addrbox="${CSS.escape(editingAddress)}"] [data-addrq]`)?.focus();
    return;
  }

  if (ev.target.closest("[data-addrcancel]")) {
    editingAddress = null;
    render();
    return void renderSheet();
  }

  const clear = ev.target.closest("[data-addrclear]");
  if (clear) {
    editingAddress = null;
    return void mutate(addressPathFor(clear.dataset.addrclear),
      { id: clear.dataset.addrclear, address: null, lat: null, lon: null });
  }

  if (ev.target.id === "own-where-clear") {
    pendingPlace = null;
    $("#own-where").value = "";
    $("[data-addrhits='__new__']").innerHTML = "";
    return void renderAdder();
  }

  const find = ev.target.closest("[data-addrfind]");
  if (find) return void lookUp(find.dataset.addrfind);

  // Choosing a result saves it — one step, since picking it *is* the decision.
  const hit = ev.target.closest("[data-hit-lat]");
  if (hit && hit.dataset.hitId === "__base__") {
    editingBase = false;
    return void mutate("/api/trip/base", {
      name: hit.dataset.hitLabel,
      lat: Number(hit.dataset.hitLat),
      lon: Number(hit.dataset.hitLon),
    });
  }
  // Nothing exists to save it to yet, so hold it until "Add it" is pressed.
  if (hit && hit.dataset.hitId === "__new__") {
    pendingPlace = { label: hit.dataset.hitLabel,
                     lat: Number(hit.dataset.hitLat), lon: Number(hit.dataset.hitLon) };
    $("#own-where").value = pendingPlace.label;
    $("[data-addrhits='__new__']").innerHTML = "";
    renderAdder();
    return;
  }

  if (hit) {
    const id = hit.dataset.hitId;
    editingAddress = null;
    return void mutate(addressPathFor(id), {
      id,
      address: hit.dataset.hitLabel,
      lat: Number(hit.dataset.hitLat),
      lon: Number(hit.dataset.hitLon),
    });
  }

  const lb = ev.target.closest(".langs button");
  if (lb) {
    lang = lb.dataset.lang;
    localStorage.setItem(LANG_KEY, lang);
    for (const b of document.querySelectorAll(".langs button"))
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    render();
  }
});

$("#name").addEventListener("input", () => localStorage.setItem(NAME_KEY, nameOf()));
$("#name").value = localStorage.getItem(NAME_KEY) || "";
for (const b of document.querySelectorAll(".langs button"))
  b.setAttribute("aria-pressed", String(b.dataset.lang === lang));

(async () => {
  setStatus(t().loading);
  try {
    const d = await api("/api/sights");
    SIGHTS = d.sights; CUSTOM = d.custom; VOTES = d.votes;
    STATUS = d.bookings ?? []; ENTRIES = d.plan ?? []; NOTES = d.notes ?? [];
    TRIP = d.trip ?? { days: [] };
    fillMembers(d.members);
    render();
    setStatus("");
  } catch (err) { setStatus(err.message); }
})();
</script>
</body>
</html>
