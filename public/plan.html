<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>London - What we plan to see</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗓️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F3F4F0; --card:#FBFCF9; --card-2:#EDEFE9;
  --ink:#171D19; --ink-2:#4B554E; --ink-3:#78837A;
  --line:#D9DDD4; --line-2:#C4CABD;
  --maroon:#7B2230; --maroon-soft:#F0E2E3;
  --green:#1F4A3C; --green-soft:#E1EAE4;
  --brass:#8A6118; --brass-soft:#F2E9D6;
  --shadow:0 1px 2px rgba(23,29,25,.06), 0 10px 28px -20px rgba(23,29,25,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101410; --card:#171C18; --card-2:#1E241F;
    --ink:#E9ECE5; --ink-2:#A7B1A6; --ink-3:#7C867C;
    --line:#2A322B; --line-2:#3A443B;
    --maroon:#E0868F; --maroon-soft:#2E1A1E;
    --green:#7CBBA0; --green-soft:#152420;
    --brass:#D9AC59; --brass-soft:#241D0F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -22px rgba(0,0,0,.9);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
a{color:var(--maroon)}

/* ---- top nav ---- */
.topnav{position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.navinner{max-width:1180px;margin:0 auto;padding:9px 20px;min-height:56px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:17px;
  letter-spacing:-.01em;color:var(--ink);text-decoration:none;white-space:nowrap}
.navlinks{display:flex;gap:4px}
.navlinks a{font-size:14px;font-weight:500;color:var(--ink-3);text-decoration:none;
  padding:7px 14px;border-radius:9px;transition:color .15s,background .15s}
.navlinks a:hover{color:var(--ink);background:var(--card-2)}
.navlinks a[aria-current="page"]{color:var(--ink);background:var(--card-2);font-weight:600}
.navtools{display:flex;gap:9px;align-items:center;margin-left:auto}
.navtools input[type=text]{font:inherit;font-size:14px;padding:6px 11px;border-radius:9px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink);width:132px}
.navtools input[type=text]:focus{outline:2px solid var(--maroon);outline-offset:-1px;width:160px}
.navstatus{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.langs{display:flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;flex:none}
.langs button{padding:6px 10px;font-size:12px;font-weight:600;border:0;
  background:var(--card);color:var(--ink-3)}
.langs button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (max-width:700px){
  .navinner{padding:9px 16px;gap:10px}
  .navtools{margin-left:auto;flex-wrap:wrap}
  .navtools input[type=text]{width:112px}
  .navstatus{flex-basis:100%;max-width:none;text-align:right}
}


/* ---- filters ---- */
.filters{display:flex;gap:18px;flex-wrap:wrap;align-items:center;
  padding:14px 0 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fgroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fgroup .lbl{font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.fgroup button{font-size:13px;font-weight:500;padding:6px 12px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink-2)}
.fgroup button:hover{border-color:var(--ink-3);color:var(--ink)}
.fgroup button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fgroup button b{font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  font-weight:500;opacity:.55;margin-left:4px}
.fmanual{display:flex;gap:5px;align-items:center}
.fmanual .or{font-size:12px;color:var(--ink-3);margin:0 1px}
.fmanual input{font:inherit;font-size:13px;width:64px;padding:6px 8px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink)}
.fmanual input.on{border-color:var(--ink);background:var(--ink);color:var(--paper);font-weight:600}
.fmanual input::placeholder{color:var(--ink-3);font-size:11.5px}
.fmanual .plus{font-size:13px;color:var(--ink-3)}
.fmanual b{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:500;color:var(--ink-3)}
.hiddenby{font-size:12.5px;color:var(--ink-3);margin:14px 0 0}

/* ---- day columns ---- */
.days{display:grid;gap:18px;margin-top:26px}
@media(min-width:900px){.days{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1300px){.days{grid-template-columns:repeat(3,1fr)}}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.day > header{padding:14px 17px;border-bottom:1px solid var(--line);
  background:var(--card-2);display:flex;align-items:baseline;gap:9px}
.day h2{font-family:"Fraunces",Georgia,serif;font-size:18px;margin:0;font-weight:600}
.day .wd{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--maroon)}
.day .n{margin-left:auto;font-family:"IBM Plex Mono",monospace;
  font-size:11px;color:var(--ink-3)}
ol.stops{list-style:none;margin:0;padding:6px 0;flex:1;min-height:54px}
li.stop{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 17px;
  border-bottom:1px dashed var(--line)}
li.stop:last-child{border-bottom:0}
.when{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);
  white-space:nowrap;padding-top:1px;min-width:44px}
.when em{display:block;font-style:normal;color:var(--ink-3);font-size:11px}
.when.open{color:var(--ink-3)}
.sname{font-weight:600;font-size:14.5px;line-height:1.3}
.smeta{font-size:12px;color:var(--ink-3);margin-top:2px;
  display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.src{font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  border-radius:4px;padding:1px 5px;border:1px solid}
.src.booked{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.src.hand{color:var(--brass);border-color:var(--brass);background:var(--brass-soft)}
.stopact{display:flex;gap:5px;margin-top:6px}
.stopact button{font-size:11.5px;border:0;background:none;color:var(--ink-3);padding:3px 3px}
.stopact button:hover{color:var(--maroon)}
.dayempty{padding:20px 17px;color:var(--ink-3);font-size:13px}

/* ---- add to the plan ---- */
.addplan{margin-top:26px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.addplan > summary{padding:14px 18px;cursor:pointer;font-weight:600;font-size:15px}
.apbody{padding:14px 18px 18px;border-top:1px solid var(--line);
  display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.apbody label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2)}
.apbody select,.apbody input{font:inherit;font-size:13.5px;padding:7px 10px;
  border-radius:9px;border:1px solid var(--line-2);background:var(--card-2);color:var(--ink)}
.apbody select{min-width:230px;max-width:100%}
.apbody.own{border-top:1px solid var(--line);padding-top:16px}
.apbody #own-what{min-width:250px}
.apown{flex-basis:100%;margin:0 0 2px;font-weight:600;font-size:14px}
.src.own{color:var(--maroon);border-color:var(--maroon);background:var(--maroon-soft)}
.aphint{flex-basis:100%;font-size:12.5px;color:var(--ink-3);margin:2px 0 0}

header{padding:40px 0 22px}
.kicker{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--maroon);margin:0 0 14px}
h1{font-family:"Fraunces",Georgia,serif;font-weight:600;
  font-size:clamp(30px,5vw,44px);line-height:1.05;letter-spacing:-.02em;
  margin:0 0 12px;text-wrap:balance}
.lede{color:var(--ink-2);max-width:62ch;margin:0;font-size:16px}

/* ---- identity ---- */
.who{position:sticky;top:56px;z-index:30;margin:0 -20px;padding:12px 20px;
  background:color-mix(in srgb,var(--paper) 93%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.who label{font-size:13px;color:var(--ink-2);font-weight:500}
input[type=text]{font:inherit;font-size:15px;padding:8px 12px;border-radius:9px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink);min-width:150px}
.status{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);margin-left:auto}
button{font:inherit;cursor:pointer}

/* ---- stats ---- */
.stats{display:flex;gap:30px;flex-wrap:wrap;padding:22px 0 20px}
.stat b{display:block;font-family:"Fraunces",Georgia,serif;font-size:28px;line-height:1.1}
.stat span{font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ---- filters ---- */
.filters{display:flex;gap:18px;flex-wrap:wrap;align-items:center;
  padding:14px 0 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fgroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fgroup .lbl{font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.fgroup button{font-size:13px;font-weight:500;padding:6px 12px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink-2)}
.fgroup button:hover{border-color:var(--ink-3);color:var(--ink)}
.fgroup button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fgroup button b{font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  font-weight:500;opacity:.55;margin-left:4px}

/* ---- list ---- */
.list{display:grid;gap:12px;margin-top:24px}
@media(min-width:860px){.list{grid-template-columns:repeat(2,1fr)}}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.itop{display:flex;gap:10px;align-items:flex-start}
.iname{font-weight:600;font-size:16px;line-height:1.3;flex:1}
.price{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink);
  white-space:nowrap;font-weight:500}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  border-radius:5px;padding:2px 7px;border:1px solid}
.tag.paid{color:var(--maroon);border-color:var(--maroon);background:var(--maroon-soft)}
.tag.book{color:var(--brass);border-color:var(--brass);background:var(--brass-soft)}
.tag.added{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.blurb{font-size:13.5px;color:var(--ink-2);margin:0}
.voters{font-size:12.5px;color:var(--ink-3)}
.voters b{color:var(--ink-2);font-weight:600}
.iact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding-top:10px;margin-top:auto;border-top:1px dashed var(--line)}
.iact a{font-size:13px;font-weight:500;text-decoration:none;padding:6px 12px;
  border-radius:8px;border:1px solid var(--line-2);background:var(--card-2);color:var(--ink)}
.iact a:hover{border-color:var(--ink-3)}
.remove{font-size:12.5px;border:0;background:none;color:var(--ink-3);
  padding:6px 4px;margin-left:auto}
.remove:hover{color:var(--maroon)}

.empty{color:var(--ink-3);font-size:14.5px;padding:40px 0;text-align:center}

/* ---- slot form ---- */
.slot{padding-top:11px;margin-top:auto;border-top:1px dashed var(--line);
  display:grid;gap:9px}
.slotrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.slot label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.slot input{font:inherit;font-size:13px;padding:5px 9px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--card-2);color:var(--ink)}
.slotshown{font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  color:var(--green);border:1px solid var(--green);border-radius:6px;
  padding:1px 8px;white-space:nowrap}
.slotshown.none{color:var(--ink-3);border-color:var(--line-2)}
.done.editing{display:block}
.done.editing .n{display:block;margin-bottom:2px}

/* ---- booked ---- */
.section{margin-top:34px}
.section h2{font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:600;
  margin:0 0 4px;display:flex;align-items:baseline;gap:9px}
.section h2 span{font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.1em;color:var(--ink-3);font-weight:500}
.section .note{font-size:13px;color:var(--ink-3);margin:0 0 14px}
.donelist{display:grid;gap:8px}
.done{display:flex;gap:11px;align-items:center;flex-wrap:wrap;
  background:var(--green-soft);border:1px solid var(--line);
  border-radius:11px;padding:11px 15px}
.done .tick{color:var(--green);font-weight:700;flex:none}
.done .n{font-weight:600;font-size:15px;flex:1;min-width:150px}
.done .voters{font-size:12.5px;color:var(--ink-3)}
.btn.book{border-color:var(--green);color:var(--green)}
.btn.book:hover{background:var(--green);color:var(--paper);border-color:var(--green)}
details.gone{margin-top:26px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;overflow:hidden}
details.gone>summary{padding:13px 18px;cursor:pointer;font-weight:600;font-size:14.5px}
.gonebody{padding:6px 18px 14px;border-top:1px solid var(--line)}
.grow{display:flex;gap:10px;align-items:center;padding:9px 0;flex-wrap:wrap;
  border-bottom:1px dashed var(--line)}
.grow:last-child{border-bottom:0}
.grow .n{flex:1;min-width:160px;font-size:14.5px}
.btn{font-size:13px;font-weight:500;padding:6px 12px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--card-2);color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);
  font-size:13px;color:var(--ink-3)}
</style>
</head>
<body>

<nav class="topnav">
  <div class="navinner">
    <a class="brand" href="/">London&nbsp;2026</a>
    <div class="navlinks">
      <a href="/" id="nav-sights">Sights</a>
      <a href="/bookings" id="nav-bookings">Bookings</a>
      <a href="/plan" aria-current="page" id="nav-plan">Plan</a>
    </div>
    <div class="navtools">
      <label class="visually-hidden" for="name" id="name-label">Your name</label>
      <input id="name" type="text" maxlength="32" placeholder="Your name"
             autocomplete="given-name" spellcheck="false">
      <span class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="de" aria-pressed="false">DE</button>
      </span>
      <span class="navstatus" id="status">Loading…</span>
    </div>
  </div>
</nav>

<div class="wrap">
<header>
  <p class="kicker" id="kicker">London · 11–16 September 2026</p>
  <h1 id="headline">What we plan to see</h1>
  <p class="lede" id="lede"></p>
</header>

<div class="stats" id="stats"></div>
<div class="filters" id="filters"></div>
<div class="days" id="days"></div>
<p class="hiddenby" id="hiddenby" hidden></p>

<details class="addplan" id="addplan">
  <summary id="ap-title">Add something to the plan</summary>
  <div class="apbody">
    <label id="ap-what-l">What
      <select id="ap-what"></select></label>
    <label id="ap-day-l">Day
      <select id="ap-day"></select></label>
    <label id="ap-from-l">From
      <input id="ap-from" type="time"></label>
    <label id="ap-to-l">To
      <input id="ap-to" type="time"></label>
    <button class="btn" id="ap-add" type="button">Add</button>
    <p class="aphint" id="ap-hint"></p>
  </div>

  <div class="apbody own">
    <p class="apown" id="own-title">Or add your own entry</p>
    <label id="own-what-l">What
      <input id="own-what" type="text" maxlength="80" placeholder=""></label>
    <label id="own-day-l">Day
      <select id="own-day"></select></label>
    <label id="own-from-l">From
      <input id="own-from" type="time"></label>
    <label id="own-to-l">To
      <input id="own-to" type="time"></label>
    <button class="btn" id="own-add" type="button">Add it</button>
    <p class="aphint" id="own-hint"></p>
  </div>
</details>

<footer><span id="foot"></span></footer>
</div>

<script type="module">
const $ = (s, r = document) => r.querySelector(s);
const NAME_KEY = "london-vote-name";

const LANG_KEY = "london-vote-lang";

  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const T = {

    apTitle: "Add something to the plan",
    apWhat: "What", apDay: "Day", apFrom: "From", apTo: "To", apAdd: "Add",
    apHint: "Only the day is required. Anything already booked with a date is placed by its booking — change the slot on the Bookings page instead.",
    apNone: "Everything is already on the plan.",
    apPick: "Pick a sight…",
    ownTitle: "Or add your own entry",
    ownWhat: "What", ownPh: "Musical · Dinner with Anna · Train home",
    ownAdd: "Add it",

    nameLabel: "Dein Name",
    navSights: "Sehenswürdigkeiten", navBookings: "Buchungen", navPlan: "Plan",
    loading: "Lädt…", saving: "Speichert…", saved: "Gespeichert",
    needName: "Bitte zuerst den Namen eintragen.",
    fVotes: "Stimmen", fAll: "Alle", fPlus: "+", fSource: "Quelle",
    fOr: "oder", fCustom: "beliebig",
    fCustomTitle: "Schwelle eintippen – 3 heißt drei Stimmen oder mehr",
    fBooked: "Buchungen", fHand: "Eingetragen",
    filteredOut: (n) => `${n} durch Filter ausgeblendet`,
    statPlanned: "im Plan", statBooked: "aus Buchungen", statHand: "selbst eingetragen", statDays: "Tage verplant",
    srcBooked: "gebucht", srcHand: "eingetragen",
    dayEmpty: "Noch nichts geplant.",
    stops: (n) => `${n} ${n === 1 ? "Stopp" : "Stopps"}`,
    noTime: "egal wann",
    move: "Verschieben", remove: "Entfernen",
    apTitle: "Etwas in den Plan eintragen",
    apWhat: "Was", apDay: "Tag", apFrom: "Von", apTo: "Bis", apAdd: "Eintragen",
    apHint: "Nur der Tag ist nötig. Was mit Datum gebucht ist, wird durch die Buchung eingeplant – ändere den Termin dann auf der Buchungsseite.",
    apNone: "Alles ist schon im Plan.",
    apPick: "Ort wählen…",
    ownTitle: "Oder einen eigenen Eintrag",
    ownWhat: "Was", ownPh: "Musical · Abendessen mit Anna · Zug zurück",
    ownAdd: "Eintragen",
    ownHint: "Alles, was keine Sehenswürdigkeit ist. Nur Name und Tag sind nötig.",
    srcOwn: "eigener", fOwn: "Eigene",
    votesShort: (n) => `${n} ♥`,
    bookedBy: "gebucht von", addedBy: "eingetragen von",
    foot: "Keine Routen und keine Fahrtzeiten – nur was wann passiert. Die Zeiten sind die, die du einträgst.",
  },
};
let lang = localStorage.getItem(LANG_KEY) || (navigator.language?.startsWith("de") ? "de" : "en");
const t = () => T[lang];

let SIGHTS = [], CUSTOM = [], VOTES = {}, STATUS = [], ENTRIES = [], NOTES = [], TRIP = { days: [] };
let minVotes = 0;
let source = "all";       // all | booked | hand

const nameOf = () => $("#name").value.trim();
const setStatus = (m) => { $("#status").textContent = m; };
const title = (s) => (lang === "de" && s.name_de) || s.name;
const all = () => [...SIGHTS, ...CUSTOM];
const byId = (id) => all().find((s) => s.id === id);

async function api(path, options) {
  const res = await fetch(path, { ...options, headers: {
    "content-type": "application/json",
    ...(localStorage.getItem(CODE_KEY) ? { "x-access-code": localStorage.getItem(CODE_KEY) } : {}),
  }});
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    const entered = window.prompt("Access code / Zugangscode:");
    if (entered) { localStorage.setItem(CODE_KEY, entered); return api(path, options); }
  }
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

/* -------------------------------------------------------------- the plan */

/**
 * The plan is two sources merged. A booking with a date places itself; the
 * server refuses a hand-made entry for one, so nothing can appear twice.
 */
function planned() {
  const fromBookings = STATUS
    .filter((b) => b.status === "booked" && b.date)
    .map((b) => ({ id: b.id, day: b.date, start: b.time, end: b.endTime,
                   who: b.by, source: "booked" }));

  const byHand = ENTRIES.map((e) => ({ id: e.id, day: e.day, start: e.start,
                                       end: e.end, who: e.addedBy, source: "hand" }));

  // Your own entries are not sights at all, so they carry their own label.
  const own = NOTES.map((n) => ({ id: n.id, day: n.day, start: n.start, end: n.end,
                                  who: n.addedBy, source: "own", label: n.label }));

  return [...fromBookings, ...byHand].filter((p) => byId(p.id)).concat(own);
}

// Untimed entries sort to the end of their day — you know the day, not the hour.
const byClock = (a, b) => (a.start ?? "99:99").localeCompare(b.start ?? "99:99");

const dayLabel = (iso) =>
  new Date(iso + "T12:00:00Z").toLocaleDateString(lang === "de" ? "de-DE" : "en-GB",
    { day: "numeric", month: "long", timeZone: "UTC" });
const weekday = (iso) =>
  new Date(iso + "T12:00:00Z").toLocaleDateString(lang === "de" ? "de-DE" : "en-GB",
    { weekday: "long", timeZone: "UTC" });

function stopHTML(p) {
  const L = t();
  const own = p.source === "own";
  const s = own ? null : byId(p.id);
  const votes = own ? 0 : (VOTES[p.id] ?? []).length;
  const label = own ? p.label : title(s);
  const srcLabel = { booked: L.srcBooked, hand: L.srcHand, own: L.srcOwn }[p.source];

  return `<li class="stop">
    <div class="when${p.start ? "" : " open"}">
      ${p.start ? esc(p.start) : esc(L.noTime)}
      ${p.end ? `<em>${esc(p.end)}</em>` : ""}
    </div>
    <div>
      <div class="sname">${esc(label)}</div>
      <div class="smeta">
        <span class="src ${p.source}">${esc(srcLabel)}</span>
        ${votes ? `<span>${esc(L.votesShort(votes))}</span>` : ""}
        <span>${esc(p.source === "booked" ? L.bookedBy : L.addedBy)} ${esc(p.who)}</span>
      </div>
      ${p.source === "hand" ? `<div class="stopact">
        <button type="button" data-remove="${esc(p.id)}">${esc(L.remove)}</button>
      </div>` : ""}
      ${own ? `<div class="stopact">
        <button type="button" data-note-rm="${esc(p.id)}">${esc(L.remove)}</button>
      </div>` : ""}
    </div>
  </li>`;
}

const votesOf = (id) => (VOTES[id] ?? []).length;

/** Filters narrow what the plan *shows*; nothing is removed by using them. */
const passes = (p) =>
  // Your own entries have no votes to threshold, so a vote filter must not
  // quietly hide the musical you already paid for.
  (p.source === "own" || votesOf(p.id) >= minVotes) &&
  (source === "all" || source === p.source);

function renderFilters() {
  const L = t();
  const list = planned();
  const top = list.reduce((a, p) => Math.max(a, votesOf(p.id)), 0);
  const steps = Array.from({ length: Math.min(top, 6) + 1 }, (_, n) => n);
  const countAt = (n) => list.filter((p) => (p.source === "own" || votesOf(p.id) >= n) &&
    (source === "all" || source === p.source)).length;

  const votesBtns = steps.map((n) =>
    `<button type="button" data-votes="${n}" aria-pressed="${minVotes === n}">${
      n === 0 ? esc(L.fAll) : n + esc(L.fPlus)} <b>${countAt(n)}</b></button>`).join("");

  const typed = !steps.includes(minVotes);
  const manual =
    `<span class="fmanual"><span class="or">${esc(L.fOr)}</span>` +
    `<input type="number" id="vmin" min="0" max="99" step="1"` +
    ` title="${esc(L.fCustomTitle)}" aria-label="${esc(L.fCustomTitle)}"` +
    ` placeholder="${esc(L.fCustom)}" value="${typed ? minVotes : ""}"` +
    `${typed ? ' class="on"' : ""}>` +
    `<span class="plus">${esc(L.fPlus)}</span>` +
    `${typed ? `<b>${countAt(minVotes)}</b>` : ""}</span>`;

  const sources = [
    ["all", L.fAll, list.length],
    ["booked", L.fBooked, list.filter((p) => p.source === "booked").length],
    ["hand", L.fHand, list.filter((p) => p.source === "hand").length],
    ["own", L.fOwn, list.filter((p) => p.source === "own").length],
  ].map(([k, label, n]) =>
    `<button type="button" data-source="${k}" aria-pressed="${source === k}">${esc(label)} <b>${n}</b></button>`).join("");

  $("#filters").innerHTML =
    `<div class="fgroup"><span class="lbl">${esc(L.fVotes)}</span>${votesBtns}${manual}</div>` +
    `<div class="fgroup"><span class="lbl">${esc(L.fSource)}</span>${sources}</div>`;
}

function renderAdder() {
  const L = t();
  const placed = new Set(planned().map((p) => p.id));

  const options = all()
    .filter((s) => !placed.has(s.id))
    .sort((a, b) => (VOTES[b.id] ?? []).length - (VOTES[a.id] ?? []).length ||
                    title(a).localeCompare(title(b)));

  $("#ap-title").textContent = L.apTitle;
  $("#ap-what-l").firstChild.textContent = L.apWhat + " ";
  $("#ap-day-l").firstChild.textContent = L.apDay + " ";
  $("#ap-from-l").firstChild.textContent = L.apFrom + " ";
  $("#ap-to-l").firstChild.textContent = L.apTo + " ";
  $("#ap-add").textContent = L.apAdd;
  $("#ap-hint").textContent = options.length ? L.apHint : L.apNone;
  $("#own-title").textContent = L.ownTitle;
  $("#own-what-l").firstChild.textContent = L.ownWhat + " ";
  $("#own-day-l").firstChild.textContent = L.apDay + " ";
  $("#own-from-l").firstChild.textContent = L.apFrom + " ";
  $("#own-to-l").firstChild.textContent = L.apTo + " ";
  $("#own-what").placeholder = L.ownPh;
  $("#own-add").textContent = L.ownAdd;
  $("#own-hint").textContent = L.ownHint;
  $("#ap-add").disabled = !options.length;

  const keepWhat = $("#ap-what").value;
  $("#ap-what").innerHTML = `<option value="">${esc(L.apPick)}</option>` +
    options.map((s) => {
      const v = (VOTES[s.id] ?? []).length;
      return `<option value="${esc(s.id)}">${esc(title(s))}${v ? ` — ${v} ♥` : ""}</option>`;
    }).join("");
  if (options.some((s) => s.id === keepWhat)) $("#ap-what").value = keepWhat;

  const dayOptions = TRIP.days
    .map((d) => `<option value="${esc(d)}">${esc(weekday(d))} ${esc(dayLabel(d))}</option>`).join("");

  for (const id of ["#ap-day", "#own-day"]) {
    const sel = $(id);
    const keep = sel.value;
    sel.innerHTML = dayOptions;
    if (TRIP.days.includes(keep)) sel.value = keep;
  }
}

function render() {
  const L = t();
  document.documentElement.lang = lang;
  for (const [id, key] of [["kicker","kicker"],["headline","headline"],["lede","lede"],
    ["foot","foot"],["name-label","nameLabel"],["nav-sights","navSights"],
    ["nav-bookings","navBookings"],["nav-plan","navPlan"]])
    $("#" + id).textContent = L[key];
  $("#name").placeholder = L.nameLabel;

  const list = planned();
  const shown = list.filter(passes);
  const days = TRIP.days.map((d) => ({
    date: d,
    stops: shown.filter((p) => p.day === d).sort(byClock),
  }));

  $("#stats").innerHTML = [
    [list.length, L.statPlanned],
    [list.filter((p) => p.source === "booked").length, L.statBooked],
    [list.filter((p) => p.source !== "booked").length, L.statHand],
    [days.filter((d) => d.stops.length).length, L.statDays],
  ].map(([v, k]) => `<div class="stat"><b>${v}</b><span>${esc(k)}</span></div>`).join("");

  renderFilters();
  $("#days").innerHTML = days.map((d) => `<section class="day">
    <header>
      <span class="wd">${esc(weekday(d.date))}</span>
      <h2>${esc(dayLabel(d.date))}</h2>
      ${d.stops.length ? `<span class="n">${esc(L.stops(d.stops.length))}</span>` : ""}
    </header>
    ${d.stops.length
      ? `<ol class="stops">${d.stops.map(stopHTML).join("")}</ol>`
      : `<p class="dayempty">${esc(L.dayEmpty)}</p>`}
  </section>`).join("");

  const hidden = list.length - shown.length;
  $("#hiddenby").hidden = !hidden;
  $("#hiddenby").textContent = hidden ? L.filteredOut(hidden) : "";

  renderAdder();
}

/* ------------------------------------------------------------- actions */

async function mutate(path, body) {
  if (!nameOf()) { setStatus(t().needName); $("#name").focus(); return; }
  setStatus(t().saving);
  try {
    const d = await api(path, { method: "POST", body: JSON.stringify({ ...body, voter: nameOf() }) });
    CUSTOM = d.custom; VOTES = d.votes; STATUS = d.bookings ?? []; ENTRIES = d.plan ?? [];
    render();
    setStatus(t().saved);
  } catch (err) { setStatus(err.message); }
}

$("#ap-add").addEventListener("click", () => {
  const sightId = $("#ap-what").value;
  if (!sightId) { $("#ap-what").focus(); return; }
  const from = $("#ap-from").value || null;
  const to = $("#ap-to").value || null;
  mutate("/api/plan/set", { sightId, day: $("#ap-day").value, start: from, end: to });
  $("#ap-what").value = ""; $("#ap-from").value = ""; $("#ap-to").value = "";
});

$("#own-add").addEventListener("click", () => {
  const label = $("#own-what").value.trim();
  if (!label) { $("#own-what").focus(); return; }
  mutate("/api/plan/note/add", {
    label,
    day: $("#own-day").value,
    start: $("#own-from").value || null,
    end: $("#own-to").value || null,
  });
  $("#own-what").value = ""; $("#own-from").value = ""; $("#own-to").value = "";
});

$("#own-what").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") { ev.preventDefault(); $("#own-add").click(); }
});

document.addEventListener("input", (ev) => {
  if (ev.target.id !== "vmin") return;
  const raw = ev.target.value.trim();
  const n = raw === "" ? 0 : Number(raw);
  if (!Number.isInteger(n) || n < 0 || n > 99) return;
  minVotes = n;
  const at = ev.target.selectionStart;
  render();
  const again = $("#vmin");
  if (again) { again.focus(); try { again.setSelectionRange(at, at); } catch {} }
});

document.addEventListener("click", (ev) => {
  const v = ev.target.closest("[data-votes]");
  if (v) { minVotes = Number(v.dataset.votes); return void render(); }

  const sc = ev.target.closest("[data-source]");
  if (sc) { source = sc.dataset.source; return void render(); }

  const rm = ev.target.closest("[data-remove]");
  if (rm) return void mutate("/api/plan/remove", { sightId: rm.dataset.remove });

  const nrm = ev.target.closest("[data-note-rm]");
  if (nrm) return void mutate("/api/plan/note/remove", { id: nrm.dataset.noteRm });

  const lb = ev.target.closest(".langs button");
  if (lb) {
    lang = lb.dataset.lang;
    localStorage.setItem(LANG_KEY, lang);
    for (const b of document.querySelectorAll(".langs button"))
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    render();
  }
});

$("#name").addEventListener("input", () => localStorage.setItem(NAME_KEY, nameOf()));
$("#name").value = localStorage.getItem(NAME_KEY) || "";
for (const b of document.querySelectorAll(".langs button"))
  b.setAttribute("aria-pressed", String(b.dataset.lang === lang));

(async () => {
  setStatus(t().loading);
  try {
    const d = await api("/api/sights");
    SIGHTS = d.sights; CUSTOM = d.custom; VOTES = d.votes;
    STATUS = d.bookings ?? []; ENTRIES = d.plan ?? []; NOTES = d.notes ?? [];
    TRIP = d.trip ?? { days: [] };
    render();
    setStatus("");
  } catch (err) { setStatus(err.message); }
})();
</script>
</body>
