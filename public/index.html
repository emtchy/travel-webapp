<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>London — vote for the sights</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F3F4F0; --card:#FBFCF9; --card-2:#EDEFE9;
  --ink:#171D19; --ink-2:#4B554E; --ink-3:#78837A;
  --line:#D9DDD4; --line-2:#C4CABD;
  --maroon:#7B2230; --maroon-soft:#F0E2E3;
  --green:#1F4A3C; --green-soft:#E1EAE4;
  --brass:#8A6118; --brass-soft:#F2E9D6;
  --on-accent:#FBFCF9;
  --shadow:0 1px 2px rgba(23,29,25,.06), 0 10px 28px -20px rgba(23,29,25,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101410; --card:#171C18; --card-2:#1E241F;
    --ink:#E9ECE5; --ink-2:#A7B1A6; --ink-3:#7C867C;
    --line:#2A322B; --line-2:#3A443B;
    --maroon:#E0868F; --maroon-soft:#2E1A1E;
    --green:#7CBBA0; --green-soft:#152420;
    --brass:#D9AC59; --brass-soft:#241D0F;
    --on-accent:#101410;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -22px rgba(0,0,0,.9);
  }
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}

/* ---------------- header ---------------- */
header{padding:44px 0 24px;border-bottom:1px solid var(--line)}
.kicker{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--maroon);margin:0 0 14px;
}
h1{
  font-family:"Fraunces",Georgia,serif;font-weight:600;
  font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.02em;
  margin:0 0 12px;text-wrap:balance;
}
.lede{color:var(--ink-2);max-width:60ch;margin:0;font-size:16px}

/* ---------------- add form: cost ---------------- */
.money{
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  padding:12px 14px;border:1px solid var(--line);border-radius:11px;
  background:var(--card-2);
}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{accent-color:var(--maroon);width:16px;height:16px;flex:none;cursor:pointer}
.money input[type=text]{
  font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;width:120px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink);
}
.money input[type=text]:disabled{opacity:.45}
.money .hint{flex-basis:100%}

/* ---------------- top nav ---------------- */
.topnav{position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.navinner{max-width:1180px;margin:0 auto;padding:9px 20px;min-height:56px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:17px;
  letter-spacing:-.01em;color:var(--ink);text-decoration:none;white-space:nowrap}
.navlinks{display:flex;gap:4px}
.navlinks a{font-size:14px;font-weight:500;color:var(--ink-3);text-decoration:none;
  padding:7px 14px;border-radius:9px;transition:color .15s,background .15s}
.navlinks a:hover{color:var(--ink);background:var(--card-2)}
.navlinks a[aria-current="page"]{color:var(--ink);background:var(--card-2);font-weight:600}
.navtools{display:flex;gap:9px;align-items:center;margin-left:auto}
.navtools input[type=text]{font:inherit;font-size:14px;padding:6px 11px;border-radius:9px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink);width:132px}
.navtools input[type=text]:focus{outline:2px solid var(--maroon);outline-offset:-1px;width:160px}
.navstatus{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.langs{display:flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;flex:none}
.langs button{padding:6px 10px;font-size:12px;font-weight:600;border:0;
  background:var(--card);color:var(--ink-3)}
.langs button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (max-width:700px){
  .navinner{padding:9px 16px;gap:10px}
  .navtools{margin-left:auto;flex-wrap:wrap}
  .navtools input[type=text]{width:112px}
  .navstatus{flex-basis:100%;max-width:none;text-align:right}
}

/* ---------------- filters ---------------- */
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0}
.bar .lbl{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-right:2px;
}
.bar button{
  font-size:13px;font-weight:500;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);
  padding:6px 12px;border-radius:8px;cursor:pointer;
}
.bar button:hover{border-color:var(--ink-3);color:var(--ink)}
.bar button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.bar button b{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
  font-weight:500;opacity:.55;margin-left:4px;
}

/* ---------------- stats ---------------- */
.stats{display:flex;gap:30px;flex-wrap:wrap;padding:22px 0 20px;
  border-bottom:1px solid var(--line)}
.stat b{display:block;font-family:"Fraunces",Georgia,serif;font-size:28px;line-height:1.1}
.stat span{font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ---------------- grid ---------------- */
.grid{
  display:grid;gap:18px;margin-top:26px;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
}
.sight{
  display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow);
}
.sight.hide{display:none}

.shot{
  position:relative;aspect-ratio:16/10;background:var(--card-2);overflow:hidden;
}
.shot img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s ease}
.shot img.in{opacity:1}
.shot .ph[hidden]{display:none}
.shot .ph{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:"Fraunces",Georgia,serif;font-size:38px;color:var(--line-2);
  background:linear-gradient(135deg,var(--card-2),var(--card));
}
.rank{
  position:absolute;top:10px;left:10px;z-index:2;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;font-weight:500;
  background:var(--paper);color:var(--maroon);border:1px solid var(--line-2);
  padding:2px 8px;border-radius:6px;
}
.cost{
  position:absolute;top:10px;right:10px;z-index:2;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.04em;
  padding:2px 7px;border-radius:5px;border:1px solid;
}
.cost.free{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.cost.paid{color:var(--brass);border-color:var(--brass);background:var(--brass-soft)}
.cost.limited{color:var(--maroon);border-color:var(--maroon);background:var(--maroon-soft)}

.body{padding:15px 16px 0;flex:1}
.sight h2{
  font-family:"Fraunces",Georgia,serif;font-size:18px;font-weight:600;
  margin:0 0 4px;line-height:1.24;letter-spacing:-.01em;
}
.where{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
  letter-spacing:.04em;color:var(--ink-3);margin:0 0 9px;
}
.sight p.desc{margin:0 0 10px;font-size:14.2px;color:var(--ink-2)}
.price{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  color:var(--ink-3);margin:0 0 12px;
}
.more{
  display:inline-block;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--maroon);text-decoration:none;border-bottom:1px solid currentColor;
  padding-bottom:1px;margin-bottom:14px;
}
.more:hover{opacity:.75}

.foot{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-top:1px solid var(--line);background:var(--card-2);
}
.want{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  font:inherit;font-size:14px;font-weight:500;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);
  padding:7px 13px;border-radius:3px;transition:background .12s ease,color .12s ease,border-color .12s ease;
}
.want:hover:not(:disabled){border-color:var(--maroon);color:var(--maroon)}
.want:disabled{opacity:.45;cursor:not-allowed}
.want[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:var(--on-accent)}
.want .heart{font-size:13px;line-height:1}
.want.busy{opacity:.5}

.tally{font-size:13px;color:var(--ink-3);min-width:0}
.tally b{
  font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--ink);
  font-size:13px;font-variant-numeric:tabular-nums;
}
.voters{
  display:block;font-size:12px;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}


/* ---------------- add form ---------------- */
/* The language toggle is styled once, up in the nav. A second rule used to sit
   here from before it moved, and being later it quietly won — which is why the
   EN/DE buttons on this page looked nothing like the other two. */

.addbox{
  margin:26px 0 0;background:var(--card);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);overflow:hidden;
}
.addbox > summary{
  cursor:pointer;padding:14px 18px;list-style:none;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--maroon);
}
.addbox > summary::-webkit-details-marker{display:none}
.addbox > summary::before{content:"+ ";font-weight:600}
.addbox[open] > summary::before{content:"− "}
.addform{padding:0 18px 18px;display:grid;gap:12px;max-width:620px}
.addform label{
  display:block;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;
}
.addform input,.addform textarea{
  width:100%;font:inherit;font-size:15px;padding:8px 11px;border-radius:3px;
  border:1px solid var(--line-2);background:var(--paper);color:var(--ink);
}
.addform textarea{resize:vertical;min-height:64px}
.addform .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.addform .hint{font-size:12.5px;color:var(--ink-3)}
.addform .submit{
  font:inherit;font-size:14px;font-weight:500;cursor:pointer;
  background:var(--maroon);border:1px solid var(--maroon);color:var(--on-accent);
  padding:8px 16px;border-radius:3px;
}
.addform .submit:disabled{opacity:.45;cursor:not-allowed}
.addform .err{font-size:13.5px;color:var(--maroon)}

.sight.is-custom{border-style:dashed}
.byline{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
  letter-spacing:.04em;color:var(--ink-3);margin:0 0 10px;
}
.remove{
  margin-left:auto;font:inherit;font-size:12.5px;cursor:pointer;
  background:none;border:0;color:var(--ink-3);text-decoration:underline;padding:4px;
}
.remove:hover{color:var(--maroon)}
.shot.blank{aspect-ratio:auto;height:8px;background:var(--maroon-soft)}
.shot.blank .ph,.shot.blank .rank{display:none}
.shot.blank .cost{display:none}
.custom-head{display:flex;gap:8px;align-items:baseline}
.custom-head .badge{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--maroon);border:1px solid var(--maroon);
  background:var(--maroon-soft);padding:2px 6px;border-radius:2px;white-space:nowrap;
}


/* ---------------- sticky top bar ---------------- */
#topbar{
  position:sticky;top:56px;z-index:35;margin:0 -20px;
  background:color-mix(in srgb,var(--paper) 94%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
#topbar .bar{position:static;margin:0;backdrop-filter:none;background:none;
  padding:13px 20px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
#topbar .bar::-webkit-scrollbar{display:none}
#topbar .bar button{flex:0 0 auto}

/* ---------------- comments ---------------- */
.talk{
  font:inherit;font-size:13px;cursor:pointer;background:none;border:0;
  color:var(--ink-3);padding:6px 4px;display:inline-flex;align-items:center;gap:5px;
}
.talk:hover{color:var(--maroon)}
.talk[aria-expanded="true"]{color:var(--maroon);font-weight:500}
.talk .bubble{font-size:14px;line-height:1}
.talk .n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.thread{
  border-top:1px solid var(--line);padding:12px 16px 14px;
  background:var(--card);display:grid;gap:10px;
}
.thread[hidden]{display:none}
.cmt{font-size:14px;line-height:1.5}
.cmt .meta-line{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
  letter-spacing:.04em;color:var(--ink-3);margin-bottom:2px;
  display:flex;gap:8px;align-items:baseline;
}
.cmt .meta-line b{color:var(--maroon);font-weight:500}
.cmt .del{
  font:inherit;font-size:10.5px;background:none;border:0;padding:0;
  color:var(--ink-3);text-decoration:underline;cursor:pointer;margin-left:auto;
}
.cmt .del:hover{color:var(--maroon)}
.cmt p{margin:0;color:var(--ink-2);overflow-wrap:anywhere}
.thread .none{font-size:13.5px;color:var(--ink-3);margin:0}
.thread form{display:grid;gap:8px}
.thread textarea{
  width:100%;font:inherit;font-size:15px;padding:9px 11px;border-radius:3px;
  border:1px solid var(--line-2);background:var(--paper);color:var(--ink);
  resize:vertical;min-height:60px;
}
.thread .send{
  justify-self:start;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;
  background:var(--maroon);border:1px solid var(--maroon);color:var(--on-accent);
  padding:8px 15px;border-radius:3px;
}
.thread .send:disabled{opacity:.45;cursor:not-allowed}

/* ---------------- back to top ---------------- */
#totop{
  position:fixed;right:16px;bottom:16px;z-index:50;
  width:46px;height:46px;border-radius:50%;cursor:pointer;
  border:1px solid var(--line-2);background:var(--card);color:var(--maroon);
  font-size:19px;line-height:1;box-shadow:var(--shadow);
  display:grid;place-items:center;
  opacity:0;pointer-events:none;transform:translateY(8px);
  transition:opacity .2s ease,transform .2s ease;
}
#totop.show{opacity:1;pointer-events:auto;transform:none}
#totop:hover{border-color:var(--maroon)}

/* ---------------- misc ---------------- */
.notice{
  border:1px solid var(--maroon);border-left-width:4px;background:var(--maroon-soft);
  border-radius:3px;padding:14px 16px;margin:22px 0 0;font-size:14.5px;color:var(--ink-2);
}
.empty{padding:60px 0;text-align:center;color:var(--ink-3)}
footer{
  margin-top:48px;padding-top:18px;border-top:1px solid var(--line);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  color:var(--ink-3);letter-spacing:.04em;line-height:1.8;
}
footer a{color:var(--maroon)}

@media (max-width:640px){
  .wrap{padding:0 14px 90px}
  #topbar{margin:0 -14px}
  #topbar .who,#topbar .bar{padding-left:14px;padding-right:14px}
  .who input{flex:1 1 140px;min-width:0}
  header{padding:28px 0 18px}
  .grid{grid-template-columns:1fr;gap:14px}
  .shot{aspect-ratio:3/2}
  .foot{flex-wrap:wrap;gap:8px}
  .want{padding:10px 16px;font-size:15px}
  .talk{padding:8px 4px;font-size:14px}
  .tally{flex-basis:100%;order:3}
  .voters{white-space:normal}
  .remove{margin-left:0}
  #totop{right:12px;bottom:12px}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){
}
</style>
</head>
<body>

<nav class="topnav">
  <div class="navinner">
    <a class="brand" href="/">London&nbsp;2026</a>
    <div class="navlinks">
      <a href="/" aria-current="page" id="nav-sights">Sights</a>
      <a href="/bookings" id="nav-bookings">Bookings</a>
      <a href="/plan" id="nav-plan">Plan</a>
    </div>
    <div class="navtools">
      <label class="visually-hidden" for="name" id="name-label">Your name</label>
      <input id="name" type="text" maxlength="32" placeholder="Your name"
             autocomplete="given-name" spellcheck="false">
      <span class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="de" aria-pressed="false">DE</button>
      </span>
      <span class="navstatus" id="status">Loading…</span>
    </div>
  </div>
</nav>

<div class="wrap">

<header>
  <p class="kicker" id="kicker">London · 11–16 September 2026</p>
  <h1 id="headline">What do you actually want to see?</h1>
  <p class="lede" id="lede"></p>
</header>

<div class="stats" id="stats"></div>

<div id="topbar">
<div class="bar" id="filters">
  <span class="lbl" id="filter-label">Show</span>
  <button type="button" data-f="all" aria-pressed="true">All</button>
  <button type="button" data-f="free" aria-pressed="false">Free</button>
  <button type="button" data-f="paid" aria-pressed="false">Paid</button>
  <button type="button" data-f="added" aria-pressed="false">Added by us</button>
  <button type="button" data-f="mine" aria-pressed="false">My picks</button>
  <button type="button" data-f="top" aria-pressed="false">Most wanted</button>
</div>
</div>

<details class="addbox" id="addbox">
  <summary id="add-summary">Add a sight</summary>
  <form class="addform" id="addform">
    <div>
      <label for="add-name">Name</label>
      <input id="add-name" type="text" maxlength="80" required placeholder="Sky Pod Bar">
    </div>
    <div>
      <label for="add-url">Link <span class="hint" id="add-url-opt">(optional)</span></label>
      <input id="add-url" type="text" maxlength="500" placeholder="https://…">
    </div>
    <div>
      <label for="add-desc">Short description <span class="hint" id="add-desc-opt">(optional)</span></label>
      <textarea id="add-desc" maxlength="300" placeholder="Why should we go?"></textarea>
    </div>
    <div class="money">
      <label class="check">
        <input type="checkbox" id="add-costs">
        <span id="add-costs-label">It costs something</span>
      </label>
      <input id="add-price" type="text" maxlength="40" placeholder="£25 pp" disabled>
      <label class="check">
        <input type="checkbox" id="add-booking">
        <span id="add-booking-label">Needs booking ahead</span>
      </label>
      <span class="hint" id="add-money-hint">Either one puts it on the Bookings page.</span>
    </div>
    <div class="row">
      <button class="submit" type="submit" id="add-submit">Add it</button>
      <span class="hint" id="add-hint">You'll be counted as the first vote.</span>
    </div>
    <p class="err" id="add-err" hidden></p>
  </form>
</details>

<div id="notice" class="notice" hidden></div>
<div class="grid" id="grid"></div>
<p class="empty" id="empty" hidden></p>

<footer>
  <span id="foot-note"></span><br>
  <span id="foot-guide"></span> <a id="guide" href="https://claude.ai/code/artifact/a00d53b2-95bc-49fe-8a08-f070bc9729f4" target="_blank" rel="noopener">the ranked list, food and day plan</a>
</footer>

</div>

<button id="totop" type="button" aria-label="Back to top" title="Back to top">↑</button>

<script type="module">
const $  = (s, r = document) => r.querySelector(s);
const NAME_KEY = "london-vote-name";
const CODE_KEY = "london-vote-code";
const LANG_KEY = "london-vote-lang";
const IMG_KEY  = "london-vote-images-v2";
const openThreads = new Set();   // which cards have their comments expanded

let SIGHTS = [];
let CUSTOM = [];
let COMMENTS = {};
let VOTES  = {};
let filter = "all";
let me     = "";
let lang   = "en";

const norm = (s) => s.trim().toLowerCase().replace(/\s+/g, " ");
const esc  = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>

/* -------------------------------------------------------------------- api */

let accessCode = "";
try { accessCode = localStorage.getItem(CODE_KEY) || ""; } catch {}

async function api(path, options, retried = false) {
  const res = await fetch(path, {
    ...options,
    headers: {
      "content-type": "application/json",
      ...(accessCode ? { "x-access-code": accessCode } : {}),
      ...(options?.headers || {}),
    },
  });
  const data = await res.json().catch(() => ({}));

  if (res.status === 401 && !retried) {
    const entered = window.prompt("Access code / Zugangscode:");
    if (entered) {
      accessCode = entered.trim();
      try { localStorage.setItem(CODE_KEY, accessCode); } catch {}
      return api(path, options, true);
    }
  }
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

const all = () => [...SIGHTS, ...CUSTOM];

async function load() {
  const data = await api("/api/sights");
  SIGHTS = data.sights;
  CUSTOM = data.custom || [];
  VOTES  = data.votes || {};
  COMMENTS = data.comments || {};
  render();
  loadImages();
}

async function refresh() {
  try {
    const data = await api("/api/state");
    const before = CUSTOM.length;
    CUSTOM = data.custom || [];
    VOTES  = data.votes || {};
    COMMENTS = data.comments || {};
    if (CUSTOM.length !== before) render();
    else { paintTallies(); paintThreads(); applyFilter(); }
    setStatus();
  } catch { /* transient */ }
}

/* ---------------------------------------------------------------- images */
/* Two sources, in order of reliability:
     1. /img/manifest.json  — files served from this origin. Run `npm run images`
        to create it. No API, no CORS, no cache: this always works.
     2. Wikipedia at runtime — a fallback for when the manifest isn't there.
   Whatever happens, a missing photo just leaves the lettered placeholder. */

const imageState = { source: "none", found: 0, missing: [], error: null };

async function loadImages() {
  // ---- 1. local manifest
  try {
    const res = await fetch("/img/manifest.json", { cache: "no-cache" });
    if (res.ok) {
      const map = await res.json();
      if (map && Object.keys(map).length) {
        imageState.source = "local";
        imageState.found = Object.keys(map).length;
        imageState.missing = SIGHTS.filter((s) => !map[s.id]).map((s) => s.id);
        applyImages(map);
        return;
      }
    }
  } catch { /* no manifest — fall through */ }

  // ---- 2. Wikipedia
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(IMG_KEY) || "null"); } catch {}
  if (cached?.map && Object.keys(cached.map).length >= SIGHTS.length &&
      cached.at > Date.now() - 30 * 864e5) {
    imageState.source = "cache";
    imageState.found = Object.keys(cached.map).length;
    applyImages(cached.map);
    return;
  }

  const titles = [...new Set(SIGHTS.map((s) => s.wiki).filter(Boolean))];
  const map = {};

  for (let i = 0; i < titles.length; i += 45) {
    const batch = titles.slice(i, i + 45);
    const url =
      "https://en.wikipedia.org/w/api.php" +
      "?action=query&format=json&formatversion=2&origin=*" +
      "&prop=pageimages&piprop=thumbnail&pithumbsize=640" +
      `&pilimit=${batch.length}&redirects=1&titles=` +
      encodeURIComponent(batch.join("|"));
    try {
      const data = await (await fetch(url)).json();
      const byTitle = {};
      for (const page of data?.query?.pages || []) {
        if (page.thumbnail?.source) byTitle[page.title] = page.thumbnail.source;
      }
      for (const r of data?.query?.redirects  || []) if (byTitle[r.to]) byTitle[r.from] = byTitle[r.to];
      for (const n of data?.query?.normalized || []) if (byTitle[n.to]) byTitle[n.from] = byTitle[n.to];
      for (const s of SIGHTS) if (byTitle[s.wiki]) map[s.id] = byTitle[s.wiki];
    } catch (e) {
      imageState.error = String(e);
    }
  }

  applyImages(map);

  for (const s of SIGHTS.filter((x) => x.wiki && !map[x.id])) {
    try {
      const res = await fetch(
        "https://en.wikipedia.org/api/rest_v1/page/summary/" +
        encodeURIComponent(s.wiki.replace(/ /g, "_"))
      );
      if (!res.ok) continue;
      const d = await res.json();
      const src = d.thumbnail?.source || d.originalimage?.source;
      if (src) { map[s.id] = src; applyImages({ [s.id]: src }); }
    } catch (e) { imageState.error ||= String(e); }
  }

  imageState.source = "wikipedia";
  imageState.found = Object.keys(map).length;
  imageState.missing = SIGHTS.filter((s) => !map[s.id]).map((s) => s.id);
  try { localStorage.setItem(IMG_KEY, JSON.stringify({ at: Date.now(), map })); } catch {}
}

function applyImages(map) {
  for (const [id, src] of Object.entries(map || {})) {
    const shot = document.getElementById(`shot-${id}`);
    if (!shot || shot.dataset.loaded === "1") continue;
    const img = new Image();
    img.alt = "";
    img.decoding = "async";
    img.onload = () => {
      shot.dataset.loaded = "1";
      shot.appendChild(img);
      requestAnimationFrame(() => img.classList.add("in"));
      const ph = shot.querySelector(".ph");
      if (ph) ph.hidden = true;
    };
    img.onerror = () => { imageState.missing.push(id); };
    img.src = src;
  }
}

/* Type imageDebug() in the console to see what happened. */
window.imageDebug = () => {
  console.table({
    source: imageState.source,
    found: imageState.found,
    of: SIGHTS.length,
    error: imageState.error || "none",
  });
  if (imageState.missing.length) console.log("missing:", imageState.missing);
  console.log('Clear the cache with: localStorage.removeItem("' + IMG_KEY + '")');
  return imageState;
};

const COST_KEY = { free: "costFree", "free-limited": "costLimited", paid: "costPaid", mixed: "costMixed" };
const COST_CLASS = { free: "free", "free-limited": "limited", paid: "paid", mixed: "paid" };

function cardHTML(s) {
  const custom = !!s.custom;
  const shot = custom
    ? `<div class="shot blank" id="shot-${esc(s.id)}"></div>`
    : `<div class="shot" id="shot-${esc(s.id)}">
         <div class="ph" aria-hidden="true">${esc(title(s).charAt(0))}</div>
         <span class="rank">${s.rank}</span>
         <span class="cost ${COST_CLASS[s.cost]}">${esc(t()[COST_KEY[s.cost]])}</span>
       </div>`;

  const head = custom
    ? `<div class="custom-head"><h2>${esc(s.name)}</h2><span class="badge">${esc(t().added)}</span></div>
       <p class="byline">${esc(t().addedBy(s.addedBy))}</p>`
    : `<h2>${esc(title(s))}</h2>
       <p class="where">${esc(s.area)} · ${esc(s.station)}</p>`;

  const desc = custom
    ? (s.summary ? `<p class="desc">${esc(s.summary)}</p>` : "")
    : `<p class="desc">${esc(blurb(s))}</p>
       <p class="price">${esc(priceOf(s))}${s.bookingRequired ? esc(t().booking) : ""}</p>`;

  const link = s.url
    ? `<a class="more" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(t().readMore)}</a>`
    : "";

  return `
  <article class="sight${custom ? " is-custom" : ""}" id="card-${esc(s.id)}" data-cost="${esc(s.cost || "free")}">
    ${shot}
    <div class="body">${head}${desc}${link}</div>
    <div class="foot">
      <button class="want" type="button" data-id="${esc(s.id)}" aria-pressed="false" disabled>
        <span class="heart">♡</span><span class="txt">${esc(t().want)}</span>
      </button>
      <button class="talk" type="button" data-talk="${esc(s.id)}" aria-expanded="false"
              aria-controls="thread-${esc(s.id)}">
        <span class="bubble" aria-hidden="true">💬</span><span class="n">0</span>
      </button>
      <span class="tally" id="tally-${esc(s.id)}"></span>
      ${custom ? `<button class="remove" type="button" data-remove="${esc(s.id)}" hidden>${esc(t().remove)}</button>` : ""}
    </div>
    <div class="thread" id="thread-${esc(s.id)}" hidden></div>
  </article>`;
}

let wired = false;
function render() {
  $("#grid").innerHTML = all().map(cardHTML).join("");
  if (!wired) { $("#grid").addEventListener("click", onClick); wired = true; }
  paintTallies();
  paintThreads();
  applyFilter();
}

function paintTallies() {
  const key = norm(me);
  for (const s of all()) {
    const voters = VOTES[s.id] || [];
    const mine   = key && voters.some((v) => norm(v) === key);

    const tally = document.getElementById(`tally-${s.id}`);
    if (tally) {
      tally.innerHTML = voters.length
        ? `<b>${voters.length}</b> ${voters.length === 1 ? esc(t().vote) : esc(t().votes)}
           <span class="voters">${esc(voters.join(" · "))}</span>`
        : `<span class="voters">${esc(t().noVotes)}</span>`;
    }

    const btn = document.querySelector(`.want[data-id="${CSS.escape(s.id)}"]`);
    if (btn) {
      btn.setAttribute("aria-pressed", String(!!mine));
      btn.disabled = !me;
      btn.querySelector(".heart").textContent = mine ? "♥" : "♡";
      btn.querySelector(".txt").textContent   = mine ? t().wanted : t().want;
    }

    const rm = document.querySelector(`.remove[data-remove="${CSS.escape(s.id)}"]`);
    if (rm) rm.hidden = !(key && s.addedBy && norm(s.addedBy) === key);
  }
}

function ago(ms) {
  const L = t();
  const mins = Math.floor((Date.now() - ms) / 60000);
  if (mins < 1)   return L.justNow;
  if (mins < 60)  return L.minsAgo(mins);
  const hours = Math.floor(mins / 60);
  if (hours < 24) return L.hoursAgo(hours);
  return L.daysAgo(Math.floor(hours / 24));
}

function threadHTML(id) {
  const L = t();
  const list = COMMENTS[id] || [];
  const key = norm(me);

  const items = list.length
    ? list.map((c) => `
        <div class="cmt">
          <div class="meta-line">
            <b>${esc(c.author)}</b><span>${esc(ago(c.createdAt))}</span>
            ${key && norm(c.author) === key
              ? `<button class="del" type="button" data-delc="${esc(c.id)}">${esc(L.del)}</button>`
              : ""}
          </div>
          <p>${esc(c.body)}</p>
        </div>`).join("")
    : `<p class="none">${esc(L.noComments)}</p>`;

  return `${items}
    <form data-cform="${esc(id)}">
      <textarea maxlength="500" rows="2" placeholder="${esc(L.commentPlaceholder)}"
                aria-label="${esc(L.comments)}"></textarea>
      <button class="send" type="submit"${me ? "" : " disabled"}>${esc(L.send)}</button>
    </form>`;
}

/** Repaint counts, and the contents of any thread that's currently open. */
function paintThreads() {
  for (const s of all()) {
    const n = (COMMENTS[s.id] || []).length;
    const btn = document.querySelector(`.talk[data-talk="${CSS.escape(s.id)}"]`);
    if (btn) {
      btn.querySelector(".n").textContent = n;
      btn.title = `${n} ${n === 1 ? t().comment : t().commentsN}`;
    }
    const box = document.getElementById(`thread-${s.id}`);
    if (!box) continue;
    const open = openThreads.has(s.id);
    box.hidden = !open;
    btn?.setAttribute("aria-expanded", String(open));
    if (open && document.activeElement?.tagName !== "TEXTAREA") {
      box.innerHTML = threadHTML(s.id);
    }
  }
}

function applyFilter() {
  const key = norm(me);
  const grid = $("#grid");
  let shown = 0;

  const ordered = all().slice();
  if (filter === "top") {
    ordered.sort((a, b) =>
      (VOTES[b.id]?.length || 0) - (VOTES[a.id]?.length || 0) ||
      (a.rank ?? 999) - (b.rank ?? 999));
  } else {
    ordered.sort((a, b) => (a.rank ?? 999) - (b.rank ?? 999));
  }

  for (const s of ordered) {
    const card = document.getElementById(`card-${s.id}`);
    if (!card) continue;
    grid.appendChild(card);

    const show = matchesFilter(s, filter, key);

    card.classList.toggle("hide", !show);
    if (show) shown++;
  }

  $("#empty").textContent = t().empty;
  $("#empty").hidden = shown > 0;

  renderCounts();
}

/** Does a sight pass one of the filter buttons? Shared so the counts can't
 *  drift from what pressing the button actually shows. */
function matchesFilter(s, which, key) {
  const voters = VOTES[s.id] || [];
  switch (which) {
    case "all":   return true;
    case "free":  return !s.custom && s.cost !== "paid" && s.cost !== "mixed";
    case "paid":  return !s.custom && (s.cost === "paid" || s.cost === "mixed");
    case "added": return !!s.custom;
    case "mine":  return !!key && voters.some((v) => norm(v) === key);
    case "top":   return voters.length > 0;
    default:      return true;
  }
}

/** Counts on the buttons and the strip above them, the way the other pages do. */
function renderCounts() {
  const L = t();
  const key = norm(me);
  const list = all();
  const count = (which) => list.filter((s) => matchesFilter(s, which, key)).length;

  for (const btn of $("#filters").querySelectorAll("button[data-f]")) {
    const label = { all: L.all, free: L.free, paid: L.paid,
                    added: L.added, mine: L.mine, top: L.top }[btn.dataset.f];
    btn.innerHTML = `${esc(label)} <b>${count(btn.dataset.f)}</b>`;
  }

  const people = new Set(Object.values(VOTES).flat().map(norm));
  $("#stats").innerHTML = [
    [list.length, L.statSights],
    [count("top"), L.statVoted],
    [count("mine"), L.statMine],
    [people.size, L.statPeople],
  ].map(([v, k]) => `<div class="stat"><b>${v}</b><span>${esc(k)}</span></div>`).join("");
}

function setStatus() {
  const total = Object.values(VOTES).reduce((n, v) => n + v.length, 0);
  const people = new Set();
  for (const list of Object.values(VOTES)) list.forEach((v) => people.add(norm(v)));
  $("#status").innerHTML = me
    ? t().votingAs(esc(me), total, people.size)
    : t().enterName(total, people.size);
}

function notify(message) {
  const el = $("#notice");
  el.textContent = message || "";
  el.hidden = !message;
}

function setLang(next) {
  lang = next === "de" ? "de" : "en";
  try { localStorage.setItem(LANG_KEY, lang); } catch {}
  paintChrome();
  if (SIGHTS.length) render();
}

/* --------------------------------------------------------------- actions */

async function onClick(event) {
  const talk = event.target.closest(".talk");
  if (talk) {
    const id = talk.dataset.talk;
    if (openThreads.has(id)) openThreads.delete(id);
    else openThreads.add(id);
    const box = document.getElementById(`thread-${id}`);
    if (box) box.innerHTML = threadHTML(id);
    paintThreads();
    if (openThreads.has(id)) box?.querySelector("textarea")?.focus();
    return;
  }

  const delc = event.target.closest(".del");
  if (delc) return onDeleteComment(delc.dataset.delc);

  const rm = event.target.closest(".remove");
  if (rm) return onRemove(rm.dataset.remove);

  const btn = event.target.closest(".want");
  if (!btn || btn.disabled) return;
  if (!me) return $("#name").focus();

  const id     = btn.dataset.id;
  const wanted = btn.getAttribute("aria-pressed") !== "true";
  btn.classList.add("busy");
  btn.disabled = true;

  try {
    const data = await api("/api/vote", {
      method: "POST",
      body: JSON.stringify({ sightId: id, voter: me, wanted }),
    });
    VOTES = data.votes || {};
    CUSTOM = data.custom || CUSTOM;
    COMMENTS = data.comments || COMMENTS;
    notify("");
    paintTallies(); paintThreads(); applyFilter(); setStatus();
  } catch (err) {
    notify(t().voteFail(err.message));
  } finally {
    btn.classList.remove("busy");
    btn.disabled = !me;
  }
}

async function onRemove(id) {
  const entry = CUSTOM.find((c) => c.id === id);
  if (!entry) return;
  if (!window.confirm(t().removeConfirm(entry.name))) return;

  try {
    const data = await api("/api/sights/remove", {
      method: "POST",
      body: JSON.stringify({ id, voter: me }),
    });
    CUSTOM = data.custom || [];
    VOTES  = data.votes || {};
    COMMENTS = data.comments || {};
    render(); setStatus(); notify("");
  } catch (err) {
    notify(err.message);
  }
}

async function onDeleteComment(id) {
  if (!window.confirm(t().delConfirm)) return;
  try {
    const data = await api("/api/comments/remove", {
      method: "POST",
      body: JSON.stringify({ id, voter: me }),
    });
    COMMENTS = data.comments || {};
    VOTES = data.votes || {};
    paintThreads();
    notify("");
  } catch (err) {
    notify(err.message);
  }
}

/* Comment forms are created and destroyed constantly, so listen on the grid. */
$("#grid").addEventListener("submit", async (event) => {
  const form = event.target.closest("form[data-cform]");
  if (!form) return;
  event.preventDefault();

  const id = form.dataset.cform;
  const area = form.querySelector("textarea");
  const text = area.value.trim();

  if (!me) { notify(t().needNameComment); $("#name").focus(); return; }
  if (!text) return;

  const send = form.querySelector(".send");
  send.disabled = true;

  try {
    const data = await api("/api/comments/add", {
      method: "POST",
      body: JSON.stringify({ sightId: id, voter: me, body: text }),
    });
    COMMENTS = data.comments || {};
    VOTES = data.votes || {};
    area.value = "";
    area.blur();
    paintThreads();
    notify("");
  } catch (err) {
    notify(err.message);
  } finally {
    send.disabled = false;
  }
});

$("#add-costs").addEventListener("change", (ev) => {
  const price = $("#add-price");
  price.disabled = !ev.target.checked;
  if (!ev.target.checked) price.value = "";
  else price.focus();
});

$("#addform").addEventListener("submit", async (event) => {
  event.preventDefault();
  const err = $("#add-err");
  err.hidden = true;

  if (!me) {
    err.textContent = t().addNeedName;
    err.hidden = false;
    $("#name").focus();
    return;
  }

  const costs = $("#add-costs").checked;
  const payload = {
    voter: me,
    name: $("#add-name").value,
    url: $("#add-url").value,
    summary: $("#add-desc").value,
    costs,
    bookingRequired: $("#add-booking").checked,
    priceLabel: costs ? $("#add-price").value || null : null,
  };

  const submit = $("#add-submit");
  submit.disabled = true;

  try {
    const data = await api("/api/sights/add", {
      method: "POST",
      body: JSON.stringify(payload),
    });
    CUSTOM = data.custom || [];
    VOTES  = data.votes || {};
    COMMENTS = data.comments || {};
    $("#addform").reset();
    $("#add-price").disabled = true;
    $("#addbox").open = false;
    render(); setStatus(); notify("");
    document.getElementById(`card-${data.id}`)?.scrollIntoView({ behavior: "smooth", block: "center" });
  } catch (e) {
    err.textContent = e.message;
    err.hidden = false;
  } finally {
    submit.disabled = false;
  }
});

$("#name").addEventListener("input", (e) => {
  me = e.target.value.trim();
  try { localStorage.setItem(NAME_KEY, me); } catch {}
  paintTallies(); paintThreads(); applyFilter(); setStatus();
});

$("#filters").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  filter = btn.dataset.f;
  for (const b of $("#filters").querySelectorAll("button")) {
    b.setAttribute("aria-pressed", String(b === btn));
  }
  applyFilter();
});

$(".langs").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (btn) setLang(btn.dataset.lang);
});

/* ------------------------------------------------------------------ boot */

try { me = localStorage.getItem(NAME_KEY) || ""; } catch {}
try {
  lang = localStorage.getItem(LANG_KEY) ||
    ((navigator.language || "").startsWith("de") ? "de" : "en");
} catch {}
if (!["en", "de"].includes(lang)) lang = "en";
$("#name").value = me;
paintChrome();

load()
  .then(() => { paintChrome(); setStatus(); notify(""); })
  .catch((err) => {
    notify(t().loadFail(err.message));
    $("#status").textContent = "—";
  });

const toTop = $("#totop");
toTop.title = t().backToTop;
toTop.setAttribute("aria-label", t().backToTop);
toTop.addEventListener("click", () => {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
});
const onScroll = () => toTop.classList.toggle("show", window.scrollY > 500);
window.addEventListener("scroll", onScroll, { passive: true });
onScroll();

setInterval(refresh, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
