<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
<title>Sights</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230A66E0'/><path d='M50 18l9.6 23.3 25.2 2.1-19.2 16.5 5.9 24.6L50 71.5 28.5 84.5l5.9-24.6L15.2 43.4l25.2-2.1z' fill='white'/></svg>">
<link rel="stylesheet" href="/app.css">
<style>
/* ---------------- the grid of cards ---------------- */
.grid{display:grid;gap:16px;margin-top:22px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start}
.sight{display:flex;flex-direction:column}
.sight.hide{display:none}

.shot{position:relative;aspect-ratio:16/10;background:var(--surface-2);overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s ease}
.shot img.in{opacity:1}
.shot .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:700;
  color:var(--surface-3);background:linear-gradient(160deg,var(--surface-2),var(--surface-3))}
.shot .rank{position:absolute;top:10px;left:10px;z-index:2}
.shot .cost{position:absolute;top:10px;right:10px;z-index:2}
.shot.blank{aspect-ratio:auto;height:6px;background:linear-gradient(90deg,var(--violet),#9E85F2)}
.shot.blank .ph,.shot.blank .rank,.shot.blank .cost{display:none}

.body{padding:14px 16px 0;flex:1}
.sight h2{font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.01em;margin:0 0 2px}
.where{font-size:12.5px;color:var(--text-3);margin:0 0 8px}
.sight .desc{font-size:14px;color:var(--text-2);margin:0 0 10px;line-height:1.5}
.price{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--text-2);margin:0 0 12px;font-weight:500}
.more{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;margin-bottom:14px}
.more svg{width:12px;height:12px}
.custom-head{display:flex;gap:8px;align-items:center;margin-bottom:2px}
.custom-head h2{margin:0;flex:1;min-width:0}
.byline{font-size:12.5px;color:var(--text-3);margin:0 0 8px}

.foot{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-top:1px solid var(--hair);flex-wrap:wrap}
.want .h-on{display:none}
.want[aria-pressed="true"] .h-off{display:none}
.want[aria-pressed="true"] .h-on{display:block}
.talk{gap:5px;color:var(--text-2)}
.talk[aria-expanded="true"]{color:var(--tint);background:var(--tint-soft)}
.talk .n{font-size:13px;font-variant-numeric:tabular-nums}
.tally{font-size:12.5px;color:var(--text-3);min-width:0;flex:1;text-align:right;line-height:1.35}
.tally b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.voters{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.remove{margin-left:auto}
/* an added card has two more buttons in its foot, so the tally takes its own line */
.is-custom .tally{flex-basis:100%;order:3;text-align:left}

/* cost & booking on an added card */
.costedit{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--hair);background:var(--surface-2)}
.costedit .eprice{width:120px;height:32px;font-size:13.5px}

/* put a sight on a day */
.planrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px 10px 16px;border-top:1px solid var(--hair)}
.planrow .tag{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.planhint{font-size:12px;color:var(--text-3);flex-basis:100%;line-height:1.4}
.planedit{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--hair);background:var(--surface-2)}
.planedit .field{flex:1 1 120px}
.planedit .field.time{flex:0 1 110px}
.planedit .input,.planedit .select{height:34px;font-size:14px}

/* comments */
.thread{border-top:1px solid var(--hair);padding:12px 16px 14px;background:var(--surface-2);display:grid;gap:10px}
.cmt{font-size:14px;line-height:1.5}
.cmt .meta-line{font-size:12px;color:var(--text-3);display:flex;gap:8px;align-items:baseline;margin-bottom:1px}
.cmt .meta-line b{color:var(--text);font-weight:600}
.cmt .del{font-size:12px;background:none;border:0;padding:0;color:var(--text-3);margin-left:auto}
.cmt .del:hover{color:var(--red)}
.cmt p{margin:0;color:var(--text-2);overflow-wrap:anywhere}
.thread .none{font-size:13px;color:var(--text-3);margin:0}
.thread form{display:grid;gap:8px}
.thread .textarea{min-height:58px;font-size:14px}
.thread .send{justify-self:start}

/* the add form */
.addbox{margin-top:18px}
.addform{padding-top:12px;display:grid;gap:12px;max-width:640px}
.addform .money{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.addform .money .input{width:130px;height:34px;font-size:14px}
.addform .money .hint{flex-basis:100%}

@media (max-width:640px){
  .grid{grid-template-columns:1fr;gap:14px;margin-top:16px}
  .shot{aspect-ratio:3/2}
  .tally{flex-basis:100%;text-align:left;order:3}
  .voters{white-space:normal}
}
</style>

<div class="stat-row" id="stats"></div>

    <span class="lbl" id="filter-label">Show</span>
    <button class="chip" type="button" data-f="all" aria-pressed="true">All</button>
    <button class="chip" type="button" data-f="free" aria-pressed="false">Free</button>
    <button class="chip" type="button" data-f="paid" aria-pressed="false">Paid</button>
    <button class="chip" type="button" data-f="added" aria-pressed="false">Added by us</button>
    <button class="chip" type="button" data-f="mine" aria-pressed="false">My picks</button>
    <button class="chip" type="button" data-f="top" aria-pressed="false">Most wanted</button>
  </div>

<details class="disclosure addbox" id="addbox">
  <summary><span class="plus" aria-hidden="true"></span><span id="add-summary">Add a sight</span></summary>
  <form class="body addform" id="addform">
    <label class="field">
      <span id="l-add-name">Name</span>
      <input class="input" id="add-name" type="text" maxlength="80" required placeholder="">
    </label>
    <label class="field">
      <span id="l-add-url">Link</span>
      <input class="input" id="add-url" type="text" maxlength="500" placeholder="https://…">
    </label>
    <label class="field">
      <span id="l-add-desc">Short description</span>
      <textarea class="textarea" id="add-desc" maxlength="300" placeholder=""></textarea>
    </label>
    <div class="money inset">
      <label class="check">
        <input type="checkbox" id="add-costs">

      </label>
      <input class="input" id="add-price" type="text" maxlength="40" placeholder="" disabled>
      <label class="check">
        <input type="checkbox" id="add-booking">
        <span id="add-booking-label">Needs booking ahead</span>
      </label>
      <span class="hint note" id="add-money-hint"></span>
    </div>
    <div class="spread">
      <button class="btn btn-primary" type="submit" id="add-submit">Add it</button>
      <span class="note" id="add-hint"></span>
    </div>
    <p class="err" id="add-err" hidden></p>
  </form>
</details>

<div id="notice" class="banner banner-err" style="margin-top:18px" hidden></div>
<div class="grid" id="grid"></div>
<p class="empty" id="empty" hidden></p>

<footer class="page-foot"><span id="foot-note"></span></footer>

</main>

const t = () => T[getLang()];

/* Text for one entry in the active language, falling back to English. */
const title   = (s) => (getLang() === "de" && s.name_de)    || s.name;
const blurb   = (s) => (getLang() === "de" && s.summary_de) || s.summary || "";
const priceOf = (s) => (getLang() === "de" && s.priceLabel_de) || s.priceLabel || "";

/* -------------------------------------------------------------------- api */

const all = () => [...SIGHTS, ...CUSTOM];

async function load() {
  const data = await api("/api/sights");
  SIGHTS = data.sights;
  CUSTOM = data.custom || [];
  VOTES  = data.votes || {};
  COMMENTS = data.comments || {};
  PLAN = data.plan || [];
  BOOKED = data.bookings || [];
  TRIPDAYS = data.trip?.days || TRIPDAYS;
  TRIPINFO = data.trip || TRIPINFO;
  fillMembers(data.members);
  render();
  loadImages();
}

async function refresh() {
  try {
    const data = await api("/api/state");
    const before = CUSTOM.length;
    CUSTOM = data.custom || [];
    VOTES  = data.votes || {};
    COMMENTS = data.comments || {};
    PLAN = data.plan || [];
    BOOKED = data.bookings || [];
    TRIPDAYS = data.trip?.days || TRIPDAYS;
    TRIPINFO = data.trip || TRIPINFO;
    fillMembers(data.members);
    if (CUSTOM.length !== before) render();
    else { paintTallies(); paintThreads(); applyFilter(); }
    paintWhoLine();
    paintChrome();
  } catch { /* transient */ }
}

/* ---------------------------------------------------------------- images */
/* Two sources, in order of reliability:
     1. /img/manifest.json  — files served from this origin. Run `npm run images`
        to create it. No API, no CORS, no cache: this always works.
     2. Wikipedia at runtime — a fallback for when the manifest isn't there.
   Whatever happens, a missing photo just leaves the lettered placeholder. */

const imageState = { source: "none", found: 0, missing: [], error: null };

async function loadImages() {
  // ---- 1. local manifest
  try {
    const res = await fetch("/img/manifest.json", { cache: "no-cache" });
    if (res.ok) {
      const map = await res.json();
      if (map && Object.keys(map).length) {
        imageState.source = "local";
        imageState.found = Object.keys(map).length;
        imageState.missing = SIGHTS.filter((s) => !map[s.id]).map((s) => s.id);
        applyImages(map);
        return;
      }
    }
  } catch { /* no manifest — fall through */ }

  // ---- 2. Wikipedia
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(IMG_KEY) || "null"); } catch {}
  if (cached?.map && Object.keys(cached.map).length >= SIGHTS.length &&
      cached.at > Date.now() - 30 * 864e5) {
    imageState.source = "cache";
    imageState.found = Object.keys(cached.map).length;
    applyImages(cached.map);
    return;
  }

  const titles = [...new Set(SIGHTS.map((s) => s.wiki).filter(Boolean))];
  const map = {};

  for (let i = 0; i < titles.length; i += 45) {
    const batch = titles.slice(i, i + 45);
    const url =
      "https://en.wikipedia.org/w/api.php" +
      "?action=query&format=json&formatversion=2&origin=*" +
      "&prop=pageimages&piprop=thumbnail&pithumbsize=640" +
      `&pilimit=${batch.length}&redirects=1&titles=` +
      encodeURIComponent(batch.join("|"));
    try {
      const data = await (await fetch(url)).json();
      const byTitle = {};
      for (const page of data?.query?.pages || []) {
        if (page.thumbnail?.source) byTitle[page.title] = page.thumbnail.source;
      }
      for (const r of data?.query?.redirects  || []) if (byTitle[r.to]) byTitle[r.from] = byTitle[r.to];
      for (const n of data?.query?.normalized || []) if (byTitle[n.to]) byTitle[n.from] = byTitle[n.to];
      for (const s of SIGHTS) if (byTitle[s.wiki]) map[s.id] = byTitle[s.wiki];
    } catch (e) {
      imageState.error = String(e);
    }
  }

  applyImages(map);

  for (const s of SIGHTS.filter((x) => x.wiki && !map[x.id])) {
    try {
      const res = await fetch(
        "https://en.wikipedia.org/api/rest_v1/page/summary/" +
        encodeURIComponent(s.wiki.replace(/ /g, "_"))
      );
      if (!res.ok) continue;
      const d = await res.json();
      const src = d.thumbnail?.source || d.originalimage?.source;
      if (src) { map[s.id] = src; applyImages({ [s.id]: src }); }
    } catch (e) { imageState.error ||= String(e); }
  }

  imageState.source = "wikipedia";
  imageState.found = Object.keys(map).length;
  imageState.missing = SIGHTS.filter((s) => !map[s.id]).map((s) => s.id);
  try { localStorage.setItem(IMG_KEY, JSON.stringify({ at: Date.now(), map })); } catch {}
}

function applyImages(map) {
  for (const [id, src] of Object.entries(map || {})) {
    const shot = document.getElementById(`shot-${id}`);
    if (!shot || shot.dataset.loaded === "1") continue;
    const img = new Image();
    img.alt = "";
    img.decoding = "async";
    img.onload = () => {
      shot.dataset.loaded = "1";
      shot.appendChild(img);
      requestAnimationFrame(() => img.classList.add("in"));
      const ph = shot.querySelector(".ph");
      if (ph) ph.hidden = true;
    };
    img.onerror = () => { imageState.missing.push(id); };
    img.src = src;
  }
}

/* Type imageDebug() in the console to see what happened. */
window.imageDebug = () => {
  console.table({
    source: imageState.source,
    found: imageState.found,
    of: SIGHTS.length,
    error: imageState.error || "none",
  });
  if (imageState.missing.length) console.log("missing:", imageState.missing);
  console.log('Clear the cache with: localStorage.removeItem("' + IMG_KEY + '")');
  return imageState;
};

/* ---------------------------------------------------------------- render */

const COST_KEY = { free: "costFree", "free-limited": "costLimited", paid: "costPaid", mixed: "costMixed" };
const COST_CLASS = { free: "tag-green", "free-limited": "tag-coral", paid: "tag-amber", mixed: "tag-amber" };

/** Where a sight sits on the plan, if anywhere. A booking places it too. */
function planStateOf(id) {
  const b = BOOKED.find((x) => x.id === id && x.status === "booked" && x.date);
  if (b) return { from: "booked", day: b.date, start: b.time, end: b.endTime };
  const e = PLAN.find((x) => x.id === id);
  if (e) return { from: "hand", day: e.day, start: e.start, end: e.end };
  return null;
}

const whenLabel = (p) =>
  dayShort(p.day) + (p.start ? `, ${p.start}${p.end ? `–${p.end}` : ""}` : "");

function planControlHTML(s) {
  const L = t();
  const p = planStateOf(s.id);

  if (p?.from === "booked")
    return `<div class="planrow">
      <span class="tag tag-green">${ICONS.check}${esc(L.bookedFor(whenLabel(p)))}</span>
      <span class="planhint">${esc(L.bookedNote)}</span>
    </div>`;

  const days = TRIPDAYS.map((d) =>
    `<option value="${esc(d)}"${p?.day === d ? " selected" : ""}>${esc(dayShort(d))}</option>`).join("");

  return `<div class="planrow">
    ${p ? `<span class="tag tag-tint">${ICONS.calendar}${esc(L.plannedFor(whenLabel(p)))}</span>` : ""}
    <button class="btn btn-sm ${p ? "btn-ghost" : "btn-tint"} ${p ? "" : "right"}" type="button" data-plan="${esc(s.id)}"
            aria-expanded="false">${p ? "" : ICONS.calendar}${esc(p ? L.changeDay : L.planIt)}</button>
    ${p ? `<button class="btn btn-sm btn-ghost danger" type="button" data-planoff="${esc(s.id)}">${esc(L.takeOff)}</button>` : ""}
  </div>
  <div class="planedit" id="plan-${esc(s.id)}" hidden>
    <label class="field"><span>${esc(L.planDay)}</span><select class="select" data-pday>${days}</select></label>
    <label class="field time"><span>${esc(L.planFrom)}</span><input class="input" type="time" data-pfrom value="${esc(p?.start ?? "")}"></label>
    <label class="field time"><span>${esc(L.planTo)}</span><input class="input" type="time" data-pto value="${esc(p?.end ?? "")}"></label>
    <button class="btn btn-primary btn-sm" type="button" data-psave="${esc(s.id)}">${esc(L.planSave)}</button>
  </div>`;
}

function cardHTML(s) {
  const L = t();
  const custom = !!s.custom;
  const shot = custom
    ? `<div class="shot blank" id="shot-${esc(s.id)}"></div>`
    : `<div class="shot" id="shot-${esc(s.id)}">
         <div class="ph" aria-hidden="true">${esc(title(s).charAt(0))}</div>
         <span class="rank tag tag-solid tag-sm">#${s.rank}</span>
         <span class="cost tag ${COST_CLASS[s.cost] || "tag-neutral"} tag-sm">${esc(L[COST_KEY[s.cost]] || "")}</span>
       </div>`;

  const head = custom
    ? `<div class="custom-head"><h2>${esc(s.name)}</h2><span class="tag tag-violet tag-sm">${esc(L.added)}</span></div>
       <p class="byline">${esc(L.addedBy(s.addedBy))}</p>`
    : `<h2>${esc(title(s))}</h2>
       <p class="where">${esc(s.area)} · ${esc(s.station)}</p>`;

  const bookTag = s.bookingRequired ? `<span class="tag tag-coral tag-sm">${esc(L.booking)}</span>` : "";

  // Added sights carry the same two facts as the built-ins, but nobody can know
  // them at the time of adding, so they are editable afterwards.
  const money = custom
    ? `<p class="price"><span>${s.costs ? esc(s.priceLabel || L.costsSomething) : esc(L.costsNothing)}</span>${bookTag}</p>`
    : `<p class="price">${priceOf(s) ? `<span>${esc(priceOf(s))}</span>` : ""}${bookTag}</p>`;

  const desc = custom
    ? (s.summary ? `<p class="desc">${esc(s.summary)}</p>` : "") + money
    : `<p class="desc">${esc(blurb(s))}</p>${money}`;

  const link = s.url
    ? `<a class="more" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(L.readMore)}${ICONS.external}</a>`
    : "";

  return `
  <article class="sight card${custom ? " is-custom" : ""}" id="card-${esc(s.id)}" data-cost="${esc(s.cost || "free")}">
    ${shot}
    <div class="body">${head}${desc}${link}</div>
    <div class="foot">
      <button class="want btn btn-sm btn-outline" type="button" data-id="${esc(s.id)}" aria-pressed="false" disabled>
        <span class="h-off">${ICONS.heart}</span><span class="h-on">${ICONS.heartFill}</span><span class="txt">${esc(L.want)}</span>
      </button>
      <button class="talk btn btn-sm btn-ghost" type="button" data-talk="${esc(s.id)}" aria-expanded="false"
              aria-controls="thread-${esc(s.id)}">
        ${ICONS.bubble}<span class="n">0</span>
      </button>
      ${custom ? `<button class="btn btn-sm btn-ghost" type="button" data-edit="${esc(s.id)}">${esc(L.editCost)}</button>` : ""}
      <span class="tally" id="tally-${esc(s.id)}"></span>
      ${custom ? `<button class="remove btn btn-sm btn-ghost danger" type="button" data-remove="${esc(s.id)}" hidden>${esc(L.remove)}</button>` : ""}
    </div>
    ${custom ? `<div class="costedit" id="edit-${esc(s.id)}" hidden>
      <label class="check">
        <input type="checkbox" data-ecosts${s.costs ? " checked" : ""}>
        <span>${esc(L.addCosts)}</span>
      </label>
      <input class="input eprice" type="text" maxlength="40" data-eprice
             placeholder="${esc(L.addPrice)}" value="${esc(s.priceLabel || "")}"${s.costs ? "" : " disabled"}>
      <label class="check">
        <input type="checkbox" data-ebooking${s.bookingRequired ? " checked" : ""}>
        <span>${esc(L.addBooking)}</span>
      </label>
      <button class="btn btn-primary btn-sm" type="button" data-esave="${esc(s.id)}">${esc(L.save)}</button>
    </div>` : ""}
    ${planControlHTML(s)}
    <div class="thread" id="thread-${esc(s.id)}" hidden></div>
  </article>`;
}

let wired = false;
function render() {
  $("#grid").innerHTML = all().map(cardHTML).join("");
  if (!wired) { $("#grid").addEventListener("click", onClick); wired = true; }
  paintTallies();
  paintThreads();
  applyFilter();
}

function paintTallies() {
  const key = norm(me);
  for (const s of all()) {
    const voters = VOTES[s.id] || [];
    const mine   = key && voters.some((v) => norm(v) === key);

    const tally = document.getElementById(`tally-${s.id}`);
    if (tally) {
      tally.innerHTML = voters.length
        ? `<b>${voters.length}</b> ${voters.length === 1 ? esc(t().vote) : esc(t().votes)}
           <span class="voters">${esc(voters.join(" · "))}</span>`
        : `<span class="voters">${esc(t().noVotes)}</span>`;
    }

    const btn = document.querySelector(`.want[data-id="${CSS.escape(s.id)}"]`);
    if (btn) {
      btn.setAttribute("aria-pressed", String(!!mine));
      btn.disabled = !me;
      btn.querySelector(".txt").textContent = mine ? t().wanted : t().want;
    }

    const rm = document.querySelector(`.remove[data-remove="${CSS.escape(s.id)}"]`);
    if (rm) rm.hidden = !(key && s.addedBy && norm(s.addedBy) === key);
  }
}

function ago(ms) {
  const L = t();
  const mins = Math.floor((Date.now() - ms) / 60000);
  if (mins < 1)   return L.justNow;
  if (mins < 60)  return L.minsAgo(mins);
  const hours = Math.floor(mins / 60);
  if (hours < 24) return L.hoursAgo(hours);
  return L.daysAgo(Math.floor(hours / 24));
}

function threadHTML(id) {
  const L = t();
  const list = COMMENTS[id] || [];
  const key = norm(me);

  const items = list.length
    ? list.map((c) => `
        <div class="cmt">
          <div class="meta-line">
            <b>${esc(c.author)}</b><span>${esc(ago(c.createdAt))}</span>
            ${key && norm(c.author) === key
              ? `<button class="del" type="button" data-delc="${esc(c.id)}">${esc(L.del)}</button>`
              : ""}
          </div>
          <p>${esc(c.body)}</p>
        </div>`).join("")
    : `<p class="none">${esc(L.noComments)}</p>`;

  return `${items}
    <form data-cform="${esc(id)}">
      <textarea class="textarea" maxlength="500" rows="2" placeholder="${esc(L.commentPlaceholder)}"
                aria-label="${esc(L.comments)}"></textarea>
      <button class="send btn btn-primary btn-sm" type="submit"${me ? "" : " disabled"}>${esc(L.send)}</button>
    </form>`;
}

/** Repaint counts, and the contents of any thread that's currently open. */
function paintThreads() {
  for (const s of all()) {
    const n = (COMMENTS[s.id] || []).length;
    const btn = document.querySelector(`.talk[data-talk="${CSS.escape(s.id)}"]`);
    if (btn) {
      btn.querySelector(".n").textContent = n;
      btn.title = `${n} ${n === 1 ? t().comment : t().commentsN}`;
    }
    const box = document.getElementById(`thread-${s.id}`);
    if (!box) continue;
    const open = openThreads.has(s.id);
    box.hidden = !open;
    btn?.setAttribute("aria-expanded", String(open));
    if (open && document.activeElement?.tagName !== "TEXTAREA") {
      box.innerHTML = threadHTML(s.id);
    }
  }
}

function applyFilter() {
  const key = norm(me);
  const grid = $("#grid");
  let shown = 0;

  const ordered = all().slice();
  if (filter === "top") {
    ordered.sort((a, b) =>
      (VOTES[b.id]?.length || 0) - (VOTES[a.id]?.length || 0) ||
      (a.rank ?? 999) - (b.rank ?? 999));
  } else {
    ordered.sort((a, b) => (a.rank ?? 999) - (b.rank ?? 999));
  }

  for (const s of ordered) {
    const card = document.getElementById(`card-${s.id}`);
    if (!card) continue;
    grid.appendChild(card);

    const show = matchesFilter(s, filter, key);

    card.classList.toggle("hide", !show);
    if (show) shown++;
  }

  $("#empty").textContent = t().empty;
  $("#empty").hidden = shown > 0;

  renderCounts();
}

/** Does a sight pass one of the filter buttons? Shared so the counts can't
 *  drift from what pressing the button actually shows. */
function matchesFilter(s, which, key) {
  const voters = VOTES[s.id] || [];
  switch (which) {
    case "all":   return true;
    case "free":  return !s.custom && s.cost !== "paid" && s.cost !== "mixed";
    case "paid":  return !s.custom && (s.cost === "paid" || s.cost === "mixed");
    case "added": return !!s.custom;
    case "mine":  return !!key && voters.some((v) => norm(v) === key);
    case "top":   return voters.length > 0;
    default:      return true;
  }
}

/** Counts on the buttons and the strip above them, the way the other pages do. */
function renderCounts() {
  const L = t();
  const key = norm(me);
  const list = all();
  const count = (which) => list.filter((s) => matchesFilter(s, which, key)).length;

  for (const btn of $("#filters").querySelectorAll("button[data-f]")) {
    const label = { all: L.all, free: L.free, paid: L.paid,
                    added: L.added, mine: L.mine, top: L.top }[btn.dataset.f];
    btn.innerHTML = `${esc(label)} <b>${count(btn.dataset.f)}</b>`;
  }

  const people = new Set(Object.values(VOTES).flat().map(norm));
  $("#stats").innerHTML = [
    [list.length, L.statSights],
    [count("top"), L.statVoted],
    [count("mine"), L.statMine],
    [people.size, L.statPeople],
  ].map(([v, k]) => `<div class="stat"><b>${v}</b><span>${esc(k)}</span></div>`).join("");
}

function paintWhoLine() {
  const total = Object.values(VOTES).reduce((n, v) => n + v.length, 0);
  const people = new Set();
  for (const list of Object.values(VOTES)) list.forEach((v) => people.add(norm(v)));
  $("#who-line").innerHTML = me
    ? t().votingAs(esc(me), total, people.size)
    : t().enterName(total, people.size);
}

function notify(message) {
  const el = $("#notice");
  el.textContent = message || "";
  el.hidden = !message;
}

/* --------------------------------------------------------------- language */

function paintChrome() {
  const L = t();
  setTrip(TRIPINFO, L.pageTitle);
  $("#kicker").textContent = tripKicker(TRIPINFO);
  $("#kicker").hidden = !$("#kicker").textContent;
  $("#add-costs-label").textContent = L.addCosts;
  $("#add-price").placeholder       = L.addPrice;
  $("#add-booking-label").textContent = L.addBooking;
  $("#add-money-hint").textContent  = L.addMoneyHint;
  $("#headline").textContent = L.headline;
  $("#lede").textContent     = L.lede(all().length);
  $("#filter-label").textContent = L.show;

  $("#add-summary").textContent = L.addSummary;
  $("#l-add-name").textContent = L.addName;
  $("#l-add-url").innerHTML  = `${esc(L.addUrl)} <span class="hint">${esc(L.optional)}</span>`;
  $("#l-add-desc").innerHTML = `${esc(L.addDesc)} <span class="hint">${esc(L.optional)}</span>`;
  $("#add-name").placeholder   = L.namePlaceholder;
  $("#add-submit").textContent = L.addSubmit;
  $("#add-hint").textContent   = L.addHint;
  $("#add-desc").placeholder   = L.descPlaceholder;
  $("#foot-note").textContent  = L.footNote;
  $(".addbox .plus").innerHTML = ICONS.plus;

  backToTop(L.backToTop);
  renderCounts();   // labels, before any sights have arrived
}

/* --------------------------------------------------------------- actions */

async function onClick(event) {
  const talk = event.target.closest(".talk");
  if (talk) {
    const id = talk.dataset.talk;
    if (openThreads.has(id)) openThreads.delete(id);
    else openThreads.add(id);
    const box = document.getElementById(`thread-${id}`);
    if (box) box.innerHTML = threadHTML(id);
    paintThreads();
    if (openThreads.has(id)) box?.querySelector("textarea")?.focus();
    return;
  }

  const delc = event.target.closest(".del");
  if (delc) return onDeleteComment(delc.dataset.delc);

  const rm = event.target.closest(".remove");
  if (rm) return onRemove(rm.dataset.remove);

  const ed = event.target.closest("[data-edit]");
  if (ed) {
    const box = document.getElementById(`edit-${ed.dataset.edit}`);
    if (!box) return;
    box.hidden = !box.hidden;
    ed.setAttribute("aria-expanded", String(!box.hidden));
    return;
  }

  // The price only means anything once you've said it costs something.
  const ck = event.target.closest("[data-ecosts]");
  if (ck) {
    const price = ck.closest(".costedit").querySelector("[data-eprice]");
    price.disabled = !ck.checked;
    if (!ck.checked) price.value = "";
    return;
  }

  const save = event.target.closest("[data-esave]");
  if (save) return onSaveCost(save.dataset.esave);

  const pb = event.target.closest("[data-plan]");
  if (pb) {
    const box = document.getElementById(`plan-${pb.dataset.plan}`);
    if (!box) return;
    box.hidden = !box.hidden;
    pb.setAttribute("aria-expanded", String(!box.hidden));
    return;
  }

  const psave = event.target.closest("[data-psave]");
  if (psave) return onPlanSave(psave.dataset.psave);

  const poff = event.target.closest("[data-planoff]");
  if (poff) return onPlanRemove(poff.dataset.planoff);

  const btn = event.target.closest(".want");
  if (!btn || btn.disabled) return;
  if (!me) return askName();

  const id     = btn.dataset.id;
  const wanted = btn.getAttribute("aria-pressed") !== "true";
  btn.disabled = true;

  try {
    const data = await api("/api/vote", {
      method: "POST",
      body: JSON.stringify({ sightId: id, voter: me, wanted }),
    });
    VOTES = data.votes || {};
    CUSTOM = data.custom || CUSTOM;
    COMMENTS = data.comments || COMMENTS;
    notify("");
    paintTallies(); paintThreads(); applyFilter(); paintWhoLine();
  } catch (err) {
    setStatus(t().voteFail(err.message), "err");
  } finally {
    btn.disabled = !me;
  }
}

/** Shared by both plan actions: they return the same snapshot. */
async function planCall(path, body) {
  if (!me) return askName();
  try {
    const data = await api(path, { method: "POST", body: JSON.stringify({ voter: me, ...body }) });
    CUSTOM = data.custom;
    VOTES = data.votes;
    COMMENTS = data.comments;
    PLAN = data.plan || [];
    BOOKED = data.bookings || [];
    render();
  } catch (err) {
    setStatus(err.message, "err");
  }
}

async function onPlanSave(id) {
  const box = document.getElementById(`plan-${id}`);
  if (!box) return;
  const from = box.querySelector("[data-pfrom]").value || null;
  const to = box.querySelector("[data-pto]").value || null;
  return planCall("/api/plan/set", {
    sightId: id,
    day: box.querySelector("[data-pday]").value,
    start: from,
    end: to,
  });
}

const onPlanRemove = (id) => planCall("/api/plan/remove", { sightId: id });

async function onSaveCost(id) {
  if (!me) return askName();
  const box = document.getElementById(`edit-${id}`);
  if (!box) return;

  const costs = box.querySelector("[data-ecosts]").checked;
  const btn = box.querySelector("[data-esave]");
  btn.disabled = true;

  try {
    const data = await api("/api/sights/edit", {
      method: "POST",
      body: JSON.stringify({
        voter: me,
        id,
        costs,
        bookingRequired: box.querySelector("[data-ebooking]").checked,
        priceLabel: costs ? box.querySelector("[data-eprice]").value || null : null,
      }),
    });
    CUSTOM = data.custom;
    VOTES = data.votes;
    COMMENTS = data.comments;
    render();
  } catch (err) {
    setStatus(err.message, "err");
  } finally {
    btn.disabled = false;
  }
}

async function onRemove(id) {
  const entry = CUSTOM.find((c) => c.id === id);
  if (!entry) return;
  if (!window.confirm(t().removeConfirm(entry.name))) return;

  try {
    const data = await api("/api/sights/remove", {
      method: "POST",
      body: JSON.stringify({ id, voter: me }),
    });
    CUSTOM = data.custom || [];
    VOTES  = data.votes || {};
    COMMENTS = data.comments || {};
    render(); paintWhoLine(); notify("");
  } catch (err) {
    setStatus(err.message, "err");
  }
}

async function onDeleteComment(id) {
  if (!window.confirm(t().delConfirm)) return;
  try {
    const data = await api("/api/comments/remove", {
      method: "POST",
      body: JSON.stringify({ id, voter: me }),
    });
    COMMENTS = data.comments || {};
    VOTES = data.votes || {};
    paintThreads();
    notify("");
  } catch (err) {
    setStatus(err.message, "err");
  }
}

/* Comment forms are created and destroyed constantly, so listen on the grid. */
$("#grid").addEventListener("submit", async (event) => {
  const form = event.target.closest("form[data-cform]");
  if (!form) return;
  event.preventDefault();

  const id = form.dataset.cform;
  const area = form.querySelector("textarea");
  const text = area.value.trim();

  if (!me) { setStatus(t().needNameComment, "err"); askName(); return; }
  if (!text) return;

  const send = form.querySelector(".send");
  send.disabled = true;

  try {
    const data = await api("/api/comments/add", {
      method: "POST",
      body: JSON.stringify({ sightId: id, voter: me, body: text }),
    });
    COMMENTS = data.comments || {};
    VOTES = data.votes || {};
    area.value = "";
    area.blur();
    paintThreads();
    notify("");
  } catch (err) {
    setStatus(err.message, "err");
  } finally {
    send.disabled = false;
  }
});

$("#add-costs").addEventListener("change", (ev) => {
  const price = $("#add-price");
  price.disabled = !ev.target.checked;
  if (!ev.target.checked) price.value = "";
  else price.focus();
});

$("#addform").addEventListener("submit", async (event) => {
  event.preventDefault();
  const err = $("#add-err");
  err.hidden = true;

  if (!me) {
    err.textContent = t().addNeedName;
    err.hidden = false;
    askName();
    return;
  }

  const costs = $("#add-costs").checked;
  const payload = {
    voter: me,
    name: $("#add-name").value,
    url: $("#add-url").value,
    summary: $("#add-desc").value,
    costs,
    bookingRequired: $("#add-booking").checked,
    priceLabel: costs ? $("#add-price").value || null : null,
  };

  const submit = $("#add-submit");
  submit.disabled = true;

  try {
    const data = await api("/api/sights/add", {
      method: "POST",
      body: JSON.stringify(payload),
    });
    CUSTOM = data.custom || [];
    VOTES  = data.votes || {};
    COMMENTS = data.comments || {};
    $("#addform").reset();
    $("#add-price").disabled = true;
    $("#addbox").open = false;
    render(); paintWhoLine(); notify("");
    document.getElementById(`card-${data.id}`)?.scrollIntoView({ behavior: "smooth", block: "center" });
  } catch (e) {
    err.textContent = e.message;
    err.hidden = false;
  } finally {
    submit.disabled = false;
  }
});

onName((name) => {
  me = name;
  paintTallies(); paintThreads(); applyFilter(); paintWhoLine();
});

$("#filters").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  filter = btn.dataset.f;
  for (const b of $("#filters").querySelectorAll("button")) {
    b.setAttribute("aria-pressed", String(b === btn));
  }
  applyFilter();
});

/* ------------------------------------------------------------------ boot */

onLang(() => {
  paintChrome();
  if (SIGHTS.length) { render(); paintWhoLine(); }
});

load()
  .then(() => { paintChrome(); paintWhoLine(); notify(""); })
  .catch((err) => {
    notify(t().loadFail(err.message));
  });

setInterval(refresh, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
